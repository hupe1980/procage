name: release

# Publishes the crates to crates.io and creates the GitHub release when a tag
# `vX.Y.Z` matching procage's version is pushed. Publishing uses crates.io
# Trusted Publishing: a short-lived token is exchanged for this job's OIDC
# identity (repository, workflow `release.yml`, environment `crates-io`) and
# revoked when the job ends. No long-lived secret is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: The tag names procage's version
        run: |
          version=$(cargo pkgid -p procage | sed 's/.*[#@]//')
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "tag $GITHUB_REF_NAME does not match procage $version" >&2; exit 1; }
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish (dependencies first; versions already on crates.io are skipped)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # A new crate's first version needs an API token: Trusted
          # Publishing is configured per existing crate.
          for crate in procage-policy procage-proxy procage; do
            version=$(cargo pkgid -p "$crate" | sed 's/.*[#@]//')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'procage-release (github.com/hupe1980/procage)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "procage $GITHUB_REF_NAME"

  # The Python wheels: built from the tag as CI builds them, tested from the
  # exact file that is uploaded, after the crates are on crates.io.
  wheels:
    name: wheel ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The wheel names the tag's version
        run: |
          version=$(cargo pkgid -p procage-py | sed 's/.*[#@]//')
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "tag $GITHUB_REF_NAME does not match procage-py $version" >&2; exit 1; }
      - name: Build
        run: bindings/python/wheel.sh build "$PWD/dist"
      - name: Test the built wheel (escape subset and example)
        run: bindings/python/wheel.sh test "$PWD/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  # PyPI Trusted Publishing: the upload is authorised by this job's OIDC
  # identity (workflow release.yml, environment pypi); no token is stored.
  pypi:
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
