name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job uses secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  MSRV: "1.99.0"

jobs:
  gates:
    name: gates (fmt, lint, doc, deny, msrv, no-std, semver, features, planning paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt \
            --target thumbv7em-none-eabihf,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-apple-darwin
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-deny,cargo-semver-checks
      - run: just fmt-check lint doc deny msrv no-std semver features planning-paths
      - name: The macOS backend (lint and docs, cross-checked)
        run: |
          cargo clippy --workspace --all-targets --all-features --target aarch64-apple-darwin -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --target aarch64-apple-darwin
      - name: Tests (the kernel facts run in the lanes below)
        run: |
          cargo test --workspace --exclude procage-kernel-facts
          cargo test -p procage-policy --all-features
          cargo test -p procage --features tokio,proxy --lib --test tokio --test proxy
          cargo test -p procage-kernel-facts --lib --bins

  macos:
    name: facts macos-26 arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Lane
        run: sw_vers; uname -m; csrutil status || true
      - name: Kernel facts
        run: cargo test --locked -p procage-kernel-facts --test kernel_facts
      - name: Secret directories the hard-deny tests check
        run: mkdir -p ~/.ssh ~/.aws ~/.gnupg
      - name: Caged children (spawn tests)
        run: cargo test --locked -p procage --lib --test spawn_macos --test native --test exec --test receipts --test audit --test oracle
      - name: Escape suite
        run: cargo test --locked -p procage --test escape_macos
      - name: Escape suite, the async handle and the proxy (tokio, proxy)
        run: cargo test --locked -p procage --features tokio,proxy --test escape_macos --test tokio --test proxy
        env:
          PROCAGE_ASYNC: "1"
      - name: Escape suite with violation reporting
        run: cargo test --locked -p procage --test escape_macos
        env:
          PROCAGE_ESCAPE_VIOLATIONS: "1"
      - name: Escape suite on base V3 with violation reporting
        run: cargo test --locked -p procage --test escape_macos
        env:
          PROCAGE_ESCAPE_BASE: v3
          PROCAGE_ESCAPE_VIOLATIONS: "1"
      - name: Lowered profiles compile (well-formedness only)
        run: cargo test --locked -p procage-kernel-facts --test policy_compiles
      - name: Spawn benchmark (indicative; never fails on timing)
        run: cargo bench --locked -p procage --bench spawn -- --quick

  linux:
    name: facts ${{ matrix.os }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        config: [shipped, userns-unrestricted]
        include:
          - { config: shipped, tier: T2 }
          - { config: userns-unrestricted, tier: T1 }
    env:
      PROCAGE_KF_EXPECT_TIER: ${{ matrix.tier }}
      PROCAGE_EXPECT_TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Lift the AppArmor user-namespace restriction
        if: matrix.config == 'userns-unrestricted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lane
        run: uname -a; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
      - name: Kernel facts
        run: cargo test --locked -p procage-kernel-facts --test kernel_facts
      - name: Caged children and escape suite
        run: cargo test --locked -p procage --lib --test spawn_linux --test escape_linux --test unsafe_confined --test native --test exec --test receipts --test audit --test oracle
      - name: Escape suite, the async handle and the proxy (tokio, proxy)
        run: cargo test --locked -p procage --features tokio,proxy --test escape_linux --test tokio --test proxy
        env:
          PROCAGE_ASYNC: "1"
      - name: Escape suite with violation reporting
        run: cargo test --locked -p procage --test escape_linux
        env:
          PROCAGE_ESCAPE_VIOLATIONS: "1"
      - name: Spawn benchmark (indicative; never fails on timing)
        run: cargo bench --locked -p procage --bench spawn -- --quick

  kernels:
    name: kernel ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each kernel tag with the Landlock ABI its probe must report.
        kernel: [v5.15=1, v6.6=3, v6.8=4, v6.12=6, v7.0=8, v7.1=9, v7.2=10, v7.3.1=11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: KVM and virtme-ng
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 busybox-static zstd
          pipx install virtme-ng==1.42
      - name: The suites in the guest
        run: .github/kernel-lane.sh "${{ matrix.kernel }}"

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-fuzz
      - run: just fuzz-all 60
