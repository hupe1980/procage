name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job uses secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  MSRV: "1.99.0"

jobs:
  gates:
    name: gates (fmt, lint, doc, deny, msrv, no-std, semver, planning paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target thumbv7em-none-eabihf
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-deny,cargo-semver-checks
      - run: just fmt-check lint doc deny msrv no-std semver planning-paths
      - name: Tests (the kernel facts run in the lanes below)
        run: |
          cargo test --workspace --exclude procage-kernel-facts
          cargo test -p procage-policy --all-features
          cargo test -p procage-kernel-facts --lib --bins

  macos:
    name: facts ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Preview lanes may be unavailable or differ; they never block a merge.
    continue-on-error: ${{ matrix.allowed-missing }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-26 arm64, os: macos-26, target: aarch64-apple-darwin, allowed-missing: false }
          - { name: macos newest, os: macos-latest, target: aarch64-apple-darwin, allowed-missing: true }
          - { name: macos-26 x86_64 (Rosetta), os: macos-26, target: x86_64-apple-darwin, allowed-missing: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: Lane
        run: sw_vers; uname -m; csrutil status || true
      - name: Kernel facts
        run: cargo test --locked -p procage-kernel-facts --test kernel_facts --target ${{ matrix.target }}
      - name: Caged children (spawn tests)
        run: cargo test --locked -p procage --test spawn_macos --target ${{ matrix.target }}
      - name: Escape suite
        run: cargo test --locked -p procage --test escape_macos --target ${{ matrix.target }}
      - name: Escape suite with violation reporting
        run: cargo test --locked -p procage --test escape_macos --target ${{ matrix.target }}
        env:
          PROCAGE_ESCAPE_VIOLATIONS: "1"
      - name: Escape suite on base V3 with violation reporting
        run: cargo test --locked -p procage --test escape_macos --target ${{ matrix.target }}
        env:
          PROCAGE_ESCAPE_BASE: v3
          PROCAGE_ESCAPE_VIOLATIONS: "1"
      - name: Lowered profiles compile (well-formedness only)
        run: cargo test --locked -p procage-kernel-facts --test policy_compiles --target ${{ matrix.target }}

  linux:
    name: facts ${{ matrix.os }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        config: [shipped, userns-unrestricted]
        include:
          - { config: shipped, tier: T2 }
          - { config: userns-unrestricted, tier: T1 }
    env:
      PROCAGE_KF_EXPECT_TIER: ${{ matrix.tier }}
      PROCAGE_EXPECT_TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Lift the AppArmor user-namespace restriction
        if: matrix.config == 'userns-unrestricted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lane
        run: uname -a; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
      - name: Kernel facts
        run: cargo test --locked -p procage-kernel-facts --test kernel_facts
      - name: Caged children and escape suite
        run: cargo test --locked -p procage --test spawn_linux --test escape_linux

  linux-next:
    name: facts ubuntu-26.04 (preview, recorded only)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Kernel facts
        run: cargo test --locked -p procage-kernel-facts --test kernel_facts
      - name: Caged children and escape suite
        run: cargo test --locked -p procage --test spawn_linux --test escape_linux

  linux-container:
    name: facts debian 13 container (Docker default seccomp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.99-trixie
    env:
      PROCAGE_KF_EXPECT_TIER: T2
      PROCAGE_EXPECT_TIER: T2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kernel facts
        run: cargo test --locked -p procage-kernel-facts --test kernel_facts
      - name: Caged children and escape suite
        run: cargo test --locked -p procage --test spawn_linux --test escape_linux

  fuzz:
    name: fuzz smoke (policy crate, nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-fuzz
      - run: just fuzz-all 30
