[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "procage"
dynamic = ["version"]
description = "Process sandboxing for macOS (Seatbelt) and Linux (Landlock, seccomp, namespaces): run commands caged from Python"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "hupe1980" }]
requires-python = ">=3.11"
keywords = ["sandbox", "seatbelt", "landlock", "seccomp", "agents", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/hupe1980/procage"
Documentation = "https://hupe1980.github.io/procage/docs/python/"

[tool.maturin]
python-source = "python"
module-name = "procage._native"
# Never ship bytecode a checkout happens to hold.
exclude = ["**/__pycache__/**", "**/*.pyc"]
features = []
