requirements:
- id: SR-001
  statement: On both tiers the child MUST be refused every file access its policy's rules and grants do not allow,
    and a grant MUST apply only to the spawn it was bound for.
  priority: P1
  mitigations:
  - mitigation.landlock-ruleset
  acceptance:
  - given: read on R and write on W, on T1 and T2
    then: only the first two succeed
    when: the child reads R/f, writes W/g, reads a file outside both and writes R/h
  - given: a grant bound for one spawn
    then: it is refused
    when: a second spawn without the binding reads the path
  tasks: []
- id: SR-002
  statement: The child MUST be refused ptrace, io_uring_setup, bpf, keyctl, perf_event_open, userfaultfd, unshare,
    mount and the other hard-deny syscalls with EPERM, on both tiers.
  priority: P1
  mitigations:
  - mitigation.seccomp-hard-deny
  acceptance:
  - given: any policy on T1 and T2
    then: each fails with EPERM
    when: the child calls ptrace, io_uring_setup, bpf, keyctl, unshare and mount
  tasks: []
- id: SR-003
  statement: The seccomp filter MUST kill a syscall made through a foreign architecture or the x32 ABI.
  priority: P1
  mitigations:
  - mitigation.seccomp-hard-deny
  acceptance:
  - given: the built filter
    then: the verdict is kill
    when: it is evaluated for a foreign audit architecture and for an x32 syscall number
  tasks: []
- id: SR-004
  statement: Preparation MUST fail with a named capability gap for every construct the tier cannot enforce unless
    that degradation is allowed by name, and MUST fail with Unsupported on a host without the required Landlock
    ABI or when a tier the host lacks is requested.
  priority: P1
  mitigations:
  - mitigation.tier-gaps
  acceptance:
  - given: T2 and Protect inside a write rule
    then: it fails with a gap naming fs-protect, and with that degradation allowed the plan lists it
    when: the cage is prepared
  - given: a host without user namespaces
    then: it fails with Unsupported
    when: T1 is requested
  tasks: []
- id: SR-005
  statement: A failing step in the child MUST be reported as Apply with the step and errno, and the target MUST
    NOT run; the child MUST verify seccomp filter mode and Landlock before exec.
  priority: P1
  mitigations:
  - mitigation.verify-and-step-errors
  acceptance:
  - given: a forced failure in a child step
    then: the error names the step and the target did not run
    when: spawning
  tasks: []
- id: SR-006
  statement: On Linux the secret paths in every home MUST stay unreadable to the child on T1 even under a covering
    read rule, and on T2 a covering rule or grant MUST be a gap or a refused grant, unless the secrets class is
    waived by name.
  priority: P1
  mitigations:
  - mitigation.linux-class-masks
  acceptance:
  - given: T1 and read on a home with .ssh and .aws
    then: both are refused or empty and listing the home succeeds
    when: the child lists them
  - given: T2 and a grant bound to a home that holds .ssh
    then: the grant is refused naming secrets
    when: spawning
  tasks: []
- id: SR-007
  statement: On T1 the child MUST NOT write existing trust-handoff or persistence paths under writable rules or
    in homes, nor rename or remove an existing .git, while .git/objects and ordinary files stay writable; on T2
    a covering write rule MUST be a gap.
  priority: P1
  mitigations:
  - mitigation.linux-class-masks
  acceptance:
  - given: T1 and write on W with .git/hooks, .vscode and .bashrc
    then: each is refused and W/.git/objects/x and W/src/x succeed
    when: the child writes each and renames .git
  - given: T2 and write on W
    then: it fails with a gap naming hd-trust-handoff, and with the class waived the plan lists the waiver
    when: the cage is prepared
  - given: trust-handoff waived on T1
    then: it succeeds
    when: the child writes W/.git/hooks/x
  tasks: []
- id: SR-008
  statement: On T1 the child MUST hold no capabilities and MUST NOT undo a mount (umount, remount, new namespace).
  priority: P1
  mitigations:
  - mitigation.no-caps-locked-mounts
  acceptance:
  - given: T1 with a protected subtree
    then: the sets are empty and both calls fail and the subtree stays read-only (EROFS)
    when: the child reads its capability sets and tries umount and a rw remount
  tasks: []
- id: SR-009
  statement: With Network::None the child MUST NOT reach any socket endpoint on T1 or T2.
  priority: P1
  mitigations:
  - mitigation.netns-or-socket-deny
  acceptance:
  - given: Network::None and a listener on the host loopback
    then: it fails on both tiers
    when: the child connects
  tasks: []
- id: SR-010
  statement: The Linux child MUST get macOS hygiene parity, with only standard and handed-over descriptors, the
    denylisted environment dropped, its own session, and the tree killed on drop.
  priority: P2
  mitigations:
  - mitigation.hygiene-parity
  acceptance:
  - given: a leaked descriptor and passthrough env with GITHUB_TOKEN
    then: neither reaches the child and a handed-over descriptor does
    when: spawning
  - given: a child with a grandchild
    then: both are gone
    when: the handle drops
  tasks: []
- id: SR-011
  statement: The spawn-time walk MUST NOT follow symbolic links and MUST fail the spawn when a tree exceeds the
    bound.
  priority: P2
  mitigations:
  - mitigation.bounded-walk
  acceptance:
  - given: a writable tree with a symlink to a directory outside it
    then: the walk does not enter the target
    when: spawning
  - given: a bound lower than the tree size
    then: the spawn fails naming the tree
    when: spawning
  tasks: []
- id: SR-012
  statement: The lowering table MUST state each Linux outcome as the backend applies it, including the gaps this
    feature leaves, and the docs MUST keep the escape statuses unchanged.
  priority: P2
  mitigations:
  - mitigation.honest-linux-docs
  acceptance:
  - given: the lowering table fixture test
    then: every Linux cell matches the lowering and names the gaps
    when: it runs
  tasks: []
