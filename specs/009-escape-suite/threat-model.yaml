otmVersion: 0.2.0
project:
  id: 009-escape-suite
  name: The escape suite
threatspec:
  actors:
  - id: actor.child-code
    name: Adaptive code inside a caged child that a canary spawns (the canary plays it)
    trust: untrusted
  - id: actor.contributor
    name: Contributor who edits a mitigation, a canary, the catalog or the gate
    trust: semi-trusted
  - id: actor.reader
    name: User who decides from the published catalog whether procage fits their threat model
    trust: trusted
  dispositions:
  - disposition: not-applicable
    reason: no authentication surface
    technique: identity-spoofing
  - disposition: not-applicable
    reason: 'no network-boundary surface: canaries run locally and the gate reads repository files'
    technique: data-tampering-in-transit
  - disposition: no-threat-detected
    reason: 'checked component.catalog-gate: the catalog is parsed as a fixed table grammar and evidence paths are
      restricted to two files; nothing is executed'
    technique: injection
  - disposition: not-applicable
    reason: no multi-tenant surface
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: 'no llm-inference surface: procage calls no language model (LLM-driven code is the adversary inside
      the child)'
    technique: prompt-injection-direct
  - disposition: not-applicable
    reason: no untrusted-content-to-model surface
    technique: prompt-injection-indirect
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: sensitive-information-disclosure
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: excessive-agency
  - disposition: not-applicable
    reason: 'no model-supply-chain surface: no models, adapters or datasets'
    technique: model-supply-chain
  - disposition: not-applicable
    reason: no persistent-model-input surface
    technique: training-data-poisoning
  - disposition: not-applicable
    reason: no cost-bearing-inference surface
    technique: unbounded-consumption
  - disposition: not-applicable
    reason: no user-facing-generation surface; overclaiming in docs is modelled under STRIDE as threat.overclaimed-enforcement
    technique: misinformation
  - disposition: not-applicable
    reason: no system-prompt surface
    technique: hidden-context-exposure
  - disposition: not-applicable
    reason: no retrieval-path surface
    technique: vector-embedding-weakness
  - disposition: not-applicable
    reason: no model-output surface
    technique: improper-output-handling
  - disposition: not-applicable
    reason: no inference-endpoint surface
    technique: model-extraction
  - disposition: not-applicable
    reason: no agent surface in this feature
    technique: goal-hijack
  - disposition: not-applicable
    reason: no agent tool surface
    technique: tool-misuse
  - disposition: not-applicable
    reason: no agent identity surface
    technique: identity-privilege-abuse
  - disposition: not-applicable
    reason: no agent plugin or MCP surface
    technique: agentic-supply-chain
  - disposition: not-applicable
    reason: procage executes only the program its caller names; the adversary inside the child is modelled under
