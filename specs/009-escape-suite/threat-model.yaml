    - tests/escape_linux.rs
requirements:
- id: SR-001
  statement: Every active canary MUST assert the specific refusal (errno or typed error) and MUST include a positive
    control showing the same operation succeeds where the policy allows it.
  priority: P1
  mitigations:
  - mitigation.positive-control
  acceptance:
  - given: a canary for a file-based class
    then: the control succeeds and the attempt fails with the expected errno
    when: the child attempts the escape and the control
  - given: a canary whose attempt target does not exist
    then: it fails rather than passes
    when: it runs
  tasks: []
- id: SR-002
  statement: A syscall canary MUST report whether its lane was informative, and a kernel-surface class MUST NOT
    be marked mitigated from uninformative lanes alone.
  priority: P1
  mitigations:
  - mitigation.positive-control
  - mitigation.informative-report
  acceptance:
  - given: the Docker default seccomp lane
    then: it passes and prints which attempts were uninformative
    when: the R-28 canary runs
  - given: the T1 lane
    then: the uncaged controls succeed and the caged attempts fail with EPERM
    when: the R-28 and R-29 canaries run
  tasks: []
- id: SR-003
  statement: The gate MUST reject a mitigated or detected class without a non-ignored canary on every listed platform,
    evidence outside the platform escape-suite files, ignored canaries as evidence, and a mitigated class that has
    an open canary.
  priority: P1
  mitigations:
  - mitigation.gate-rules
  acceptance:
  - given: a class marked mitigated with a macOS canary only but listing Linux
    then: exactly the per-platform evidence rule fires
    when: the gate runs
  - given: evidence naming an ignored canary
    then: the ignored-evidence rule fires
    when: the gate runs
  - given: an open canary for a mitigated class
    then: the open-canary rule fires
    when: the gate runs
  tasks: []
- id: SR-004
  statement: Every class MUST have a canary per listed platform, and a partial class MUST have an entry under Open
    variants; the release status MUST name every open class.
  priority: P1
  mitigations:
  - mitigation.gate-rules
  acceptance:
  - given: a class with no canary for one listed platform
    then: the coverage rule fires
    when: the gate runs
  - given: a partial class without a note
    then: the open-variant rule fires
    when: the gate runs
  tasks: []
- id: SR-005
  statement: The suite MUST fail, never skip, when the parent is already sandboxed or the host tier differs from
    the expected tier, and every CI lane MUST run it with its expected tier.
  priority: P1
  mitigations:
  - mitigation.no-skip
  acceptance:
  - given: a T2 container with PROCAGE_EXPECT_TIER=T1
    then: it fails with a tier mismatch
    when: the Linux suite runs
  - given: the CI workflow
    then: every macOS and Linux lane runs the suite and Linux lanes set the expected tier
    when: it is read
  tasks: []
- id: SR-006
  statement: Canaries MUST NOT write outside scratch directories, write the real pasteboard, launch applications,
    or leave processes running.
  priority: P2
  mitigations:
  - mitigation.scratch-only
  acceptance:
  - given: a full suite run including the open canaries
    then: no canary process is alive and no file outside scratch directories changed
    when: it ends
  tasks: []
- id: SR-007
  statement: For each system at least one covered mitigation MUST be removed in a defect-injection run and a canary
    MUST fail; at least five defects in total.
  priority: P2
  mitigations:
  - mitigation.defect-injection
  acceptance:
  - given: a mitigation removed from the code
    then: the canary for its class fails
    when: the suite runs
  tasks: []
