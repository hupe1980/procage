dataflows:
- id: flow.attempt
  name: A canary's caged child attempts an escape
  source: actor.child-code
  destination: component.cage
  assets:
  - asset.mitigations
  - asset.host-state
  attributes:
    crosses:
    - tz.child
    - tz.host
- id: flow.claim
  name: Canary results become catalog statuses
  source: component.escape-suite
  destination: component.catalog
  assets:
  - asset.catalog-truth
  attributes:
    crosses:
    - tz.repo
    - tz.public
- id: flow.edit
  name: A contributor changes a mitigation, canary or status
  source: actor.contributor
  destination: component.escape-suite
  assets:
  - asset.catalog-truth
  - asset.mitigations
  attributes:
    crosses:
    - tz.repo
- id: flow.read
  name: A reader relies on the catalog
  source: component.catalog
  destination: actor.reader
  assets:
