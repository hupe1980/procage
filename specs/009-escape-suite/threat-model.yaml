  commit: b295ea6
- id: verification.sr-006.2026-10-30
  requirement: SR-006
  method: test
  evidence: tests/escape_macos.rs::r23_a_double_forked_descendant_dies_with_the_run, tests/escape_macos.rs::r23_a_launch_agent_cannot_be_planted
