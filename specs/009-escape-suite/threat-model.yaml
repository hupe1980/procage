    likelihood: 40
  attributes:
    source: spec.md#FR-013
    assets:
    - asset.host-state
    status: mitigated
    actor: actor.child-code
    elements:
    - flow.attempt
    profile: stride
    severity: high
    technique: data-tampering
- id: threat.false-pass
  name: A canary passes because the attempt fails for an unrelated reason (missing file, missing tool, wrong path,
    permission bits) and a contributor marks the class mitigated
  categories:
  - Spoofing
  risk:
    impact: 90
    likelihood: 60
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.catalog-truth
    status: mitigated
    actor: actor.contributor
    elements:
    - component.escape-suite
    - flow.claim
    profile: stride
    severity: high
    technique: repudiation
- id: threat.hidden-open-variant
