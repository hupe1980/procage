mitigations:
- id: mitigation.base-in-allow-block
  name: Base rules are emitted in the allow block; the precedence tests include a base policy
  riskReduction: 85
  attributes:
    threats:
    - threat.base-overrides-deny
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/tests/base.rs
- id: mitigation.base-refusal-tests
  name: 'Caged tests under base V1 alone: home listing and stat, temp-dir reads, /tmp writes and loopback connects
    are refused; the base lists no /Users, /private/var/folders, /private/tmp or /Volumes rule'
  riskReduction: 85
  attributes:
    threats:
    - threat.base-too-broad
    status: verified
    kind: detective
    requirements:
    - SR-001
    touchpoints:
    - tests/spawn_macos.rs
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/tests/base.rs
- id: mitigation.frozen-snapshot
  name: A test pins the exact lowered rules of base V1 per target; changing them fails the test and needs a new
    version
  riskReduction: 85
  attributes:
    threats:
    - threat.base-drift
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage-policy/tests/base.rs
    - crates/procage-policy/src/base.rs
- id: mitigation.program-set-on-every-lane
  name: The verified program set runs under base V1 on every macOS CI lane, and the docs state the release it was
    measured on
  riskReduction: 70
  attributes:
    threats:
    - threat.base-insufficient
    status: verified
    kind: detective
    requirements:
    - SR-006
    touchpoints:
    - tests/spawn_macos.rs
    - .github/workflows/ci.yml
    - src/macos/mod.rs
- id: mitigation.read-only-services
  name: Only query services are allowed (user lookup, notifications, configuration, certificate trust, Rosetta);
    handoff services stay hard-denied, and a test asserts the base names none of the hard-deny services
  riskReduction: 60
  attributes:
    threats:
    - threat.service-handoff-via-base
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - crates/procage-policy/src/base.rs
    - crates/procage-policy/tests/base.rs
- id: mitigation.tty-only-on-inherit
  name: Terminal device rules are added only with Tty::Inherit; the TIOCSTI hard deny stays last
  riskReduction: 80
  attributes:
    threats:
    - threat.tty-surface
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/tests/base.rs
requirements:
- id: SR-001
  statement: Base V1 alone MUST NOT give a caged child access to the user's home, the user's temporary directory,
    /tmp writes or the network.
  priority: P1
  mitigations:
  - mitigation.base-refusal-tests
  acceptance:
  - given: base V1 only
    then: it is refused
    when: the child lists or stats the home directory
  - given: base V1 only
    then: each is refused
    when: the child reads a temp-dir file, creates a /tmp file or connects to loopback
  tasks: []
- id: SR-002
  statement: The lowered content of base V1 MUST be pinned per target by a test, so any change fails until a new
    version is introduced.
  priority: P2
  mitigations:
  - mitigation.frozen-snapshot
  acceptance:
  - given: base V1
    then: the rules equal the pinned list
    when: it is lowered for macOS and Linux
  tasks: []
- id: SR-003
  statement: Base allows MUST be emitted before every protect, hide and hard-deny rule.
  priority: P1
  mitigations:
  - mitigation.base-in-allow-block
  acceptance:
  - given: base V1 plus a protect rule
    then: every base allow precedes the protect deny and the hard-deny tier
    when: it is lowered for macOS
  tasks: []
- id: SR-004
  statement: Terminal devices MUST be allowed only with Tty::Inherit, and the TIOCSTI deny MUST still come after
    them.
  priority: P1
  mitigations:
  - mitigation.tty-only-on-inherit
  acceptance:
  - given: base V1 with Tty::None
    then: no /dev/tty rule appears
    when: lowered
  - given: base V1 with Tty::Inherit
    then: the terminal allows precede the TIOCSTI deny
    when: lowered
  tasks: []
- id: SR-005
  statement: The base MUST allow only the listed query services and MUST NOT name any service the hard-deny tier
    denies.
  priority: P2
  mitigations:
  - mitigation.read-only-services
  acceptance:
  - given: the base service list and the hard-deny service list
    then: they are disjoint
    when: compared
  tasks: []
- id: SR-006
  statement: Every program of the verified set MUST run correctly under base V1 on the real kernel, on every macOS
    CI lane, and the docs MUST state the release measured and the programs not covered.
  priority: P2
  mitigations:
  - mitigation.program-set-on-every-lane
  acceptance:
  - given: base V1 and a granted working directory
    then: it exits 0 with correct output (user name, local zone)
    when: each program of the set runs
  tasks: []
verification:
- id: verification.sr-001.2026-10-30
  requirement: SR-001
  method: test
  evidence: tests/spawn_macos.rs::base_grants_nothing_personal; crates/procage-policy/tests/base.rs::base_names_nothing_personal
  result: pass
  verdict: verified
  justification: Under base V1 alone, a caged child is refused listing HOME, stat of HOME, reading a temp-dir file,
    creating a /tmp file and connecting to a loopback listener. The lowered base names no /Users, /private/var/folders,
    /private/tmp or /Volumes path and no network rule. Adding /Users to the base fails all three tests.
  verified_at: '2026-10-30T08:26:40Z'
  commit: 4ec115f
- id: verification.sr-002.2026-10-30
  requirement: SR-002
  method: test
  evidence: crates/procage-policy/tests/base.rs::macos_content_is_pinned; crates/procage-policy/tests/base.rs::linux_content_is_pinned
  result: pass
  verdict: verified
  justification: The exact SBPL lines of base V1 (with and without Tty::Inherit) and the exact Landlock rules at
    ABI 6 are pinned; any change fails these tests, as the injected /Users and tty defects showed.
  verified_at: '2026-10-30T08:26:40Z'
  commit: 4ec115f
- id: verification.sr-003.2026-10-30
  requirement: SR-003
  method: test
  evidence: crates/procage-policy/tests/base.rs::base_allows_come_before_every_deny
  result: pass
  verdict: verified
  justification: With base V1 and a protect rule, every allow line precedes the first deny, and the base terminal
    allow precedes the TIOCSTI deny. Emitting the base in the hard-deny block fails the test.
  verified_at: '2026-10-30T08:26:40Z'
  commit: 4ec115f
- id: verification.sr-004.2026-10-30
  requirement: SR-004
  method: test
  evidence: crates/procage-policy/tests/base.rs::a_terminal_only_with_inherit; crates/procage-policy/tests/base.rs::base_allows_come_before_every_deny
  result: pass
  verdict: verified
  justification: With Tty::None and NewPty, no /dev/tty rule appears on macOS and no tty or pts rule on Linux. With
    Inherit, macOS gets one terminal allow ahead of the TIOCSTI deny, and Linux gets two rules. Adding the tty rule
    unconditionally fails the test.
  verified_at: '2026-10-30T08:26:40Z'
  commit: 4ec115f
- id: verification.sr-005.2026-10-30
  requirement: SR-005
  method: test
  evidence: crates/procage-policy/tests/base.rs::base_services_are_not_hard_denied_services
  result: pass
  verdict: verified
  justification: No base service appears in any hard-deny mach-lookup line, and none starts with a handoff prefix
    (com.apple.lsd., com.apple.coreservices., com.apple.pasteboard). The six services are query services (user lookup,
    notifications, configuration, certificate trust, Rosetta).
  verified_at: '2026-10-30T08:26:40Z'
  commit: 4ec115f
- id: verification.sr-006.2026-10-30
  requirement: SR-006
  method: test
  evidence: tests/spawn_macos.rs::base_runs_ordinary_programs; tests/spawn_macos.rs::base_runs_a_rust_program_and_dev_null_stdio;
    crates/procage-policy/src/base.rs:1
  result: pass
  verdict: verified
  justification: All 15 programs exit 0 under base V1 on macOS 26.6.2, with correct output (id -un and date +%Z
    equal their output outside the cage). A Rust child starts without extra rules, and a /dev/null-stdio child runs.
    The CI macOS lanes run tests/spawn_macos.rs (configured, observed once pushed). The base module docs state the
    release measured, the verified programs, and that Xcode shims are not covered.
  verified_at: '2026-10-30T08:26:40Z'
  commit: 4ec115f
decisions: []
