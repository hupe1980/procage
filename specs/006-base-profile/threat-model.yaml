threats:
- id: threat.base-drift
  name: The content of base V1 changes silently in a later version of procage, loosening every policy that names
    V1
  categories:
  - Tampering
  cwes:
  - CWE-1357
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.base-content
    status: mitigated
    actor: actor.contributor
    constitution: VII. Presets are versioned and frozen
    disposition: threat
    elements:
    - flow.contributor-to-base
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.base-insufficient
  name: An OS update makes base V1 insufficient, so programs fail in confusing ways (or callers add broad rules
    to compensate) without anyone noticing
  categories:
  - Denial of Service
  cwes:
  - CWE-1059
  risk:
    impact: 50
    likelihood: 50
  attributes:
    source: spec.md#FR-008
    assets:
    - asset.base-content
    status: mitigated
    actor: actor.apple
    disposition: threat
    elements:
    - component.base-tests
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.base-overrides-deny
  name: A base allow is emitted after a protect, hide or hard-deny rule and overrides it under last-match-wins
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-696
  risk:
    impact: 85
    likelihood: 30
  attributes:
    source: spec.md#FR-006
    assets:
    - asset.user-data
    status: mitigated
    actor: actor.contributor
    disposition: threat
    elements:
    - component.base-lowering
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.base-too-broad
  name: The base grants access to the user's home, project trees, temp files, the network or writes, so every policy
    that opts in loses its confinement
  categories:
  - Information Disclosure
  - Elevation of Privilege
  cwes:
  - CWE-732
  risk:
    impact: 90
    likelihood: 50
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.user-data
    status: mitigated
    actor: actor.child-code
    constitution: I. Fail closed / VII safe presets
    disposition: threat
    elements:
    - component.base-lowering
    - flow.base-to-profile
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.service-handoff-via-base
