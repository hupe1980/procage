verdicts:
  - requirement: SR-001
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_service_and_engine_sockets_are_unreachable
    result: pass
    justification: With Network::All the T1 canary binds live fake listeners at the runtime bus and systemd/private and asserts each connect is refused (so no listener accepts), with a waived control that connects; r09_daemons_are_unreachable_without_network_access shows Network::None refuses every Unix connect. The system bus at its real path cannot be bound in these lanes; services.rs::tests::system_paths_are_found shows the system list goes through the same find() and cover path as the runtime list, which is adequate evidence for that path.
  - requirement: SR-002
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_macos.rs::r34_container_engines_are_unreachable
    result: pass
    justification: macOS refuses a live fake Lima engine socket with a waived control, and sockets.rs::every_engine_entry_matches_its_socket checks that each of the seven home entries matches a socket at its documented place and nothing beside it; on Linux T1 the canary refuses runtime docker.sock and podman/podman.sock and r34_a_socket_bound_later_is_refused an engine bound after the cage. The listed Linux system paths cannot be bound in the lanes; they share find() and the cover with the runtime list (services.rs::tests::system_paths_are_found), which is adequate.
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_fit_waives_by_name
    result: pass
    justification: The T2 canary asserts a gap naming the class and each socket path; fit relaxes service-handoff by name and its lift states tier T1 with no Landlock ABI (socket_lift in linux/mod.rs), and the relaxed cage reaches the bus; a T2 cage with no listed socket is made unchanged in r34_a_socket_bound_later_is_refused.
  - requirement: SR-004
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_an_abstract_bus_is_scoped
    result: pass
    justification: A fake abstract bus is refused with EPERM where the host has ABI 6, a cage capped at ABI 5 fails with a gap naming the @address, and the waived control connects, on each tier.
  - requirement: SR-005
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_service_and_engine_sockets_are_unreachable
    result: pass
    justification: On T1 the connect through a symbolic link in the writable workspace is refused and a hard link from the workspace is never made; macOS (r34_container_engines_are_unreachable) refuses the direct path, the workspace link and link(). A /var/run spelling is a symbolic link to /run, the same case as the tested workspace link, since the T1 cover sits on the object and the macOS rule matches the resolved path.
  - requirement: SR-006
    verdict: verified
    method: test
    evidence: crates/procage/src/linux/services.rs::tests::extra_runtime_dirs_add
    result: pass
    justification: The unit test shows a with_runtime_dir addition is found canonicalised and every directory found without it (the readable /run/user/* and XDG_RUNTIME_DIR) is kept; runtime_dirs (services.rs:51) reads every readable /run/user/* independently of XDG_RUNTIME_DIR and feeds the same find() the canaries exercise; on macOS the engine rule is a pattern over every user home (preset fixtures), independent of HOME. No lane runs a harness with XDG_RUNTIME_DIR unset; the shared code path plus the unit test is adequate evidence.
  - requirement: SR-007
    verdict: implemented-unverified
    method: review
    evidence: site/content/docs/hard-deny.md:74
    result: inconclusive
    justification: The docs now list every Linux and macOS entry with list version 1 and state the DOCKER_HOST and CONTAINER_HOST limit next to the list, matching the constants in presets.rs, but no table test compares the list with the docs (the first scenario), and the sources are given once for the whole list, not per entry.
  - requirement: SR-008
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_a_socket_bound_later_is_refused
    result: pass
    justification: A socket bound in systemd/ after a T1 spawn is refused; r34_service_and_engine_sockets_are_unreachable shows T1 without the snapshot fails with an approximation gap naming the class and each path, and with it the plan records the degradation; the limit is documented in the Linux module docs and the hard-deny page.
  - requirement: SR-009
    verdict: verified
    method: test
    evidence: crates/procage-policy/tests/precedence.rs::waivers_remove_exactly_their_class_and_are_listed
    result: pass
    justification: Every class waived removes exactly its lines and is listed in plan.waivers; sockets.rs::a_waiver_removes_exactly_its_class and the Linux and macOS R-34 canaries show the other class still holds when one is waived.
  - requirement: SR-010
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_an_abstract_bus_is_scoped
    result: pass
    justification: Below ABI 6 with no bus an unrelated abstract socket connects on each tier with service-handoff unwaived; the project socket in the writable workspace connects on T1 (r34_service_and_engine_sockets_are_unreachable) and macOS (r34_container_engines_are_unreachable). On T2 decide() emits only gaps and no covers, so a cage that is made cannot affect a socket matching no listed name; that code path is adequate evidence for T2.
  - requirement: SR-011
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_macos.rs::an_engine_connect_is_reported_with_its_class
    result: pass
    justification: With reporting on, a connect to a fake engine socket yields a violation denied by HardDeny(ContainerEngines), and the Linux module docs state that a connect refused by a cover is not reported.
  - requirement: SR-012
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_service_and_engine_sockets_are_unreachable
    result: pass
    justification: Each class has a network-on canary on T1 (refused) and T2 (gap naming each socket) with a waived control that connects, macOS has the engine canary with its control and the service-handoff check, and fake setups unwrap so a missing setup fails; the recorded lane results are green on macOS and Linux T1 and T2 after remediation.
  - requirement: SR-013
    verdict: verified
    method: review
    evidence: CHANGELOG.md:9
    result: pass
    justification: The fixture diff adds exactly one container-engines deny line per preset fixture and moves no line; the changelog Security entry names container-engines, the extended service-handoff and the r34 canaries, and THREAT_MODEL.md R-34 names both classes and the canaries.
  - requirement: SR-014
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r34_a_socket_bound_later_is_refused
    result: pass
    justification: A bus bound after a T2 cage was made refuses the spawn with a service-handoff gap, an engine bound after a T1 cage was made is refused at the next spawn, and r34_an_abstract_bus_bound_later_refuses_the_spawn refuses a later abstract bus without scope. The spawn test asserts the class only; the gap comes from the same decide() whose per-path subject the cage-creation canary asserts, which is adequate.
  - requirement: SR-015
    verdict: partial
    method: review
    evidence: crates/procage/src/linux/services.rs:99
    result: partial
    justification: A listed name that cannot be inspected now counts as found (existing, services.rs:84) and the listing parser and the symlinked-bus discovery are unit-tested, but holds_a_socket turns a read_dir failure on an existing class directory into "no socket", which tier T2 ignores instead of reporting a gap, and no test covers the unreadable /proc/net/unix gap.
  - requirement: SR-016
    verdict: verified
    method: test
    evidence: crates/procage-policy/tests/sockets.rs::the_backend_gets_the_classes_exactly_when_a_unix_connect_is_possible
    result: pass
    justification: The table crosses every Network variant with empty and non-empty ipc.unix_sockets and waivers, asserting the carried classes or that the only gaps are the refused modes. A new variant cannot skip the classes; the predicate is net != None (fail-closed), the match on Network in lower/linux.rs is exhaustive, and lowering_table.rs fails without a row per construct; this meets the second scenario by construction rather than by a failing table row.
