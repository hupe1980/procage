threats:
- id: threat.abstract-bus
  name: A bus listening on an abstract address (older systems) is reached because path rules and mount covers do
    not apply to abstract sockets, and the kernel cannot scope them or the scope is not applied
  categories:
  - Elevation of Privilege
  risk:
    impact: 95
    impactComment: same handoff as the user bus
    likelihood: 35
    likelihoodComment: abstract bus addresses remain on older distributions
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.host
    status: mitigated
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.linux-t1
    - component.linux-t2
    - component.discovery
    - flow.connect
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.alias-path
  name: 'Caged code reaches a listed socket under another name: a symbolic link, /var/run instead of /run, a differently
    spelled runtime directory, or a hard link it makes to the socket inside a writable tree'
  categories:
  - Elevation of Privilege
  risk:
    impact: 90
    impactComment: the deny matches nothing and the handoff succeeds
    likelihood: 30
    likelihoodComment: the aliases are standard on Linux; macOS rules match connect paths
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.host
    status: mitigated
    actor: actor.caged-code
    disposition: threat
    elements:
    - component.linux-t1
    - component.macos
    - flow.connect
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.discovery-race
  name: Between discovery and the child's run a socket of an unwaived class appears or is replaced (bound after
    Cage::new on T2, vanished at find and re-bound before the optional T1 cover, or bound after the child starts
    at a path no class directory covers), so it stays reachable without a gap
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-367
  risk:
    impact: 85
    impactComment: the handoff opens for that spawn while the cage reports no gap
    likelihood: 35
    likelihoodComment: engines and buses restart; long-lived cages spawn many times
  attributes:
    source: plan.md#Summary
    assets:
    - asset.host
    - asset.discovery
    status: mitigated
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.discovery
    - component.linux-t1
    - component.linux-t2
    - flow.discovery-gaps
    - flow.discovery-covers
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.discovery-shaped
  name: 'Host state that a caged child or another process can shape misleads discovery: a listed name replaced by
    a symbolic link or a non-socket decoy is skipped, a crafted abstract name breaks the /proc/net/unix parse, or
    an unreadable /proc/net/unix is read as no abstract bus'
  categories:
  - Tampering
  cwes:
  - CWE-59
  risk:
    impact: 85
    impactComment: the real socket is never covered or gapped
    likelihood: 30
    likelihoodComment: needs a writable grant over a runtime directory, or a missing /proc in a container
  attributes:
    source: plan.md#Summary
    assets:
    - asset.discovery
    - asset.host
    status: open
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.discovery
    - component.host-state
    - flow.discover-read
    - flow.child-shapes-host
    profile: stride
    severity: medium
    technique: injection
- id: threat.engine-handoff
  name: Caged code connects to a container engine socket (Docker, Podman, containerd, Colima, OrbStack) and starts
    a container that mounts the home directory, on Linux or macOS
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-269
  risk:
    impact: 95
    impactComment: the container reads and writes the whole home outside every path rule
    likelihood: 70
    likelihoodComment: engines are common on developer hosts; one HTTP request starts a container
  attributes:
    source: spec.md#US2
    assets:
    - asset.host
    status: mitigated
    actor: actor.caged-code
    constitution: II. Every policy emits the hard-deny tier last
    disposition: threat
    elements:
    - component.linux-t1
    - component.macos
    - component.services
    - flow.connect
    profile: stride
    severity: critical
    technique: broken-access-control
- id: threat.list-gap
  name: The frozen socket list misses a variant in use (rootless containerd, a Podman machine, Colima or Lima profiles,
    a new engine), or an engine runs at a path named only by DOCKER_HOST or CONTAINER_HOST, so that engine stays
    reachable
  categories:
  - Elevation of Privilege
  risk:
    impact: 85
    impactComment: a missing path is an open handoff
    likelihood: 45
    likelihoodComment: engine socket locations vary by tool and version
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.host
    status: open
    actor: actor.contributor
    disposition: threat
    elements:
    - component.socket-list
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.over-deny
  name: A pattern also matches a project's own socket under a granted writable tree, or the abstract-socket scope
    (accepted, only when an abstract service bus exists at spawn) cuts unrelated abstract sockets such as X11's,
    so legitimate runs fail and consumers waive whole classes
  categories:
  - Denial of Service
  risk:
    impact: 45
    impactComment: broken builds push consumers to a wide waiver
    likelihood: 45
    likelihoodComment: directory patterns and the abstract scope are broader than single paths
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.harness
    - asset.policy
    status: mitigated
    actor: actor.consumer
    disposition: threat
    elements:
    - component.socket-list
    - component.linux-t1
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.post-spawn-socket
  name: A bus or engine socket created after spawn (an engine started later, a restarted bus) at a listed path outside
    a covered class directory is not covered on T1, because the covers are made from the file system at spawn
  categories:
  - Elevation of Privilege
  risk:
    impact: 90
    impactComment: the handoff opens mid-run without a gap
    likelihood: 35
    likelihoodComment: engines and buses restart during long agent runs
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.host
    status: mitigated
    actor: actor.caged-code
    disposition: threat
    elements:
    - component.linux-t1
    - flow.confine
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.q-abstract-scope
  name: '[NEEDS CLARIFICATION: the Landlock abstract-socket scope refuses every abstract socket outside the cage,
    not only the bus; is that accepted when service-handoff is not waived, and is it waivable separately?]'
  categories:
  - Elevation of Privilege
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.harness
    status: retired
    actor: actor.consumer
    disposition: needs-clarification
    elements:
    - component.linux-t1
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
- id: threat.q-engine-from-env
  name: '[NEEDS CLARIFICATION: are engine sockets named by DOCKER_HOST, CONTAINER_HOST or a tool profile at a path
    outside the frozen list in scope, expanded from the harness environment at spawn, or a documented harness responsibility?]'
  categories:
  - Elevation of Privilege
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#Key-Entities
    assets:
