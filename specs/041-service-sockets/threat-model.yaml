    - site/content/docs
- id: mitigation.class-scoped-waiver
  name: Each class is a typed name; a waiver removes exactly that class's denies and is recorded in the receipt
  riskReduction: 90
  attributes:
    threats:
    - threat.waiver-broadens
    status: verified
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - crates/procage-policy/src/policy.rs
    - crates/procage-policy/src/lower/mod.rs
- id: mitigation.cover-directories
  name: On T1 the class directories ($XDG_RUNTIME_DIR/systemd, $XDG_RUNTIME_DIR/podman, /run/podman, /run/containerd,
    /run/dbus) are covered whole, so later sockets there are unreachable; other found sockets make the class a spawn-snapshot
    approximation accepted only by the option or by name and recorded
  riskReduction: 70
  attributes:
    threats:
    - threat.post-spawn-socket
    status: verified
    kind: preventive
    requirements:
    - SR-008
    touchpoints:
    - crates/procage/src/linux/spawn.rs
    - crates/procage/src/linux/services.rs
    - crates/procage-policy/src/policy.rs
    - crates/procage-policy/src/presets.rs
    - crates/procage/THREAT_MODEL.md
- id: mitigation.discovery-fail-closed
  name: Discovery treats any existing listed name as found whatever its type (covering the name and its resolved
    object), parses /proc/net/unix defensively, and turns a read failure into a gap
  riskReduction: 80
  attributes:
    threats:
    - threat.discovery-shaped
    status: required
    kind: preventive
    requirements:
    - SR-015
    touchpoints:
    - crates/procage/src/linux/services.rs
    - crates/procage/src/linux/spawn.rs
- id: mitigation.engine-deny
  name: container-engines denies every listed engine socket on Linux and macOS under every network setting
  riskReduction: 90
  attributes:
    threats:
    - threat.engine-handoff
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage-policy/src/presets.rs
    - crates/procage/src/linux/spawn.rs
- id: mitigation.exact-patterns
  name: Patterns match only listed names under the expanded directories; a granted project socket stays reachable
  riskReduction: 70
  attributes:
    threats:
    - threat.over-deny
    status: verified
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - crates/procage-policy/src/presets.rs
    - crates/procage/src/linux/services.rs
- id: mitigation.linux-bus-deny
  name: Linux service-handoff covers the user bus, the system bus and the service-manager sockets on T1 under every
    network setting
  riskReduction: 90
  attributes:
    threats:
    - threat.user-bus-handoff
    - threat.system-bus-handoff
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-policy/src/presets.rs
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage/src/linux/services.rs
    - crates/procage/src/linux/spawn.rs
- id: mitigation.paired-canaries
  name: Escape canaries with a private bus and fake engine sockets at the expanded paths, network on, T1, T2 and
    macOS, each paired with a waived positive control; they fail, never skip
  riskReduction: 80
  attributes:
    threats:
    - threat.vacuous-canary
    - threat.user-bus-handoff
    - threat.engine-handoff
    status: verified
    kind: detective
    requirements:
    - SR-012
    touchpoints:
    - crates/procage/tests/escape_macos.rs
    - crates/procage/tests/escape_linux.rs
- id: mitigation.per-spawn-recheck
  name: 'Discovery runs again in prepare for each spawn, in the parent, before the child exists: T2 refuses the
    spawn with the gaps, T1 covers what it finds, an optional cover is skipped only when its name is absent; the
    residual after the child starts is documented'
  riskReduction: 70
  attributes:
    threats:
    - threat.discovery-race
    status: verified
    kind: preventive
    requirements:
    - SR-014
    touchpoints:
    - crates/procage/src/linux/spawn.rs
    - crates/procage/src/linux/services.rs
    - crates/procage/src/linux/mod.rs
    - crates/procage/THREAT_MODEL.md
- id: mitigation.reach-table
  name: The reachability check is one function over the plan, with a lowering table test across every Network variant
    and ipc.unix_sockets setting
  riskReduction: 75
  attributes:
    threats:
    - threat.reach-predicate
    status: verified
    kind: preventive
    requirements:
    - SR-016
    touchpoints:
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage-policy/src/linux.rs
    - crates/procage-policy/tests/lowering_table.rs
- id: mitigation.resolved-object
  name: 'Denies apply to the socket object: T1 covers the resolved socket, macOS rules name the resolved path and
    refuse hard links to listed sockets'
  riskReduction: 80
  attributes:
    threats:
    - threat.alias-path
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - crates/procage/src/linux/services.rs
    - crates/procage/src/linux/spawn.rs
    - crates/procage-policy/src/lower/macos.rs
- id: mitigation.reviewed-fixtures
  name: Security entry in the changelog, the escape class in the threat model, container-engines emitted last so
    existing lines keep their order, and regenerated preset fixtures whose diff is only the new denies
  riskReduction: 80
  attributes:
    threats:
    - threat.silent-tightening
    status: verified
    kind: detective
    requirements:
    - SR-013
    touchpoints:
    - crates/procage-policy/tests/fixtures/presets
    - crates/procage-policy/src/policy.rs
    - CHANGELOG.md
    - crates/procage/THREAT_MODEL.md
    - crates/procage/tests/threat_model.rs
- id: mitigation.t2-gap
  name: T2 checks the expanded list at spawn and fails with a capability gap naming the class and each socket found,
    unless the class is waived; fit relaxes by name
  riskReduction: 90
  attributes:
    threats:
    - threat.t2-silent-reach
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - crates/procage/src/linux/mod.rs
    - crates/procage/src/linux/services.rs
    - crates/procage/src/lib.rs
- id: mitigation.uid-expansion
  name: Runtime directories are every readable /run/user/*, XDG_RUNTIME_DIR and with_runtime_dir additions (adds
    only), canonicalised; homes are the account's and the known homes on Linux, every user home on macOS
  riskReduction: 80
  attributes:
    threats:
    - threat.runtime-dir-expansion
    status: verified
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - crates/procage/src/linux/services.rs
    - crates/procage/src/linux/mod.rs
    - crates/procage-policy/src/lower/macos.rs
- id: mitigation.versioned-list
  name: The socket list is versioned data with its sources, covered by a table test; the docs list it and say that
    engines at other paths (DOCKER_HOST, CONTAINER_HOST) are out of scope and hidden by the caller's policy
  riskReduction: 60
  attributes:
    threats:
    - threat.list-gap
    status: required
    kind: detective
    requirements:
    - SR-007
    touchpoints:
    - crates/procage-policy/src/presets.rs
    - crates/procage-policy/tests/presets.rs
    - crates/procage/THREAT_MODEL.md
    - site/content/docs
requirements:
- id: SR-001
  statement: On Linux T1, the service-handoff class MUST make a connect from the caged child to the user bus, the
    system bus and the user service-manager sockets fail under every network setting, unless the class is waived.
  priority: P1
  mitigations:
  - mitigation.linux-bus-deny
  acceptance:
  - given: T1, Network::All and a private bus at $XDG_RUNTIME_DIR/bus and a fake socket at $XDG_RUNTIME_DIR/systemd/private
    then: every connect fails and the fake services record no connection
    when: the child connects to each, and to a fake system bus socket at its path
  - given: the same setup with Network::None
    then: every connect fails
    when: the child connects
  tasks: []
- id: SR-002
  statement: The container-engines class MUST make a connect to every listed engine socket fail on Linux (T1) and
    macOS under every network setting, unless the class is waived.
  priority: P1
  mitigations:
  - mitigation.engine-deny
  acceptance:
  - given: macOS, Network::All and fake engine sockets at each listed home-directory path
    then: every connect is denied and no fake engine records a connection
    when: the child connects to each
  - given: Linux T1 in a container lane with fake sockets at each listed system and runtime path
    then: every connect fails
    when: the child connects to each
  tasks: []
- id: SR-003
  statement: On T2, if a socket of an unwaived class exists at spawn, making the cage MUST fail with a capability
    gap naming the class and every such socket path; fit MUST relax the class by name and say what lifts the gap.
  priority: P1
  mitigations:
  - mitigation.t2-gap
  acceptance:
  - given: T2 and a socket at $XDG_RUNTIME_DIR/bus
    then: it fails with a gap naming service-handoff and that path
    when: the cage is made
  - given: the same host and fit
    then: it relaxes service-handoff by name and states what would lift the gap
    when: fit runs
  - given: T2 and no listed socket
    then: it succeeds unchanged
    when: the cage is made
  tasks: []
- id: SR-004
  statement: An abstract address of a service-handoff bus found at spawn MUST be scoped where the kernel supports
    abstract-socket scoping (Landlock ABI 6), and otherwise MUST fail the cage with a gap naming the address.
  priority: P1
  mitigations:
  - mitigation.abstract-scope
  acceptance:
  - given: a fake bus on an abstract address and Landlock ABI 6
    then: the connect fails
    when: the child connects
  - given: the same bus and a kernel below ABI 6
    then: it fails with a gap naming the address
    when: the cage is made
  tasks: []
- id: SR-005
  statement: 'A deny MUST hold for the socket object, not its spelling: a connect through a symbolic link, /var/run
    instead of /run, or a hard link made inside the cage to a listed socket MUST fail like the direct path.'
  priority: P1
  mitigations:
  - mitigation.resolved-object
  acceptance:
  - given: a writable workspace with a symbolic link to a listed fake socket
    then: the connect fails on T1 and macOS
    when: the child connects through it
  - given: macOS and a listed fake socket under procage's deny-default profile
    then: link() is refused
    when: the child calls link() to it from the workspace
  - given: Linux T1 and a listed fake socket
    then: the link fails (no refer right) or the connect fails (the cover hides the original name)
    when: the child makes a hard link to it in the workspace and connects
  tasks: []
- id: SR-006
  statement: Discovery MUST take the runtime directories from every /run/user/* the caller can read, the caller's
    XDG_RUNTIME_DIR and each with_runtime_dir addition (which adds, never replaces), canonicalised; the homes MUST
    be the account's home and the homes procage already knows on Linux and every user home on macOS; the listed
    sockets MUST be denied under each.
  priority: P1
  mitigations:
  - mitigation.uid-expansion
  acceptance:
  - given: a harness with XDG_RUNTIME_DIR unset and a fake bus at /run/user/<uid>/bus
    then: the connect fails (T1) or the cage reports the gap (T2)
    when: the child connects
  - given: HOME pointing to another directory
    then: the connect is denied
    when: the child connects to the engine socket under the account's home
  - given: a scratch runtime directory added with with_runtime_dir and a fake bus in it
    then: the bus is found, and the sockets under /run/user/* are still found
    when: the cage is made
  tasks: []
- id: SR-007
  statement: The service socket list MUST be versioned data whose sources (the D-Bus, systemd and engines' documented
    default locations) are stated for the list, and the docs MUST list each path and directory pattern it covers,
    say that sockets outside it are not covered, and say that an engine at a path named only by DOCKER_HOST or CONTAINER_HOST
    is out of scope and is hidden by the caller's policy.
  priority: P1
  mitigations:
  - mitigation.versioned-list
  acceptance:
  - given: the list and the docs
    then: every entry appears in both with its version
    when: a table test compares them
  - given: the docs
    then: they state the DOCKER_HOST and CONTAINER_HOST scope limit next to the list
    when: they are read
  tasks: []
- id: SR-008
  statement: On T1 the class directories ($XDG_RUNTIME_DIR/systemd, $XDG_RUNTIME_DIR/podman, /run/podman, /run/containerd,
    /run/dbus) MUST be covered whole when found, so a socket bound there after spawn is unreachable; a found socket
    outside them MUST make its class a spawn-snapshot approximation, accepted only by the spawn-snapshot option
    or by name and recorded as a degradation, and documented.
  priority: P1
  mitigations:
  - mitigation.cover-directories
  acceptance:
  - given: T1, an empty $XDG_RUNTIME_DIR/systemd at spawn
    then: the connect fails
    when: a fake socket is bound at $XDG_RUNTIME_DIR/systemd/private after spawn and the child connects
  - given: T1, a fake bus at $XDG_RUNTIME_DIR/bus and neither the spawn-snapshot option nor the class named
    then: it fails with an approximation gap naming service-handoff and the path
    when: the cage is made
  - given: the same host with the spawn-snapshot option
    then: it succeeds and the receipt records the degradation
    when: the cage is made
  tasks: []
- id: SR-009
  statement: Each class MUST be waivable only by its typed name; a waiver MUST remove exactly that class's denies
    and MUST be recorded in the receipt.
  priority: P1
  mitigations:
  - mitigation.class-scoped-waiver
  acceptance:
  - given: a policy compiled with and without the container-engines waiver
    then: they differ only in the engine denies, service-handoff still holds, and the receipt lists the waiver
    when: the outputs are compared
  - given: container-engines waived
    then: it succeeds and a connect to the fake bus still fails
    when: the child connects to a fake engine
  tasks: []
- id: SR-010
  statement: Patterns MUST match only listed names under the expanded directories; a socket under a granted writable
    tree that matches no pattern MUST stay reachable.
  priority: P2
  mitigations:
  - mitigation.exact-patterns
  acceptance:
  - given: a project's own server socket in the writable workspace
    then: it succeeds on T1, T2 and macOS
    when: the child connects
  - given: T1 below Landlock ABI 6 (where no plan scopes abstract sockets), no abstract service bus at spawn and
      an unrelated abstract socket
    then: 'it succeeds: the class adds no abstract scope of its own (from ABI 6 every plan already scopes abstract
      sockets, independent of this class)'
    when: the child connects to it
  tasks: []
- id: SR-011
  statement: On macOS, with reporting on, a refused connect to a listed socket MUST be recorded with the class name
    as its reason; on Linux, where the refusal comes from a mount cover or the scope and is not reported, the docs
    MUST say so.
  priority: P2
  mitigations:
  - mitigation.class-reason
  acceptance:
  - given: macOS, reporting on and a fake engine socket
    then: the record holds a violation with reason container-engines
    when: the child connects
  - given: the Linux docs page
    then: it states that service-socket refusals are not reported on Linux
    when: it is read
  tasks: []
- id: SR-012
  statement: The escape suite MUST hold a canary per class with the network on, on T1, T2 and macOS, each paired
    with a positive control (class waived, connect succeeds) and failing, never skipping, when the setup is missing.
  priority: P1
  mitigations:
  - mitigation.paired-canaries
  acceptance:
  - given: each lane
    then: 'the connect is refused (T2: the gap), and the waived control connects'
    when: the canary runs
  - given: a lane where the private bus cannot start
    then: it fails
    when: the canary runs
  tasks: []
- id: SR-013
  statement: The change MUST ship with a Security entry in the changelog and the escape class in the threat model,
    and the regenerated preset fixtures MUST differ only by the new denies.
  priority: P2
  mitigations:
  - mitigation.reviewed-fixtures
  acceptance:
  - given: the fixture diff
    then: every changed line is a service-handoff or container-engines deny and no existing line moves
    when: it is reviewed
  - given: the changelog and the threat model
    then: both name container-engines, the extended service-handoff and the canaries
    when: they are read
  tasks: []
- id: SR-014
  statement: 'Discovery MUST run again for each spawn, in the parent before the child is created: on T2 a socket
    or abstract bus of an unwaived class found then MUST refuse the spawn with the same gaps; on T1 every found
    socket MUST be covered in that spawn, and a cover MAY be skipped only when its name no longer exists; a socket
    bound after the child starts outside a class directory MUST be documented as the spawn-snapshot limit on T1
    and T2.'
  priority: P1
  mitigations:
  - mitigation.per-spawn-recheck
  acceptance:
  - given: T2, a cage made with no listed socket, then a fake bus bound at the runtime path
    then: it fails with a gap naming service-handoff and the path
    when: spawn is called
  - given: T1, a cage made with no listed socket, then a fake engine socket bound at a listed runtime path
    then: the connect fails
    when: spawn is called and the child connects
  - given: T2, a cage made before an abstract bus exists, then a fake abstract bus and no scope
    then: it fails with a gap naming the address
    when: spawn is called
  tasks: []
- id: SR-015
  statement: Discovery MUST treat an existing listed name as found whatever it is (socket, directory, symbolic link
    or other file), covering the name and its resolved object; it MUST parse /proc/net/unix without trusting the
    name field's layout; and a failure to read /proc/net/unix while the child shares the network namespace, or to
    inspect an existing listed path, MUST be a gap, not an empty result.
  priority: P1
  mitigations:
  - mitigation.discovery-fail-closed
  acceptance:
  - given: a writable runtime directory where the listed bus name is a symbolic link to a fake bus elsewhere
    then: both connects fail
    when: the cage is made on T1 and the child connects by either name
  - given: a fake abstract socket whose name holds a newline and a listed prefix
    then: it neither panics nor drops a real fake bus listed after it
    when: discovery runs
  - given: T2 with Network::All and /proc/net/unix unreadable
    then: it fails with a gap naming service-handoff
    when: the cage is made
  tasks: []
- id: SR-016
  statement: The Linux lowering MUST carry both classes in LinuxPlan::service_sockets for every policy that leaves
    the child any pathname or abstract Unix connect (Network::All, a non-empty ipc.unix_sockets, and any network
    mode added later that allows one), unless the class is waived; a lowering table test MUST cover every Network
    variant and ipc setting.
  priority: P1
  mitigations:
  - mitigation.reach-table
  acceptance:
  - given: each Network variant crossed with an empty and a non-empty ipc.unix_sockets
    then: service_sockets is non-empty exactly where a Unix connect is possible and the classes are not waived
    when: the policy is lowered
  - given: a new Network variant without a table row
    then: they fail
    when: the lowering tests run
