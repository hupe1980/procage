otmVersion: 0.2.0
project:
  id: 041-service-sockets
  name: No service handoff over Unix sockets
threatspec:
  actors:
  - id: actor.caged-code
    name: Arbitrary code in the caged child
    trust: untrusted
  - id: actor.consumer
    name: Developer of a harness that builds and fits policies
    trust: trusted
  - id: actor.contributor
    name: procage contributor who edits the backends, the data classes or the docs
    trust: semi-trusted
  dispositions:
  - disposition: not-applicable
    reason: procage authenticates no one; the services trust the caged code's uid, which is the threat modelled
      as handoff
    technique: credential-theft
  - disposition: not-applicable
    reason: no authentication surface in procage
    technique: identity-spoofing
  - disposition: no-threat-detected
    reason: 'checked flow.connect: procage carries no data over these sockets, it only denies the connect'
    technique: data-tampering-in-transit
  - disposition: not-applicable
    reason: no store; the socket list is compiled-in data (its gaps are threat.list-gap) and the host state discovery
      reads is modelled as threat.discovery-shaped
    technique: data-tampering-at-rest
  - disposition: no-threat-detected
    reason: 'checked flow.discover-read and flow.gap: discovery reads only the listed paths, the /run/user/* directories
      the caller can already read and /proc/net/unix, and the gap subjects name paths the trusted consumer can already
      see; the disclosure paths are the handoff threats'
    technique: sensitive-data-exposure
  - disposition: not-applicable
    reason: single user
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: no configuration store added; planted user units are R-23
    technique: privilege-escalation-via-config
  - disposition: not-applicable
    reason: procage is a library that calls no model and runs no agent; LLM-written code is the adversary inside
