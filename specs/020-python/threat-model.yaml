threats:
- id: threat.env-leak
  name: The binding copies os.environ (or the caller's whole environment) into the command as explicit variables,
    which procage always keeps, so secrets in the environment reach the cage past the allowlist
  categories:
  - Information Disclosure
  risk:
    impact: 90
    impactComment: tokens and keys in the environment reach the caged code
    likelihood: 50
    likelihoodComment: merging os.environ is the subprocess habit
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.host
    status: mitigated
    actor: actor.contributor
    constitution: V. Hygiene by default
    disposition: threat
    elements:
    - component.wrapper
    - flow.spawn
    profile: stride
    severity: high
    technique: sensitive-data-exposure
- id: threat.gil-starvation
  name: A blocking spawn, wait or read holds the interpreter lock, so a framework that runs tools on threads stalls
    while one command runs
  categories:
  - Denial of Service
  risk:
    impact: 30
    impactComment: other tool calls stall; no confinement is lost
    likelihood: 40
    likelihoodComment: a binding that forgets to release the lock
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.policy
    status: mitigated
    actor: actor.contributor
    disposition: threat
    elements:
    - component.native
    profile: stride
    severity: low
    technique: resource-exhaustion
- id: threat.orphaned-run
  name: A run outlives its Python object or the interpreter (garbage collection deferred, interpreter exit skipping
    finalisers), so caged processes keep running unowned
  categories:
  - Elevation of Privilege
  risk:
    impact: 60
    impactComment: caged code keeps running after the agent stopped
    likelihood: 40
    likelihoodComment: CPython does not finalise every object at exit
  attributes:
    source: spec.md#US1
    assets:
    - asset.host
    status: mitigated
    actor: actor.caged-code
    constitution: V. Hygiene by default
    disposition: threat
    elements:
    - component.wrapper
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.python-in-child
  name: Python code runs in the child between fork and exec (a preexec hook, at-fork handlers, a callback), deadlocking
    on the interpreter lock or running before the sandbox applies
  categories:
  - Elevation of Privilege
  risk:
    impact: 80
    impactComment: code runs uncaged in the child or the spawn hangs
    likelihood: 25
    likelihoodComment: subprocess offers preexec_fn; a binding may imitate it
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.host
    status: mitigated
    actor: actor.contributor
    constitution: IV. Syscalls only between fork and exec
    disposition: threat
    elements:
    - component.native
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.silent-weakening
  name: 'The binding loosens what the caller asked: an unknown or misspelt field is dropped, a gap is ignored, or
    a default policy allows more than the Rust default'
  categories:
  - Elevation of Privilege
  risk:
    impact: 85
    impactComment: the cage is weaker than the policy the caller wrote
    likelihood: 35
    likelihoodComment: dict-to-struct glue often ignores unknown keys
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.policy
    - asset.host
    status: mitigated
    actor: actor.contributor
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.native
    - flow.spawn
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.untested-wheel
  name: A wheel is published for a platform where the binding was never run against the kernel, or the docs claim
    more than the binding tests show
  categories:
  - Repudiation
  risk:
    impact: 60
    impactComment: users rely on a sandbox nobody measured there
    likelihood: 40
    likelihoodComment: cross-built wheels are easy to add
  attributes:
    source: spec.md#SC-001
    assets:
    - asset.wheel
    - asset.policy
    status: open
    actor: actor.contributor
    constitution: III. The kernel is the oracle
    disposition: threat
    elements:
    - component.release
    - component.example
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.wheel-tampering
  name: An attacker on the package path (a build dependency, a mutable CI action, a stored upload token) publishes
    a wheel that does not cage, under the procage name
  categories:
  - Tampering
  risk:
    impact: 100
    impactComment: every user of the wheel runs code without a sandbox
    likelihood: 25
    likelihoodComment: packaging pipelines are a common target
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.wheel
    status: open
    actor: actor.supply-chain
    disposition: threat
    elements:
    - component.release
    - flow.publish
    profile: stride
    severity: medium
    technique: injection
mitigations:
- id: mitigation.end-on-release
  name: Dropping a Run ends it; an atexit hook ends every live run
  riskReduction: 85
  attributes:
    threats:
    - threat.orphaned-run
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - bindings/python/src/lib.rs
    - bindings/python/python/procage/__init__.py
- id: mitigation.explicit-env
  name: The binding passes only the variables the caller names in env=; the policy decides the rest, as in Rust
  riskReduction: 90
  attributes:
    threats:
    - threat.env-leak
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - bindings/python/src/lib.rs
    - bindings/python/python/procage/__init__.py
- id: mitigation.release-gil
  name: Spawn, wait and reads run with the interpreter lock released
  riskReduction: 80
  attributes:
    threats:
    - threat.gil-starvation
    status: verified
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - bindings/python/src/lib.rs
- id: mitigation.rust-spawn
  name: Spawning is the Rust child sequence only; the binding exposes no hook that runs in the child
  riskReduction: 95
  attributes:
    threats:
    - threat.python-in-child
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - bindings/python/src/lib.rs
- id: mitigation.same-semantics
  name: Policies come only through the Rust presets and the versioned format, which refuses unknown fields; every
    Rust error becomes a typed exception; no binding default differs from Rust
  riskReduction: 90
  attributes:
    threats:
    - threat.silent-weakening
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - bindings/python/src/lib.rs
    - bindings/python/python/procage/__init__.py
- id: mitigation.tested-wheels
  name: Each published platform runs the binding escape subset and the example from the wheel it ships, on the kernel,
    in CI
  riskReduction: 85
  attributes:
    threats:
    - threat.untested-wheel
    status: required
    kind: detective
    requirements:
    - SR-006
    touchpoints:
    - bindings/python/wheel.sh
    - bindings/python/tests/test_procage.py
    - .github/workflows/ci.yml
- id: mitigation.trusted-publishing
  name: Wheels are built from the tag by pinned actions and uploaded with PyPI Trusted Publishing in a protected
    environment; no stored token
  riskReduction: 85
  attributes:
    threats:
    - threat.wheel-tampering
    status: required
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - .github/workflows/release.yml
requirements:
- id: SR-001
  statement: The binding MUST NOT copy the caller environment into the command; only variables passed in env= are
    set explicitly, and the policy environment rules decide the rest.
  priority: P1
  mitigations:
  - mitigation.explicit-env
  acceptance:
  - given: a secret variable in os.environ and a preset policy
    then: the secret is absent
    when: a caged command prints its environment
  - given: the same and env= naming one variable
    then: that variable is present and the secret absent
    when: the command prints its environment
  tasks: []
- id: SR-002
  statement: The binding MUST NOT run Python code in the child between fork and exec.
  priority: P1
  mitigations:
  - mitigation.rust-spawn
  acceptance:
  - given: Python threads holding locks while the binding spawns
    then: every spawn completes
    when: many commands are spawned from several threads
  tasks: []
- id: SR-003
  statement: A policy MUST reach the cage only through the presets or the versioned format, an unknown field or
    invalid value MUST raise PolicyError, a gap MUST raise CapabilityGapError with the gaps, and the binding MUST
    add no default the Rust API does not have.
  priority: P1
  mitigations:
  - mitigation.same-semantics
  acceptance:
  - given: a JSON policy with an unknown field
    then: PolicyError is raised
    when: Policy.from_json is called
  - given: a policy the host cannot enforce
    then: CapabilityGapError is raised with the gaps
    when: a Cage is made
  tasks: []
- id: SR-004
  statement: Every process of a run MUST be killed when the Run object is collected or the interpreter exits.
  priority: P1
  mitigations:
  - mitigation.end-on-release
  acceptance:
  - given: a running command whose Run is deleted
    then: its processes are dead
    when: the object is collected
  - given: a running command when the interpreter exits
    then: its processes are dead
    when: the interpreter exits
  tasks: []
- id: SR-005
  statement: Wheels MUST be built from the tagged commit by actions pinned to full SHAs and published with PyPI
    Trusted Publishing from a protected environment, with no stored token.
  priority: P1
  mitigations:
  - mitigation.trusted-publishing
  acceptance:
  - given: the release workflow
    then: every action is SHA-pinned and the publish job uses OIDC in the pypi environment
    when: the workflows gate runs
  tasks: []
- id: SR-006
  statement: Every published wheel platform MUST run the binding escape subset and the shell tool example from the
    built wheel on its CI lane, and the docs MUST claim no platform beyond them.
  priority: P2
  mitigations:
  - mitigation.tested-wheels
  acceptance:
  - given: each wheel platform lane
    then: reads and writes outside the workspace, secrets and the network are refused and the example runs
    when: the Python tests run against the installed wheel
  tasks: []
- id: SR-007
  statement: Spawn, wait and the reading of output MUST release the interpreter lock.
  priority: P3
  mitigations:
  - mitigation.release-gil
  acceptance:
  - given: one thread waiting on a long command
    then: it makes progress
    when: another Python thread runs
  tasks: []
