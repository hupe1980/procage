requirements:
- id: SR-001
  statement: Fitting MUST relax only unsupported gaps whose relaxation the caller named, and only the rule the gap
    names; any other gap MUST fail the cage with every remaining gap and no change applied.
  priority: P1
  mitigations:
  - mitigation.named-only
  acceptance:
  - given: gaps of which one has no named relaxation
    then: it returns the unrelaxable gaps and the policy is unchanged
    when: the relaxation is applied
  - given: an approximation gap of a relaxable construct
    then: it is not relaxed
    when: the relaxation is applied
  - given: two protect rules and a gap for one
    then: only that rule is removed
    when: the relaxation is applied
  tasks: []
- id: SR-002
  statement: Every relaxation applied MUST appear in the returned list with its gap and effect.
  priority: P1
  mitigations:
  - mitigation.named-only
  acceptance:
  - given: T2 and four relaxations
    then: the list has exactly the four entries
    when: Cage::fit runs
  tasks: []
- id: SR-003
  statement: The lift of each relaxed gap MUST be derived by lowering the original policy for tier T1 and for newer
    Landlock ABIs up to the backend maximum, and be unknown when neither lifts it.
  priority: P2
  mitigations:
  - mitigation.relower-lift
  acceptance:
  - given: the signal gap at ABI 5 on T2
    then: it is ABI 6 without T1
    when: the lift is computed
  - given: a protect gap on T2
    then: it is T1
    when: the lift is computed
  - given: unix sockets on T2 with maximum ABI 8
    then: it is T1 only
    when: the lift is computed
  tasks: []
- id: SR-004
  statement: A fitted cage MUST still enforce every part of the policy that was not relaxed.
  priority: P1
  mitigations:
  - mitigation.caged-fit-tests
  acceptance:
  - given: a cage fitted on T2
    then: both fail
    when: the child writes outside the workspace and opens an IP socket
  tasks: []
verification:
- id: verification.sr-001.2026-11-01
  requirement: SR-001
  method: test
  evidence: crates/procage-policy/tests/fit.rs::a_gap_without_a_named_relaxation_changes_nothing
  result: pass
  verdict: verified
