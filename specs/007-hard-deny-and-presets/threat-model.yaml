requirements:
- id: SR-001
  statement: With a read grant on the home directory, the listed secret paths MUST stay unreadable to the child
    unless the secrets class is waived by name.
  priority: P1
  mitigations:
  - mitigation.secrets-class
  acceptance:
  - given: read access to HOME
    then: each is refused and listing HOME succeeds
    when: the child lists ~/.ssh, ~/.aws and ~/.gnupg
  - given: secrets waived
    then: it succeeds and the plan lists the waiver
    when: the child lists ~/.ssh
  tasks: []
- id: SR-002
  statement: With write access to a workspace, the child MUST NOT create or modify git hooks, git config, .gitmodules,
    shell rc files, editor or agent config directories or tool config files, while git objects, refs and the index
    stay writable; waiving trust-handoff by name allows them.
  priority: P1
  mitigations:
  - mitigation.handoff-and-persistence-classes
  acceptance:
  - given: write access to a workspace with .git
    then: each is refused and .git/objects/x succeeds
    when: the child creates .git/hooks/pre-commit, .zshrc, .envrc and .vscode/settings.json
  - given: trust-handoff waived
    then: it succeeds
    when: the child creates .git/hooks/pre-commit
  tasks: []
- id: SR-003
  statement: The child MUST NOT create files in launch-agent or login-item locations, even when the policy grants
    write access there.
  priority: P1
  mitigations:
  - mitigation.handoff-and-persistence-classes
  acceptance:
  - given: write access to ~/Library/LaunchAgents
    then: it is refused and nothing is created
    when: the child creates a file there
  tasks: []
- id: SR-004
  statement: Data-class patterns MUST deny case variants of the listed names.
  priority: P1
  mitigations:
  - mitigation.case-folded-patterns
  acceptance:
  - given: read access to HOME
    then: it is refused
    when: the child lists ~/.SSH
  - given: a writable workspace with .git
    then: each is refused
    when: the child creates .GIT/HOOKS/x or .ZSHRC
  tasks: []
- id: SR-005
  statement: The class lists and every preset V1 MUST be pinned by tests.
  priority: P2
  mitigations:
  - mitigation.pinned-lists-and-presets
  acceptance:
  - given: each preset and class
    then: it equals the pinned content
    when: it is lowered or serialised
  tasks: []
- id: SR-006
  statement: The lowering table and docs MUST state that Linux enforcement of the data classes is pending, and the
    Linux spawn spec (008) MUST carry it.
  priority: P2
  mitigations:
  - mitigation.linux-pending-explicit
  acceptance:
  - given: the lowering table and the 008 spec
    then: the Linux cells say pending and 008 lists the requirement
    when: reviewed
  tasks: []
verification:
- id: verification.sr-001.2026-10-30
  requirement: SR-001
  method: test
  evidence: tests/spawn_macos.rs::hard_deny_secrets
  result: pass
  verdict: verified
  justification: With a read grant on HOME, listing HOME succeeds while listing ~/.ssh, ~/.aws and ~/.gnupg is refused
    by the kernel. With secrets waived, ~/.ssh is listable and the plan lists the waiver. Dropping .ssh from the
    list fails this test and the pinned fixtures.
  verified_at: '2026-10-30T09:00:14Z'
  commit: eb66876
- id: verification.sr-002.2026-10-30
  requirement: SR-002
  method: test
  evidence: tests/spawn_macos.rs::hard_deny_trust_handoff; tests/spawn_macos.rs::preset_agent_workspace
  result: pass
  verdict: verified
  justification: In a writable workspace with .git, the child cannot create .git/hooks/pre-commit, .git/config,
    .gitmodules, .zshrc, .envrc or src/.bashrc, cannot mkdir .vscode, and cannot rename .git; src/main.rs, .git/objects/ab
    and notes.txt are writable. Waiving trust-handoff allows the hook. Removing the .git unlink deny fails the test.
  verified_at: '2026-10-30T09:00:14Z'
  commit: eb66876
- id: verification.sr-003.2026-10-30
  requirement: SR-003
  method: test
  evidence: tests/spawn_macos.rs::hard_deny_persistence
  result: pass
  verdict: verified
  justification: With an explicit write grant on ~/Library/LaunchAgents, creating a plist there is refused and nothing
    is created. The persistence class is last in the profile, so it wins over the grant.
  verified_at: '2026-10-30T09:00:14Z'
  commit: eb66876
- id: verification.sr-004.2026-10-30
  requirement: SR-004
  method: test
  evidence: tests/spawn_macos.rs::hard_deny_secrets; tests/spawn_macos.rs::hard_deny_trust_handoff; crates/procage-policy/src/glob.rs::tests::folding
  result: pass
  verdict: verified
  justification: ~/.SSH is refused, and so are .ZSHRC and .GIT/HOOKS/post-checkout. The patterns are emitted case-folded
    (unit test). The kernel also matches case-insensitively on this APFS volume (research R1), so the folding is
    a second guard.
  verified_at: '2026-10-30T09:00:14Z'
  commit: eb66876
- id: verification.sr-005.2026-10-30
  requirement: SR-005
  method: test
  evidence: crates/procage-policy/tests/presets.rs::every_preset_is_pinned; crates/procage-policy/tests/presets.rs::the_class_lists_are_pinned;
    crates/procage-policy/tests/presets.rs::presets_round_trip_with_their_tag
  result: pass
  verdict: verified
  justification: The lowered macOS profile of each preset V1 (workspace /work) equals its fixture, which includes
    the full class lists. The list sizes and key patterns are asserted, and the presets round-trip with their name
    and version tag. Injected list and preset changes failed these tests.
  verified_at: '2026-10-30T09:00:14Z'
  commit: eb66876
- id: verification.sr-006.2026-10-30
  requirement: SR-006
  method: review
  evidence: crates/procage-policy/src/lowering.md; crates/procage-policy/src/presets.rs:1; THREAT_MODEL.md#Release-status
  result: pass
  verdict: verified
  justification: The lowering table marks hd-secrets, hd-trust-handoff and hd-persistence as n/a on Linux with the
    note that the Linux spawn backend must implement them before it ships. The presets module docs and the threat-model
    release status say the same, and the 008 spec carries the requirement. Escape-class statuses are unchanged and
    the catalog gate passes.
  verified_at: '2026-10-30T09:00:14Z'
  commit: eb66876
decisions: []
