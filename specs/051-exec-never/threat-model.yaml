decisions:
- id: decision.macos-path-replaced
  threat: threat.program-path-replaced
  status: accepted
  owner: hupe1980
  rationale: 'macOS extension tokens are path-bound; a replaced program in a writable tree runs no more than the
    child already can. Same contract as decision.macos-reexec (clarification 2026-11-12: UX and DX first).'
  expires: '2027-05-11'
- id: decision.macos-reexec
  threat: threat.macos-reexec
  status: accepted
  owner: hupe1980
  rationale: 'Seatbelt cannot count executions; re-executing the program runs nothing the child cannot already run.
    Recorded as the documented macOS contract of Exec::Never (clarification 2026-11-12: UX and DX first, no opt-in
    for a small, stated limit).'
  expires: '2027-05-11'
