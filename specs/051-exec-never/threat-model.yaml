mitigations:
- id: mitigation.allowance-per-spawn
  name: The allowance is bound per spawn, like a grant, never compiled into the cage shared by its runs; on Linux
    it is opened by descriptor and stays with the inode that was checked
  riskReduction: 85
  attributes:
    threats:
    - threat.allowance-crosses-runs
    - threat.program-path-replaced
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage/src/unix.rs
    - crates/procage/src/macos/spawn.rs
    - crates/procage/src/linux/spawn.rs
    - crates/procage-policy/src/linux.rs
- id: mitigation.bounded-header-parse
  name: The ELF header is read with fixed bounds and no panics; the interpreter must be an absolute path to an existing
    regular file, else the spawn is refused
  riskReduction: 80
  attributes:
    threats:
    - threat.hostile-program-header
    status: verified
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - crates/procage-policy/src/elf.rs
    - crates/procage-policy/fuzz/fuzz_targets/elf.rs
    - crates/procage/src/unix.rs
- id: mitigation.kernel-checked-reports
  name: explain answers exec under Exec::Never from the same allowance, checked by caged tests; the lowering table
    and the receipt state the program allowance
  riskReduction: 85
  attributes:
    threats:
    - threat.report-disagrees
    status: verified
    kind: detective
    requirements:
    - SR-004
    - SR-005
    touchpoints:
    - crates/procage/tests/oracle.rs
    - crates/procage-policy/src/lowering.md
    - crates/procage-policy/tests/lowering_table.rs
    - bindings/python/src/lib.rs
    - bindings/nodejs/src/lib.rs
- id: mitigation.never-strips-base-exec
  name: Under Exec::Never and Exec::Program the lowering drops execute rights from every base rule (keeping read
    and map) and allows exec only through the per-spawn program allowance
  riskReduction: 90
  attributes:
    threats:
    - threat.base-exec-under-never
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage/tests/escape_macos.rs
    - crates/procage/tests/escape_linux.rs
- id: mitigation.no-supervisor-is-a-gap
  name: Exec::Never without a supervisor and Exec::Program on Linux are typed gaps (outcome Approximated); only
    acceptance by name proceeds, listed in the receipt; the gap message names the accepting call
  riskReduction: 90
  attributes:
    threats:
    - threat.supervisor-unavailable
    - threat.program-loader-route
    status: verified
    kind: preventive
    requirements:
    - SR-008
    touchpoints:
    - crates/procage/src/linux/probe.rs
    - crates/procage/src/linux/mod.rs
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage-policy/src/lower/mod.rs
- id: mitigation.one-exec-supervisor
  name: On Linux execve and execveat raise a seccomp notification; the parent supervisor answers CONTINUE once,
    for the exec procage child code issues before any caller code runs, and EPERM for every later one, of any process
    of the run
  riskReduction: 90
  attributes:
    threats:
    - threat.interpreter-route
    - threat.first-exec-claimed
    - threat.program-path-replaced
    status: verified
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - crates/procage/src/linux/supervisor.rs
    - crates/procage/src/linux/sys.rs
    - crates/procage/src/linux/mod.rs
    - crates/procage-policy/src/lower/linux.rs
- id: mitigation.refuse-scripts
  name: A program that starts with '#!' is refused under Exec::Never before forking
  riskReduction: 95
  attributes:
    threats:
    - threat.script-interpreter
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - crates/procage/src/unix.rs
    - crates/procage/src/linux/mod.rs
    - crates/procage/src/macos/mod.rs
- id: mitigation.supervisor-before-spawn
  name: The supervisor thread starts before command.spawn and waits for the handover until the child sends it or
    the parent marks the spawn done; the sentinel is created in the child with O_CLOEXEC after mark_fds and its
    read end closed there
  riskReduction: 90
  attributes:
    threats:
    - threat.supervisor-late
    - threat.sentinel-leak
    status: verified
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - crates/procage/src/linux/mod.rs
    - crates/procage/src/linux/supervisor.rs
    - crates/procage/src/linux/sys.rs
requirements:
- id: SR-001
  statement: Under Exec::Never and Exec::Program no process of the run MUST be able to execute any file other than
    its program (and, on Linux, that program ELF interpreter), whatever the base, on macOS, T1 and T2.
  priority: P1
  mitigations:
  - mitigation.never-strips-base-exec
  acceptance:
  - given: Base V1, V2 or V3 with Exec::Never or Exec::Program and fork, on macOS, T1 and T2
    then: every execution is refused, while the same probes under Exec::Granted run
    when: the caged shell and a descendant it forks execute /bin/echo, /usr/bin/env and /bin/sh
  - given: Base::None with Exec::Never and read access to what the program loads
    then: it runs and exits with its own status
    when: the program is spawned
  - given: Exec::Never on T1 and T2 and a dynamically linked program
    then: both are refused
    when: it executes its ELF interpreter directly (ld.so /bin/echo) or executes itself again
  tasks: []
- id: SR-002
  statement: The program allowance MUST hold for its own spawn only and MUST NOT let another run of the same cage
    execute that program.
  priority: P1
  mitigations:
  - mitigation.allowance-per-spawn
  acceptance:
  - given: one cage under Exec::Never and two spawns of different programs A and B
    then: it is refused
    when: the run of A tries to execute B
  - given: Exec::Program on Linux and a program in a writable tree
    then: the exec is refused (the rule holds the original inode)
    when: the program replaces its own file by rename and executes the path again
  tasks: []
- id: SR-003
  statement: Under Exec::Never and Exec::Program a program that starts with '#!' MUST be refused before forking
    with a typed error.
  priority: P1
  mitigations:
  - mitigation.refuse-scripts
  acceptance:
  - given: Exec::Never and an executable shell script as the program
    then: the call fails before forking with an error naming the script
    when: it is spawned or passed to Cage::exec
  tasks: []
- id: SR-004
  statement: explain MUST answer for execution under Exec::Never and Exec::Program as the kernel decides.
  priority: P1
  mitigations:
  - mitigation.kernel-checked-reports
  acceptance:
  - given: Exec::Never with a base
    then: both say denied
    when: explain asks whether /bin/echo may be executed and a caged shell tries it
  tasks: []
- id: SR-005
  statement: The lowering table and the Exec docs MUST state each setting per platform (exact, approximated, and
    the macOS re-execution under Exec::Never), and an accepted approximation MUST be listed in the receipt.
  priority: P1
  mitigations:
  - mitigation.kernel-checked-reports
  acceptance:
  - given: the lowering table
    then: exec-never and exec-program match their outcomes
    when: the table test compares it with the lowering on every target
  - given: an accepted exec-program approximation on Linux
    then: its approximations list exec-program
    when: the run receipt is read
  tasks: []
- id: SR-006
  statement: Reading the program header MUST be bounded and MUST NOT panic on any input; an interpreter that is
    not an absolute path to an existing regular file MUST fail the spawn.
  priority: P2
  mitigations:
  - mitigation.bounded-header-parse
  acceptance:
  - given: arbitrary bytes as the program file
    then: it returns a value or a typed error, never panics, and reads no more than its bound
    when: the header reader runs (fuzz target)
  - given: an ELF whose interpreter is relative, missing or a directory
    then: the spawn fails before forking with a typed error
    when: it is spawned under Exec::Never
  tasks: []
- id: SR-007
  statement: On Linux under Exec::Never exactly one exec MUST succeed per run, the one procage issues to start the
    program; every later execve and execveat of any process of the run MUST be refused.
  priority: P1
  mitigations:
  - mitigation.one-exec-supervisor
  acceptance:
  - given: Exec::Never on T1 and T2
    then: every call fails with EPERM and the program had started
    when: the program, after it started, executes itself, its interpreter and /bin/echo, and a forked descendant
      does the same
  - given: Exec::Never with violation reporting on
    then: the refusal is reported as a violation
    when: the program executes /bin/echo
  tasks: []
- id: SR-008
  statement: On Linux, Exec::Never where the one-exec supervisor cannot be installed and Exec::Program MUST fail
    as typed gaps unless the caller accepted the approximation by name; the gap message MUST name the accepting
    call.
  priority: P1
  mitigations:
  - mitigation.no-supervisor-is-a-gap
  acceptance:
  - given: Exec::Never and Cage::exec on Linux
    then: it fails before the cage is applied with the gap named
    when: it is called without accepting the approximation
  - given: an outer seccomp listener (simulated) and Exec::Never
    then: it fails with the gap; with the approximation accepted it runs and its receipt names it
    when: a run is spawned
  - given: Exec::Program on Linux
    then: it fails with a gap whose message names the call that accepts it
    when: the cage is created without accepting exec-program
  tasks: []
- id: SR-009
  statement: A spawn under Exec::Never on Linux MUST NOT block on its own exec, and the exec sentinel MUST NOT reach
    the program or any descendant.
  priority: P1
  mitigations:
  - mitigation.supervisor-before-spawn
  acceptance:
  - given: Exec::Never on T1 and T2 with and without violation reporting, from a parent with 8 threads spawning
      concurrently
    then: every spawn returns and every program runs
    when: 100 programs are spawned
  - given: Exec::Never
    then: only stdio and declared descriptors are open, and an exec it tries is refused
    when: the program lists its open descriptors
  tasks: []
