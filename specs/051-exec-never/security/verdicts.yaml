verdicts:
  - requirement: SR-001
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_macos.rs::r38_only_the_program_executes, crates/procage/tests/escape_linux.rs::r38_only_the_program_executes, crates/procage/tests/spawn_linux.rs::program_only_settings_start_the_program, crates/procage/tests/spawn_macos.rs::program_only_settings_start_the_program
    result: pass
    justification: Bases V1-V3 with Exec::Never and Exec::Program and fork; a forked bash executes /bin/echo, /usr/bin/env and /bin/sh and each is refused (EPERM or EACCES), while Exec::Granted runs them, on macOS, T1, T2 and T1 with reporting. The program starts under Base::None on Linux and Base::V1 on macOS (macOS Base::None is refused by design, spec US2). The interpreter and self routes are SR-007's canary. Passed 2026-11-12 (macOS 26.6.2, Linux 7.0.14).
  - requirement: SR-002
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_macos.rs::the_program_allowance_is_per_spawn, crates/procage/tests/spawn_linux.rs::the_program_allowance_is_per_spawn_and_per_file
    result: pass
    justification: Under Exec::Program, while one run of a cage executes zsh (macOS) or sh (Linux), a bash run of the same cage cannot execute it; on Linux a program renamed over by another file cannot execute its path again (inode-bound rule). Passed on macOS, T1 and T2.
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_macos.rs::program_only_settings_refuse_a_script, crates/procage/tests/spawn_linux.rs::program_only_settings_refuse_scripts_and_bad_interpreters
    result: pass
    justification: An executable #! script as the program fails with SpawnError::Script before forking, whose message names the fix, under both settings. Cage::exec reaches the same check through the shared prepare (crates/procage/src/unix.rs program_allowance, called from both backends' prepare).
  - requirement: SR-004
    verdict: verified
    method: test
    evidence: crates/procage/tests/oracle.rs::explain_agrees_with_the_kernel
    result: pass
    justification: The oracle adds exec never/program with bases V1 and V3 and asks every tree program for exec; the running caged child executes each one (X probe) and explain agrees with the kernel on macOS (1,278 questions per policy), T1 and T2 (1,277).
  - requirement: SR-005
    verdict: verified
    method: test
    evidence: crates/procage-policy/tests/lowering_table.rs::every_row_matches_the_lowering, crates/procage/tests/spawn_linux.rs::program_reexecutes_itself_and_nothing_else, crates/procage/tests/spawn_linux.rs::exec_never_without_a_listener_is_a_gap
    result: pass
    justification: The table rows exec-never and exec-program are checked against the lowering on every target and ABI; accepted exec-program and exec-never approximations appear in the run receipt's approximations.
  - requirement: SR-006
    verdict: verified
    method: test
    evidence: crates/procage-policy/src/elf.rs::tests::every_truncation_is_an_error_not_a_panic, crates/procage-policy/src/elf.rs::tests::bounds_hold, crates/procage-policy/fuzz/fuzz_targets/elf.rs, crates/procage/tests/spawn_linux.rs::program_only_settings_refuse_scripts_and_bad_interpreters
    result: pass
    justification: Every truncation is an error, header counts and path length are bounded, the fuzz target ran 40,426,256 inputs in 301 s without a panic, and an ELF with a relative interpreter fails with SpawnError::Interpreter before forking.
  - requirement: SR-007
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r38_never_refuses_every_exec_after_the_first, crates/procage/tests/spawn_linux.rs::a_refused_exec_is_reported
    result: pass
    justification: Under Exec::Never on T1 and T2 the started program's exec of itself, of its ELF interpreter loading /bin/echo, and its own exec replacement all fail with EPERM; with reporting the refused execve is one violation with DeniedBy::Exec and the program had started.
  - requirement: SR-008
    verdict: verified
    method: test
    evidence: crates/procage/tests/exec.rs::exec_never_runs_the_command_and_nothing_else, crates/procage/tests/spawn_linux.rs::exec_never_without_a_listener_is_a_gap, crates/procage/tests/spawn_linux.rs::program_reexecutes_itself_and_nothing_else
    result: pass
    justification: Cage::exec under Exec::Never on Linux fails before anything is applied with the gap; accepted, it runs and other programs are refused. With an outer listener the cage is a gap naming allow(Construct::ExecNever); accepted it runs and the receipt lists it. Exec::Program's gap names allow=["exec-program"].
  - requirement: SR-009
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_linux.rs::exec_never_spawns_from_many_threads, crates/procage/tests/escape_linux.rs::r38_the_program_holds_no_supervisor_descriptor
    result: pass
    justification: 8 threads spawn 12 programs each under Exec::Never, without and with reporting, and every spawn returns and runs; the started program holds no descriptor beyond stdio.
