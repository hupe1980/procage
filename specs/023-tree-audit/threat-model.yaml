  name: The walk limit bounds both walks (default 200,000 on both systems); the handoff audit is off unless with_handoff_audit;
    the link check examines only the Targets; SC-003 is measured
  riskReduction: 75
  attributes:
    threats:
    - threat.audit-cost
    status: verified
