- id: mitigation.typed-incomplete
  name: Both walks count entries against the walk limit and treat any walk error as loss; the result carries links_complete
    and handoff_complete with visited, the receipt says incomplete, and an incomplete link check runs the spawn
    but is never shown as clean
  riskReduction: 80
  attributes:
    threats:
