trustZones:
- id: tz.cage
  name: The caged child
  risk:
    trustRating: 5
- id: tz.harness
  name: The harness that builds cages and runs the audits
  risk:
    trustRating: 90
- id: tz.host-tools
  name: Unsandboxed programs that later run or follow what the writable trees hold (version control, editors, agents,
    build tools)
  risk:
    trustRating: 60
- id: tz.receipt-readers
  name: Whoever the harness hands a run receipt to (a reviewer, an archive, another system)
  risk:
    trustRating: 40
assets:
- id: asset.findings
  name: 'The audit result the harness reviews before trusting the trees: each link finding and handoff finding,
    the link audit mode (refuse, report, off) and completeness'
  risk:
    availability: 40
    confidentiality: 30
    integrity: 90
  attributes:
    type: capability
    source: spec.md#Key-Entities; data-model.md
    classification: internal
- id: asset.harness
  name: 'The harness process: memory, threads and the time the audits take'
  risk:
    availability: 60
    confidentiality: 0
    integrity: 50
  attributes:
    type: capability
    source: spec.md#SC-003
    classification: internal
- id: asset.protected
  name: Protected and hidden files the policy names, and the existing secrets, trust-handoff and persistence class
    files (for example .git/config, an SSH key)
  risk:
    availability: 30
    confidentiality: 100
    integrity: 90
  attributes:
    type: credential
    source: spec.md#FR-001; plan.md#Summary (Targets)
    classification: secret
- id: asset.receipt-audit
  name: 'The audit summary in the run receipt: counts and completeness, paths only when the policy is included'
  risk:
    availability: 20
    confidentiality: 50
    integrity: 70
  attributes:
    type: capability
    source: plan.md#Summary; data-model.md (Receipt audit)
    classification: internal
- id: asset.trees
  name: The writable trees, whose trust-handoff files, symbolic links and repository metadata unsandboxed tools
    later run or follow
  risk:
    availability: 40
    confidentiality: 50
    integrity: 90
  attributes:
    type: capability
    source: spec.md#Context
    classification: internal
components:
- id: component.docs
  name: THREAT_MODEL, crate docs (Audits), site page audits.md and CHANGELOG on R-07 and R-08
  type: document
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-005
- id: component.options
  name: CageOptions::with_link_audit (Refuse default, Report, Off), with_handoff_audit, with_walk_limit (default
    200,000 on both systems)
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: contracts/api.md; plan.md#Summary
- id: component.postrun
  name: 'Post-run handoff audit in the parent (audit.rs handoff, Child::audit): trust-handoff files, symbolic links,
    repository metadata, against the spawn snapshot; opt-in by with_handoff_audit'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-002; plan.md#Summary; contracts/api.md
- id: component.prerun
  name: 'Pre-run link check in the parent (audit.rs links): examines the Targets and finds every regular file with
    a link count above one, in prepare on each spawn'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-001; plan.md#Summary; contracts/api.md
- id: component.receipt
  name: Run receipt (spec 011, receipt.rs) carrying the audit summary
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-006; plan.md#Summary; data-model.md
- id: component.snapshot
  name: Snapshot of the writable trees taken before the fork (inode, size, ctime, mtime, link targets, .git directories)
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#Assumptions; plan.md#Summary
- id: component.spawn
  name: 'Spawn path: prepare in the parent (link check, snapshot), fork, sandbox apply in the child, exec; SpawnError::HardLinks'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-004; plan.md#Summary; contracts/api.md
- id: component.targets
  name: 'Targets, built from the resolved policy: literal protect and hide targets, their subpath roots, glob fixed
    prefixes with the glob, and the existing secrets, trust-handoff and persistence class paths'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: plan.md#Summary; spec.md#Clarifications
dataflows:
- id: flow.audit-receipt
  name: Both audit results become the receipt audit summary
  source: component.postrun
  destination: component.receipt
  assets:
  - asset.findings
  - asset.receipt-audit
  attributes:
    crosses: []
- id: flow.claims
  name: The docs tell the consumer what the audit proves
  source: component.docs
  destination: actor.consumer
  assets:
  - asset.findings
  attributes:
    crosses: []
- id: flow.confine
  name: The cage confines the child to the policy, protected and hidden files included
  source: component.spawn
  destination: tz.cage
  assets:
  - asset.protected
  attributes:
    crosses:
    - tz.harness
    - tz.cage
- id: flow.findings
  name: The audit result reaches the harness and its receipt
  source: component.postrun
  destination: actor.consumer
  assets:
  - asset.findings
  attributes:
    crosses: []
- id: flow.handoff
  name: Files, links and repository metadata the child wrote reach unsandboxed tools through the trees
  source: tz.cage
  destination: tz.host-tools
  assets:
  - asset.trees
  attributes:
    crosses:
    - tz.cage
    - tz.host-tools
- id: flow.mode
  name: The caller sets the link audit mode, the handoff audit and the walk limit
  source: actor.consumer
  destination: component.options
  assets:
  - asset.findings
  attributes:
    crosses: []
- id: flow.options
  name: The options reach prepare on each spawn
  source: component.options
  destination: component.spawn
  assets:
  - asset.findings
  attributes:
    crosses: []
- id: flow.prewalk
  name: The link check examines the protected, hidden and class files and refuses or allows the spawn
  source: component.prerun
  destination: component.spawn
  assets:
  - asset.protected
  - asset.findings
  attributes:
    crosses: []
- id: flow.receipt-out
  name: The harness hands the receipt, with its audit summary, to readers outside the harness
  source: component.receipt
  destination: tz.receipt-readers
  assets:
  - asset.receipt-audit
  attributes:
    crosses:
    - tz.harness
    - tz.receipt-readers
- id: flow.snapshot
  name: Before the fork the handoff audit walks the writable trees into the snapshot
  source: component.snapshot
  destination: component.postrun
  assets:
  - asset.trees
  - asset.harness
  attributes:
    crosses: []
- id: flow.targets
  name: The resolved policy becomes the Targets the link check examines
  source: component.targets
  destination: component.prerun
  assets:
  - asset.protected
  attributes:
    crosses: []
- id: flow.walk
  name: The post-run audit reads names, link targets and metadata the child chose, against the spawn snapshot
  source: tz.cage
  destination: component.postrun
  assets:
  - asset.trees
  - asset.harness
  attributes:
    crosses:
    - tz.cage
    - tz.harness
threats:
- id: threat.alias-missed
  name: 'A protected, hidden or class file with a second name (a hard link left by an earlier run, an unpacked archive
    or another program, anywhere: writable, readable or unreachable tree) is not examined (a subpath or glob not
    expanded into the Targets, a class path skipped) or its link count is not checked, so the child reads or writes
    it through the other name'
  categories:
  - Elevation of Privilege
  - Information Disclosure
  cwes:
  - CWE-62
  risk:
    comment: archives and earlier runs plant links easily; the alias defeats exactly the protect and hide rules
    impact: 90
    likelihood: 40
  attributes:
    source: spec.md#FR-001; spec.md#Clarifications; plan.md#Complexity-Tracking
    assets:
    - asset.protected
    status: open
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.targets
    - component.prerun
    - flow.targets
    - flow.prewalk
    - flow.confine
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.audit-cost
  name: The link check, on by default, walks a large protect or hide subpath (or class paths in every home) on every
    spawn, and the handoff audit walks the writable trees twice per run, so spawns slow down or the harness stalls
  categories:
  - Denial of Service
  cwes:
  - CWE-400
  risk:
    comment: a hide rule on a large directory is a normal policy; the cost lands on every spawn
    impact: 50
    likelihood: 40
  attributes:
    source: spec.md#SC-003; spec.md#Clarifications (cost); plan.md#Complexity-Tracking
    assets:
    - asset.harness
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.prerun
    - component.postrun
    - component.snapshot
    - flow.snapshot
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.audit-in-child
  name: The audit walk is placed between fork and exec, allocating or locking in the child of a multithreaded parent,
    so spawns deadlock
  categories:
  - Denial of Service
  risk:
    comment: excluded by the spec and the constitution; a refactor could still move it
    impact: 60
    likelihood: 15
  attributes:
    source: spec.md#FR-004; plan.md#Summary (prepare)
    assets:
    - asset.harness
    status: mitigated
    actor: actor.contributor
    constitution: IV. Syscalls only between fork and exec
    elements:
    - component.spawn
    profile: stride
    severity: low
    technique: resource-exhaustion
- id: threat.audit-too-early
  name: The post-run audit runs while a process of the run still writes (detached run, a descendant not yet killed),
    so an artefact written after the walk is never listed
  categories:
  - Repudiation
  risk:
    comment: a descendant that sleeps past the audit is a simple evasion
    impact: 80
    likelihood: 30
  attributes:
    source: spec.md#FR-002; contracts/api.md (Child::audit returns None while running)
    assets:
    - asset.findings
    status: open
    actor: actor.caged-code
    elements:
    - component.postrun
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.benign-links-block
  name: A protected, hidden or class file has a second name for a benign reason (a backup or package tool, a deliberate
    hard link), so the default refuse blocks every spawn and pushes the caller to Off
  categories:
  - Denial of Service
  risk:
    comment: hard-linked dotfiles and backups exist; an opaque refusal invites switching the check off
    impact: 50
    likelihood: 30
  attributes:
    source: spec.md#FR-001 (refuse is the default); contracts/api.md (SpawnError::HardLinks)
    assets:
    - asset.harness
    - asset.protected
    status: mitigated
    actor: actor.consumer
    elements:
    - component.prerun
    - component.spawn
    - component.options
    profile: stride
    severity: low
    technique: resource-exhaustion
- id: threat.check-spawn-race
  name: Between the link check in prepare and the exec, or between two spawns of the same cage, a process outside
    the cage gives a protected file a second name, so the child starts with an alias the check did not see
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-367
  risk:
    comment: needs an unsandboxed writer of the same user racing the spawn; a stale cached result widens it to every
      later spawn
    impact: 80
    likelihood: 15
  attributes:
    source: plan.md#Summary (prepare, each spawn)
    assets:
    - asset.protected
    status: mitigated
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.prerun
    - component.spawn
    - flow.prewalk
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.finding-injection
  name: File names and link targets the child chose carry control characters or invalid UTF-8, so a lossy finding
    names the wrong path or the harness display and log are injected
  categories:
  - Tampering
  cwes:
  - CWE-150
  risk:
    comment: the harness shows findings to a human who decides on them
    impact: 50
    likelihood: 40
  attributes:
    source: spec.md#Key-Entities
    assets:
    - asset.findings
    status: open
    actor: actor.caged-code
    constitution: II. Types over strings
    elements:
    - flow.walk
    - flow.findings
    profile: stride
    severity: medium
    technique: injection
- id: threat.in-run-link
  name: The claim that a caged child cannot hard link a protected or hidden file during the run fails on one lane
    (a Seatbelt or Landlock change, a T1 mount gap), and no audit lists links made during the run
  categories:
  - Elevation of Privilege
  risk:
    comment: measured on one macOS release; the spec relies on it to not list in-run links
    impact: 80
    likelihood: 15
  attributes:
    source: spec.md#Clarifications (hard links made during the run)
    assets:
    - asset.protected
    status: open
    actor: actor.caged-code
    constitution: III. The kernel is the oracle
    elements:
    - flow.confine
    - component.spawn
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.mtime-reset
  name: The child changes a trust-handoff file in place and resets its modification time (or keeps size and inode),
    so the post-run audit compares equal to the snapshot and lists nothing
  categories:
  - Tampering
  - Repudiation
  cwes:
  - CWE-345
  risk:
    comment: utimensat is one call for an adaptive child; an unlisted hook runs unsandboxed later
    impact: 90
    likelihood: 50
  attributes:
    source: spec.md#Assumptions
    assets:
    - asset.trees
    - asset.findings
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.snapshot
    - component.postrun
    - flow.handoff
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.nc-links-during-run
  name: '[NEEDS CLARIFICATION: does the post-run audit list hard links created during the run that alias a protected
    or hidden file, or does only the next spawn''s pre-run audit catch them?]'
  categories:
  - Elevation of Privilege
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.protected
    status: retired
    actor: actor.caged-code
    disposition: needs-clarification
    elements:
    - component.postrun
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: broken-access-control
- id: threat.nc-protected-set
  name: '[NEEDS CLARIFICATION: how does the pre-run audit turn subpath and glob protect or hide rules into the inode
    set it compares against (walk them too, under the same limit), and what happens when that set is incomplete?]'
  categories:
  - Elevation of Privilege
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.protected
    status: retired
    actor: actor.caged-code
    disposition: needs-clarification
    elements:
    - component.prerun
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: broken-access-control
- id: threat.nc-readable-trees
  name: '[NEEDS CLARIFICATION: does the pre-run audit also check readable (not writable) trees, since a hard link
    to a hidden file inside a read-only grant reveals it just the same?]'
  categories:
  - Information Disclosure
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.protected
    status: retired
    actor: actor.caged-code
    disposition: needs-clarification
    elements:
    - component.prerun
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: sensitive-data-exposure
- id: threat.receipt-paths-leak
  name: The receipt audit summary carries finding paths (secret file names, home layout, workspace names) to readers
    who were not given the policy
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    comment: receipts are made to be handed on; paths of secrets and aliases reveal what the host holds
    impact: 40
    likelihood: 40
  attributes:
    source: plan.md#Summary (paths only with the policy included); data-model.md
    assets:
    - asset.receipt-audit
    - asset.protected
    status: mitigated
    actor: actor.consumer
    elements:
    - component.receipt
    - flow.audit-receipt
    - flow.receipt-out
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.report-mode-silent
  name: Report or Off applies by default, or without being recorded in the audit result and the receipt, so a cage
    is silently weaker than its policy
  categories:
  - Elevation of Privilege
  risk:
    comment: a wrong default or a lost flag turns refuse into report for every caller
    impact: 90
    likelihood: 30
  attributes:
    source: spec.md#Clarifications; contracts/api.md (LinkAudit)
    assets:
    - asset.protected
    - asset.findings
    status: open
    actor: actor.contributor
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.options
    - component.prerun
    - component.receipt
    - flow.mode
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.silent-partial
  name: A tree or a protect subpath floods past the walk limit, or a directory is unreadable, and the audit returns
    a partial result that reads as complete (an incomplete link check lets the spawn proceed by design), or the
    walk exhausts the harness
  categories:
  - Repudiation
  - Denial of Service
  risk:
    comment: creating a million files or a mode-000 directory is trivial; a clean-looking list is trusted
    impact: 70
    likelihood: 60
  attributes:
    source: spec.md#FR-003; spec.md#Clarifications; data-model.md (links_complete, handoff_complete)
    assets:
    - asset.findings
    - asset.harness
    status: open
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.prerun
    - component.postrun
    - component.receipt
    - flow.walk
    profile: stride
    severity: high
    technique: missing-audit-trail
- id: threat.status-overclaim
  name: The threat model moves R-08 to mitigated or detected, or presents the post-run audit as preventing trust
    handoff, without canaries on every lane, so a consumer stops reviewing what the run left
  categories:
  - Repudiation
  risk:
    comment: an empty audit is easy to read as proof of a clean tree
    impact: 60
    likelihood: 40
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.findings
    status: mitigated
    actor: actor.contributor
    constitution: III. The kernel is the oracle
    elements:
    - component.docs
    - flow.claims
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.target-replaced-by-link
  name: A protected or hidden target is replaced by a symbolic link (where its directory is writable, as on Linux
    T2) to a file with a second name; the check uses lstat, sees a link with one name and no finding, while the
    rule or the child follows the link
  categories:
