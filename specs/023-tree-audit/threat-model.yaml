requirements:
- id: SR-001
  statement: Before every spawn, procage MUST examine, in the parent, every literal protect and hide target, every
    file under protect and hide subpaths and under the fixed prefix of protect and hide globs, and the existing
    files of the secrets, trust-handoff and persistence classes in every home; a regular file with a link count
    above one MUST be a link finding unless every one of its names was found among the targets and, for a file found
    in a hidden target, every name lies in a hidden target. Globs are matched exactly for *, ? and **; a glob with
    classes or alternatives is matched conservatively and its matches never count as accounted names. Cache directories
    inside class paths and the large application data and privacy-guarded folders named in the threat model are
    not examined. In Refuse mode a finding MUST fail the spawn with SpawnError::HardLinks.
  priority: P1
  mitigations:
  - mitigation.inode-match
  acceptance:
  - given: a file in a writable tree hard-linked to a protected .git/config
    then: the spawn fails with HardLinks naming .git/config and its link count, and the target never runs
    when: the cage spawns with Refuse on macOS, Linux T1 and T2
  - given: a hidden file whose second name lies in a readable-only tree, and a secrets class file whose second name
      lies outside every granted tree
    then: the spawn fails naming both files
    when: the cage spawns with Refuse
  - given: a protect or hide glob, a file it matches with a second name outside the glob, and a multi-link file
      under the glob's prefix that the glob does not match
    then: the matched file is a finding and the unmatched one is not
    when: the link check runs
  - given: hard links only between unprotected files in a writable tree
    then: it runs and the audit has no link finding
    when: the cage spawns
  tasks: []
- id: SR-002
  statement: LinkAudit::Refuse MUST be the default for every cage; Report and Off MUST take effect only when the
    caller names them, and the mode and every link finding MUST be in the audit result and in the receipt when receipts
    exist.
  priority: P1
  mitigations:
  - mitigation.refuse-default
  acceptance:
  - given: CageOptions with no link audit option
    then: the spawn is refused with HardLinks
    when: a cage whose protected file has a second name spawns
  - given: with_link_audit(Report)
    then: the child runs, and the audit result and the receipt record Report and list the file
    when: the same cage spawns
  - given: with_link_audit(Off)
    then: the child runs and the audit result and the receipt record Off, never an empty complete link check
    when: the same cage spawns
  tasks: []
- id: SR-003
  statement: The post-run audit MUST list each trust-handoff file created or modified, each symbolic link created
    (with its target) and each repository metadata directory created in the writable trees exactly once, and MUST
    detect a change by inode, size and status-change time, never by modification time alone.
  priority: P1
  mitigations:
  - mitigation.ctime-snapshot
  acceptance:
  - given: a waived trust-handoff class and an existing .git/hooks/pre-commit
    then: the audit lists it as modified
    when: the child rewrites it with the same size and resets its modification time
  - given: Linux T1 and a .vscode/settings.json that did not exist at spawn
    then: the audit lists it as created
    when: the child creates it
  - given: a child that creates a symbolic link build pointing to the home directory and a nested .git directory
    then: it lists the link with its target and the repository metadata, each once
    when: the audit runs
  - given: a run that touched nothing of these kinds
    then: it is empty and complete
    when: the audit runs
  tasks: []
- id: SR-004
  statement: Both audits MUST stop at the walk limit and MUST mark their result incomplete, with the entries visited,
    past the limit or when any entry cannot be read; an incomplete link check MUST NOT refuse the spawn, and an
    incomplete result MUST NOT be presentable as an empty complete one, in the audit result or in the receipt.
  priority: P1
  mitigations:
  - mitigation.typed-incomplete
  acceptance:
  - given: a protect subpath with more files than a small walk limit
    then: the child runs, links_complete is false with the visited count, and the receipt says the audit is incomplete
    when: the cage spawns with Refuse
  - given: a child that creates more files than the walk limit
    then: handoff_complete is false with the count reached, within the time bound of SC-003 scaled to the limit
    when: the post-run audit runs
  - given: a child that makes a directory in a tree unreadable
    then: the result is incomplete
    when: either audit runs
  tasks: []
- id: SR-005
  statement: Audit walks MUST NOT follow symbolic links or cross to another device, and MUST read link targets without
    resolving them.
  priority: P1
  mitigations:
  - mitigation.nofollow-walk
  acceptance:
  - given: a child that creates a link loop pointing to its own directory and a link out pointing to the home directory
    then: it terminates, lists both links with their targets, and lists nothing from the home directory
    when: the post-run audit runs
  - given: a protect subpath containing a symbolic link to a directory outside it
    then: the link is not traversed and no file outside the subpath is examined through it
    when: the pre-run link check runs
  tasks: []
- id: SR-006
  statement: The post-run audit MUST run only after the run is over (child reaped, every process of the run gone);
    before that it MUST return incomplete with that reason.
  priority: P2
  mitigations:
  - mitigation.after-run-only
  acceptance:
  - given: a detached run whose descendant still runs
    then: it is incomplete because the run has not ended
    when: the harness asks for the post-run audit
  - given: a run with Lifetime::Run whose descendant writes a hook after the child exits
    then: the descendant is gone and the hook is listed
    when: the run ends and the audit runs
  tasks: []
- id: SR-007
  statement: Findings MUST keep paths and link targets as exact bytes; their serialised form MUST round-trip them
    and their display MUST escape control characters.
  priority: P2
  mitigations:
  - mitigation.byte-paths
  acceptance:
  - given: a created file whose name holds a newline, an escape character and invalid UTF-8
    then: the bytes are equal and the display shows the characters escaped
    when: the finding is serialised, read back and displayed
  tasks: []
- id: SR-008
  statement: Both audits MUST run in the parent, never between fork and exec in the child.
  priority: P3
  mitigations:
  - mitigation.parent-only
  acceptance:
  - given: a multithreaded parent spawning many cages with both audits on
    then: no spawn deadlocks and the child-side call sequence is unchanged
    when: the spawn tests run
  tasks: []
- id: SR-009
  statement: The threat model MUST change R-08's status only with non-ignored canaries on every lane, MUST record
    R-07 as detected by the post-run audit and still a harness responsibility, and the docs MUST NOT present an
    empty audit as proof that the trees are safe.
  priority: P2
  mitigations:
  - mitigation.measured-status
  acceptance:
  - given: THREAT_MODEL, the crate docs and the site
    then: R-08 names its canaries per lane, R-07 says the harness still reviews the trees, and no text calls an
      empty audit proof
    when: they describe R-07, R-08 and the audit
  tasks: []
- id: SR-010
  statement: The link check MUST run in the parent on every spawn as the last step before the fork, re-examining
    the Targets each time, and MUST NOT reuse a result from an earlier spawn.
  priority: P2
  mitigations:
  - mitigation.check-last
  acceptance:
  - given: a cage that spawned cleanly once
    then: the second spawn is refused
    when: a second name is given to its protected file and the same cage spawns again
  - given: a protect subpath
    then: the spawn is refused naming that file
    when: an aliased file is created under it after the cage was built and the cage spawns
  tasks: []
- id: SR-011
  statement: A literal protect or hide target that is a symbolic link MUST be a link finding, so that Refuse fails
    the spawn, without the check following the link.
  priority: P1
  mitigations:
  - mitigation.target-link-finding
  acceptance:
  - given: a protected .git/config replaced by a symbolic link to a file with a second name
    then: the spawn fails naming .git/config
    when: the cage spawns with Refuse on macOS, Linux T1 and T2
  tasks: []
- id: SR-012
  statement: Every lane MUST have a non-ignored canary in which a caged child tries to hard link a protected and
    a hidden file into a writable tree and the kernel refuses it.
  priority: P2
  mitigations:
  - mitigation.in-run-canary
  acceptance:
  - given: the escape suites on macOS, Linux T1 and T2
    then: both calls fail and no second name exists after the run
    when: the child calls link on a protected and on a hidden file
  tasks: []
- id: SR-013
  statement: The receipt audit summary MUST hold only counts, mode and completeness unless the receipt includes
    the policy; finding paths MUST NOT appear otherwise.
  priority: P2
  mitigations:
  - mitigation.receipt-counts
  acceptance:
  - given: a Report run with a link finding and a handoff finding
    then: it holds the counts, the mode and completeness, and no finding path bytes
    when: the receipt is built without the policy
  - given: the same run
    then: the finding paths are present
    when: the receipt is built with the policy
  tasks: []
- id: SR-014
  statement: Both walks MUST honour the walk limit (default 200,000 on both systems); the handoff audit MUST NOT
    walk unless with_handoff_audit is set; the link check MUST stay within SC-003.
  priority: P2
  mitigations:
  - mitigation.bounded-cost
  acceptance:
  - given: a cage without with_handoff_audit
    then: no snapshot is taken and the audit has no handoff part
    when: it spawns and the run ends
  - given: the default policy and a 10,000-file workspace on the reference machine
    then: it adds under 10 ms to the spawn
    when: the link check runs
  tasks: []
- id: SR-015
  statement: SpawnError::HardLinks MUST name every refused file with its link count, and its message MUST say that
    removing the extra name, or choosing Report or Off by name, lets the spawn proceed.
  priority: P3
  mitigations:
  - mitigation.actionable-refusal
  acceptance:
  - given: two protected files with second names
    then: the error lists both files with their link counts and the message names the remedies
    when: the spawn is refused
  tasks: []
