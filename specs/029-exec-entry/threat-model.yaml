requirements:
- id: SR-001
  statement: A command run with exec MUST be confined like a spawned one for the same policy - writes outside the
    grant and the environment rules are enforced - on macOS and Linux T1 and T2.
  priority: P1
  mitigations:
  - mitigation.shared-sequence
  acceptance:
  - given: a helper that execs a shell in a cage with a write grant
    then: the inside write succeeds and the outside one fails
    when: the shell writes inside and outside the grant
  - given: a secret in the helper's environment and env_clear on the command
    then: the secret is absent
    when: the command prints its environment
  tasks: []
- id: SR-002
  statement: Each refusal that can be known before the first change (tmpdir grant, missing program, multithreaded
    caller on Linux T1, environment decision) MUST return an error and leave the helper unconfined.
  priority: P1
  mitigations:
  - mitigation.checks-first
  acceptance:
  - given: each misuse
    then: it returns its typed error and an outside write by the helper still succeeds
    when: exec is called
  tasks: []
- id: SR-003
  statement: The exec'd command MUST keep the helper's pid and process group, and a kill of that group MUST end
    the command and a background descendant on macOS and Linux; on Linux a descendant MUST NOT be able to start
    its own session.
  priority: P1
  mitigations:
  - mitigation.same-process
  acceptance:
  - given: a helper started in its own process group whose command starts a background sleeper
    then: the command and the sleeper are gone
    when: the outside code kills the group
  - given: the exec'd command
    then: the pid is the helper's
    when: it prints its pid
  tasks: []
- id: SR-004
  statement: The docs MUST state the lifetime of an exec'd command on each system, including that macOS does not
    reach a descendant in its own session.
  priority: P2
  mitigations:
  - mitigation.honest-lifetime-docs
  acceptance:
  - given: the crate docs and the threat model
    then: both state the per-system lifetime and the macOS limit
    when: read for exec
  tasks: []
verification:
- id: verification.sr-001.2026-10-31
  requirement: SR-001
  method: test
  evidence: tests/exec.rs::becomes_the_command, tests/exec.rs::env_clear_keeps_secrets_out
  result: pass
  verdict: verified
  justification: A helper execs a shell in a cage with a write rule; the shell's write inside succeeds and outside
    is denied, and with env_clear under passthrough the command sees only A=1 although the helper's environment
    holds a secret; macOS, Linux T1 and T2. Both paths share prepare and the child sequence (only the session mode
    differs).
  verified_at: '2026-10-31T18:55:52Z'
  commit: 6d05458
- id: verification.sr-002.2026-10-31
  requirement: SR-002
  method: test
  evidence: tests/exec.rs::the_tmpdir_grant_is_refused, tests/exec.rs::a_missing_program_is_refused, tests/exec.rs::a_threaded_caller_is_refused_on_t1
  result: pass
  verdict: verified
  justification: Each misuse returns its typed error (GrantError::TmpdirWithExec, an Io NotFound naming the program,
    Unsupported::ExecThreads with the thread count) and the test process then writes outside every policy successfully.
    The environment refusal is the spawn path's (spec 026, unit-tested there).
  verified_at: '2026-10-31T18:55:52Z'
  commit: 6d05458
- id: verification.sr-003.2026-10-31
  requirement: SR-003
  method: test
  evidence: tests/exec.rs::becomes_the_command, tests/exec.rs::a_group_kill_ends_everything, tests/exec.rs::descendants_cannot_leave_the_group
  result: pass
  verdict: verified
  justification: The command prints the helper's pid; killing the group of a shell that started the helper (not
    led by it) ends the command and its background sleeper on macOS and Linux, and fails if exec starts a session
    (negative control); on Linux a descendant's setsid fails.
  verified_at: '2026-10-31T18:55:52Z'
  commit: 6d05458
- id: verification.sr-004.2026-10-31
  requirement: SR-004
  method: review
  evidence: src/lib.rs:45, THREAT_MODEL.md:34, src/macos/mod.rs:629
  result: pass
  verdict: verified
  justification: The crate docs' Helpers section, the exec rustdoc on both backends and the threat model's release
    status state the per-system lifetime, including that macOS does not reach a descendant in its own session and
    pointing to Cage::spawn.
  verified_at: '2026-10-31T18:55:52Z'
  commit: 6d05458
