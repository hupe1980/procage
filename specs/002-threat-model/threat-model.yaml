  risk:
    impact: 85
    likelihood: 50
  attributes:
    source: spec.md#FR-007
    assets:
    - asset.evidence-reference
    status: mitigated
    actor: actor.contributor
    constitution: III. The kernel is the oracle (comparing emitted SBPL or BPF is not evidence)
    disposition: threat
    elements:
    - flow.contributor-to-catalog
    - component.catalog-gate
    profile: stride
    severity: high
    technique: false-evidence
- id: threat.malformed-row-skipped
  name: A malformed or reformatted catalog row is silently skipped by the gate, so a class vanishes from checking
    while still appearing to be listed
  categories:
  - Tampering
  cwes:
  - CWE-1286
  risk:
    impact: 70
    likelihood: 50
  attributes:
    source: spec.md#FR-010
    assets:
    - asset.escape-catalog
    status: mitigated
    actor: actor.contributor
    disposition: threat
    elements:
    - component.catalog-gate
    - flow.catalog-to-gate
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.missing-scope-section
  name: A required threat-model section (out of scope, strength versus microVMs, private-interface dependency, release
