threats:
- id: threat.catalog-as-exploit-guide
  name: An attacker uses the published catalog, with its planned statuses, as a recipe of working escapes against
    early adopters
  categories:
  - Information Disclosure
  risk:
    impact: 40
    likelihood: 20
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.escape-catalog
    status: mitigated
    actor: actor.attacker
    disposition: threat
    elements:
    - flow.package-to-readers
    - flow.repo-to-readers
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.dangling-kernel-observation
  name: A cited kernel fact is renamed or removed from the kernel-facts suite, so the catalog cites evidence that
    no longer runs
  categories:
  - Tampering
  - Repudiation
  risk:
    impact: 50
    likelihood: 40
  attributes:
    source: spec.md#FR-008
    assets:
    - asset.kernel-observation
    status: mitigated
    actor: actor.contributor
    disposition: threat
    elements:
    - flow.kernel-facts-to-gate
    - component.kernel-facts-suite
    profile: stride
    severity: medium
    technique: data-tampering-at-rest
- id: threat.divergent-or-missing-published-copy
  name: The crate package or docs page ships without the threat model, or with a copy that differs from the repository,
    so crates.io readers see no boundary or a stale one that cannot be corrected once published
  categories:
  - Tampering
  risk:
    impact: 70
    likelihood: 50
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.threat-model-doc
    status: mitigated
    actor: actor.maintainer
    disposition: threat
    elements:
    - component.crate-package
    - flow.doc-to-package
    - component.crate-docs
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.evidence-not-a-caged-test
  name: A mitigated row names evidence that exists but does not cage a child (a unit test, a constant assertion,
    an SBPL string comparison), so the evidence rule is met in form only
  categories:
