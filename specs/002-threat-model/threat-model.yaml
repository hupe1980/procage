mitigations:
- id: mitigation.class-level-descriptions
  name: Catalog rows describe the class and cite only publicly known sources; no step-by-step exploit, payload or
    proof of concept is published
  riskReduction: 50
  attributes:
    threats:
    - threat.catalog-as-exploit-guide
    status: verified
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - THREAT_MODEL.md
- id: mitigation.evidence-gate
  name: The gate fails any row with status mitigated or detected whose evidence does not resolve to an existing
    test, and fails present-tense enforcement wording in README and crate docs per review checklist
  riskReduction: 80
  attributes:
    threats:
    - threat.overclaimed-enforcement
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - tests/threat_model.rs
    - README.md
    - src/lib.rs
- id: mitigation.evidence-location-rule
  name: Evidence may only point at tests in the integration-test locations that run caged children (escape suite
    canaries, kernel-level spawn tests), never at unit tests in the library source
  riskReduction: 60
  attributes:
    threats:
    - threat.evidence-not-a-caged-test
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - tests/threat_model.rs
- id: mitigation.kernel-fact-resolution
  name: The gate resolves every observed-on id against the kernel-facts catalog
  riskReduction: 85
  attributes:
    threats:
    - threat.dangling-kernel-observation
    status: verified
    kind: detective
    requirements:
    - SR-005
    touchpoints:
    - tests/threat_model.rs
    - tests/kernel_facts/tests/kernel_facts.rs
- id: mitigation.planning-gate-coverage
  name: The planning-path gate scans the new published files, and the document is reviewed so that no internal planning
    content is copied
  riskReduction: 70
  attributes:
    threats:
    - threat.planning-content-leak
    status: verified
    kind: preventive
    requirements:
    - SR-008
    touchpoints:
    - justfile
    - THREAT_MODEL.md
    - SECURITY.md
- id: mitigation.private-reporting-policy
  name: A security policy names a private reporting route and asks reporters not to open public issues for escapes
  riskReduction: 60
  attributes:
    threats:
    - threat.public-escape-report
    status: verified
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - SECURITY.md
- id: mitigation.published-id-baseline
  name: The gate holds the append-only list of published ids and fails when any is absent or duplicated
  riskReduction: 85
  attributes:
    threats:
    - threat.silent-id-removal
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - tests/threat_model.rs
- id: mitigation.required-sections-check
  name: The gate checks that each required heading of the threat model is present and that the release-status section
    names the current crate version
  riskReduction: 70
  attributes:
    threats:
    - threat.missing-scope-section
    status: verified
    kind: detective
    requirements:
    - SR-007
    touchpoints:
    - tests/threat_model.rs
    - THREAT_MODEL.md
- id: mitigation.single-source-embedding
  name: The crate docs embed the document from one file that the package includes; a check builds the docs from
    the packaged crate
  riskReduction: 80
  attributes:
    threats:
    - threat.divergent-or-missing-published-copy
    status: verified
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - Cargo.toml
    - src/threat_model.rs
    - justfile
- id: mitigation.strict-row-parser
  name: Every table row in the catalog section must parse into all fields with allowed values; an unparsable row
    fails the gate instead of being skipped, and the parsed count must equal the baseline count
  riskReduction: 85
  attributes:
    threats:
    - threat.malformed-row-skipped
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - tests/threat_model.rs
requirements:
- id: SR-001
  statement: The catalog gate MUST fail when a row has status mitigated or detected and its evidence is empty or
    names a test that does not exist in the repository, and the README and crate docs MUST NOT state enforcement
    in the present tense while no sandboxing API ships.
  priority: P1
  mitigations:
  - mitigation.evidence-gate
  acceptance:
  - given: a row marked mitigated with empty evidence
    then: it fails naming the id and the evidence rule
    when: the gate runs
  - given: a row marked detected whose evidence names a non-existent test
    then: it fails naming the id and the unresolved reference
    when: the gate runs
  - given: the README and crate docs of a release with no sandboxing API
    then: no sentence describes enforcement in the present tense
    when: they are reviewed
  tasks: []
- id: SR-002
  statement: Evidence for mitigated or detected MUST resolve to a test function in an integration-test location
    that runs a caged child; references into library source or unit tests MUST fail the gate.
  priority: P1
  mitigations:
  - mitigation.evidence-location-rule
  acceptance:
  - given: evidence pointing at a unit test inside the library source
    then: it fails naming the id and the location rule
    when: the gate runs
  tasks: []
- id: SR-003
  statement: The gate MUST fail when any id in the published-id baseline is absent from the catalog or an id appears
    twice.
  priority: P1
  mitigations:
  - mitigation.published-id-baseline
  acceptance:
  - given: the R-22 row deleted
    then: it fails naming R-22 as missing
    when: the gate runs
  - given: a second row with id R-10
    then: it fails naming R-10 as duplicated
    when: the gate runs
  tasks: []
- id: SR-004
  statement: The gate MUST reject, not skip, any row in the catalog section that does not parse into every field
    with an allowed value, and MUST fail when the parsed row count differs from the baseline count.
  priority: P1
  mitigations:
  - mitigation.strict-row-parser
  acceptance:
  - given: a row with status "done"
    then: it fails naming the id, the field and the allowed values
    when: the gate runs
  - given: a row with a missing column
    then: it fails naming the line instead of ignoring the row
    when: the gate runs
  tasks: []
- id: SR-005
  statement: The gate MUST fail when an observed-on entry names a kernel fact absent from the kernel-facts catalog.
  priority: P2
  mitigations:
  - mitigation.kernel-fact-resolution
  acceptance:
  - given: a row citing KF-M99
    then: it fails naming the id and KF-M99
    when: the gate runs
  tasks: []
- id: SR-006
  statement: The threat model MUST come from one source file that the crate package includes, and the crate documentation
    MUST build from the packaged crate alone with warnings as errors.
  priority: P1
  mitigations:
  - mitigation.single-source-embedding
  acceptance:
  - given: the packaged crate
    then: it contains the threat-model file
    when: its file list is inspected
  - given: the unpacked package
    then: the build succeeds and the threat-model page is present
    when: its docs are built with warnings denied
  tasks: []
- id: SR-007
  statement: The gate MUST fail when a required threat-model heading (adversary, assets, trusted, in scope, out
    of scope, strength, dependencies, non-goals, release status, escape classes) is missing or the release-status
    section does not name the crate's current version.
  priority: P1
  mitigations:
  - mitigation.required-sections-check
  acceptance:
  - given: the out-of-scope heading removed
    then: it fails naming the missing heading
    when: the gate runs
  - given: a release-status section naming 0.0.0 while the crate is 0.0.1
    then: it fails naming both versions
    when: the gate runs
  tasks: []
- id: SR-008
  statement: The planning-path gate MUST scan the threat-model document and the security policy, and the published
    files MUST NOT contain internal planning content (open user actions, unpublished decisions).
  priority: P2
  mitigations:
  - mitigation.planning-gate-coverage
  acceptance:
  - given: a planning path injected into the threat-model document
    then: it fails naming the file
    when: the planning-path gate runs
  - given: the finished document
    then: it contains no open user action or unpublished decision from the planning notes
    when: it is reviewed
  tasks: []
- id: SR-009
  statement: The repository MUST contain a security policy that names a private reporting route, asks reporters
    not to file escapes as public issues, and refers to the threat model for scope.
  priority: P2
  mitigations:
  - mitigation.private-reporting-policy
  acceptance:
  - given: the repository root
    then: it names a private route, asks for no public issue and links the threat model
    when: a reporter opens the security policy
  tasks: []
- id: SR-010
  statement: Catalog rows MUST describe classes at the level of a one-line description with public sources and MUST
    NOT include exploit steps, payloads or proofs of concept.
  priority: P3
  mitigations:
  - mitigation.class-level-descriptions
  acceptance:
  - given: the published catalog
    then: no row contains commands, payloads or exploit steps
    when: it is reviewed
  tasks: []
