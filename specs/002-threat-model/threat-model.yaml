  categories:
  - Spoofing
  - Repudiation
  cwes:
  - CWE-1059
  risk:
    impact: 90
    likelihood: 60
  attributes:
    source: spec.md#FR-007
    assets:
    - asset.escape-catalog
    - asset.evidence-reference
    - asset.threat-model-doc
    status: mitigated
    actor: actor.contributor
    constitution: III. The kernel is the oracle (no enforcement claim without a caged-child test)
    disposition: threat
    elements:
    - flow.contributor-to-catalog
    - component.readme
    - component.crate-docs
    profile: stride
    severity: high
    technique: false-evidence
- id: threat.planning-content-leak
