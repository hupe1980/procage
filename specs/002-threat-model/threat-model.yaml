otmVersion: 0.2.0
project:
  id: 002-threat-model
  name: Published threat model and escape-class contract
threatspec:
  actors:
  - id: actor.adopter
    name: Adopter or reviewer who reads the threat model to decide whether to rely on procage
    trust: semi-trusted
  - id: actor.attacker
    name: Attacker who reads the published catalog or watches public issues
    trust: untrusted
  - id: actor.contributor
    name: Contributor or later feature that changes the catalog through a pull request
    trust: semi-trusted
  - id: actor.maintainer
    name: Maintainer who edits and publishes the threat model
    trust: trusted
  - id: actor.reporter
    name: Person who found an escape and wants to report it
    trust: semi-trusted
  dispositions:
  - disposition: not-applicable
    reason: 'no authentication surface: the feature publishes documents and a test gate; no principal is authenticated'
    technique: credential-theft
  - disposition: not-applicable
    reason: 'no authentication surface: no component accepts identities'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: 'no shared-tenant surface: one public repository and crate, no tenant data'
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: 'no authorization surface: the feature enforces no permissions; repository write access is the platform''s'
    technique: broken-access-control
  - disposition: no-threat-detected
    reason: 'checked flow.package-to-readers and flow.repo-to-readers: crates.io, docs.rs and GitHub serve over
      TLS and crates.io packages are checksummed; the feature adds no transport of its own'
    technique: data-tampering-in-transit
  - disposition: no-threat-detected
    reason: 'checked flow.catalog-to-gate and flow.kernel-facts-to-gate: the gate reads repository files as text
      and compares strings; no shell, template or path sink is fed by catalog content'
    technique: injection
  - disposition: no-threat-detected
    reason: 'checked asset.escape-catalog and asset.published-id-baseline: every change is a reviewed commit in
      version control, so status changes are attributable'
    technique: missing-audit-trail
  - disposition: no-threat-detected
    reason: 'checked component.catalog-gate: it parses a few repository files of bounded size inside the existing
      test run'
    technique: resource-exhaustion
  - disposition: no-threat-detected
    reason: 'checked component.crate-package: the package adds a document only; no configuration or secret is written
      or read'
    technique: privilege-escalation-via-config
  - disposition: not-applicable
    reason: 'no llm-inference surface: the feature calls no language model (the threat model only describes LLM-driven
      adversaries)'
    technique: prompt-injection-direct
  - disposition: not-applicable
    reason: no untrusted-content-to-model surface
    technique: prompt-injection-indirect
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: sensitive-information-disclosure
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: excessive-agency
  - disposition: not-applicable
    reason: 'no model-supply-chain surface: no models, adapters or datasets'
    technique: model-supply-chain
  - disposition: not-applicable
    reason: no persistent-model-input surface
    technique: training-data-poisoning
  - disposition: not-applicable
    reason: no cost-bearing-inference surface
    technique: unbounded-consumption
  - disposition: not-applicable
    reason: 'no user-facing-generation surface: documents are written and reviewed by people; overclaiming is modelled
      under STRIDE as threat.overclaimed-enforcement'
    technique: misinformation
  - disposition: not-applicable
    reason: no system-prompt surface
    technique: hidden-context-exposure
  - disposition: not-applicable
    reason: no retrieval-path surface
    technique: vector-embedding-weakness
  - disposition: not-applicable
    reason: no model-output surface
    technique: improper-output-handling
  - disposition: not-applicable
    reason: no inference-endpoint surface
    technique: model-extraction
  - disposition: not-applicable
    reason: no agent surface in this feature
    technique: goal-hijack
  - disposition: not-applicable
    reason: no agent tool surface
    technique: tool-misuse
  - disposition: not-applicable
    reason: no agent identity surface
    technique: identity-privilege-abuse
  - disposition: not-applicable
    reason: no agent plugin or MCP surface
    technique: agentic-supply-chain
  - disposition: not-applicable
    reason: no agent code-execution surface; the gate runs no catalog content
    technique: unexpected-code-execution
  - disposition: not-applicable
    reason: no agent memory surface
    technique: memory-context-poisoning
  - disposition: not-applicable
    reason: no multi-agent surface
    technique: insecure-inter-agent-communication
  - disposition: not-applicable
    reason: no agent pipeline surface
    technique: cascading-failure
  - disposition: not-applicable
    reason: no agent-to-human surface
    technique: human-agent-trust-exploitation
  - disposition: not-applicable
    reason: no agent surface
    technique: rogue-agent
  exclusions:
  - entity: Escape class
    reason: folded into asset.escape-catalog; a class is a row of the catalog, not a separate store
  extends: null
  generated: '2026-11-01T17:26:06Z'
  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: plan.md
    sha256: 12e8a19a19296d8d8ceaa11e30a28f1de3029acc41c41c9a5f80227087f7dbfb
  - path: spec.md
    sha256: 3de88fd9d03dfba0cefe20abba1e94952b35595743983c37501f96eb482deb50
  surfaces:
