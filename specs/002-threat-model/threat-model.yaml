    crosses: []
- id: flow.catalog-to-gate
  name: The gate reads the catalog
  source: component.threat-model-doc
  destination: component.catalog-gate
  assets:
  - asset.escape-catalog
  - asset.published-id-baseline
  - asset.evidence-reference
  attributes:
    crosses:
    - tz.ci
  README and crate docs: null
- id: flow.contributor-to-catalog
  name: A pull request changes catalog rows or statuses
  source: actor.contributor
  destination: component.threat-model-doc
