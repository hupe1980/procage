  categories:
  - Spoofing
  risk:
    impact: 80
    likelihood: 40
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.threat-model-doc
    status: mitigated
    actor: actor.contributor
    constitution: VI. Private interfaces, honestly (public docs state dependencies, threat model and non-goals)
    disposition: threat
    elements:
