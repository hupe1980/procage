mitigations:
- id: mitigation.macos-path-filters
  name: macOS allows the network operations only with subpath filters on the socket paths, and denies them under
    hidden paths
  riskReduction: 85
  attributes:
    threats:
    - threat.daemon-socket-reached
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
- id: mitigation.named-acceptance
  name: Every snapshot approximation needs accept_spawn_snapshot (pinned set), errors name the construct and the
    option, degradations list them
  riskReduction: 80
  attributes:
    threats:
    - threat.silent-approximation
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - crates/procage-policy/src/lower/mod.rs
- id: mitigation.safe-siblings
  name: Piecewise grants skip symbolic links and everything under a hidden path; a write rule around a hidden path
    is refused at lowering, a write grant around one at spawn
  riskReduction: 85
  attributes:
    threats:
    - threat.sibling-leak
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - src/linux/spawn.rs
    - crates/procage-policy/src/lower/linux.rs
- id: mitigation.socket-masks
  name: T1 allows only AF_UNIX, keeps abstract sockets in the cage's network namespace (plus the Landlock abstract
    scope where available), and masks every listening socket outside the paths at spawn; T2 refuses
  riskReduction: 80
  attributes:
    threats:
    - threat.daemon-socket-reached
    - threat.abstract-socket-reached
    status: verified
    kind: preventive
    requirements:
    - SR-001
    - SR-002
    touchpoints:
    - crates/procage-policy/src/lower/linux.rs
    - src/linux/spawn.rs
    - src/linux/mod.rs
requirements:
- id: SR-001
  statement: With ipc.unix_sockets covering the workspace and no network, a caged child MUST bind and connect to
    a socket in the workspace and MUST NOT connect to a listening socket outside it, nor open a TCP connection,
    on macOS and Linux T1.
  priority: P1
  mitigations:
  - mitigation.socket-masks
  - mitigation.macos-path-filters
  acceptance:
  - given: a daemon socket outside and ipc.unix_sockets on the workspace
    then: inside works, the daemon and TCP fail
    when: the child binds and connects inside, connects to the daemon and opens TCP
  tasks: []
- id: SR-002
  statement: On Linux the child MUST NOT reach a host abstract socket under ipc.unix_sockets, and T2 below ABI 9
    MUST refuse the setting.
  priority: P1
  mitigations:
  - mitigation.socket-masks
  acceptance:
  - given: a host abstract socket and T1 with ipc.unix_sockets
    then: it fails
    when: the child connects to it
  - given: T2
    then: it is refused naming ipc-unix-sockets
    when: the policy is prepared
  tasks: []
- id: SR-003
  statement: On T2 a hidden path's contents MUST stay unreadable with piecewise grants - also through a symbolic
    link sibling - and a write rule or write grant around a hidden path MUST be refused.
  priority: P1
  mitigations:
  - mitigation.safe-siblings
  acceptance:
  - given: T2, read on a tree, hide on a subdirectory and a symlink sibling pointing into it
    then: both fail and a sibling file reads
    when: the child reads the hidden file directly and through the link
  - given: a write rule on the tree, or a write grant bound around the hidden path
    then: it is refused naming the construct or the grant and the hidden path
    when: preparing or spawning
  tasks: []
- id: SR-004
  statement: accept_spawn_snapshot MUST accept exactly the data-driven classes, fs-hide and ipc-unix-sockets; without
    it these approximations MUST be refused with an error naming the construct and the option.
  priority: P2
  mitigations:
  - mitigation.named-acceptance
  acceptance:
  - given: each snapshot approximation
    then: refused naming the option, then accepted and listed in degradations
    when: lowered without and with the option
  tasks: []
verification:
- id: verification.sr-001.2026-10-31
  requirement: SR-001
  method: test
  evidence: tests/escape_macos.rs::r09_unix_sockets_reach_only_their_paths, tests/escape_linux.rs::r09_unix_sockets_reach_only_their_paths
  result: pass
  verdict: verified
  justification: With ipc.unix_sockets on the workspace and no network, the caged child binds, listens and connects
    in the workspace, while connecting to a daemon socket outside and opening TCP fail, on macOS (EPERM) and Linux
    T1 (masked daemon ECONNREFUSED, TCP EPERM).
  verified_at: '2026-10-31T19:33:45Z'
  commit: 95a407d
- id: verification.sr-002.2026-10-31
  requirement: SR-002
  method: test
  evidence: tests/escape_linux.rs::r09_unix_sockets_reach_only_their_paths, crates/procage-policy/tests/gaps.rs::unix_sockets_by_tier_and_abi
  result: pass
  verdict: verified
  justification: On T1 the host abstract socket gives ECONNREFUSED (separate network namespace); on T2 below ABI
    9 the setting is refused naming ipc-unix-sockets, in the canary and in the lowering test.
  verified_at: '2026-10-31T19:33:45Z'
  commit: 95a407d
- id: verification.sr-003.2026-10-31
  requirement: SR-003
  method: test
  evidence: tests/spawn_linux.rs::t2_hide_is_piecewise, tests/spawn_linux.rs::t2_hide_inside_a_writable_tree_is_refused,
    tests/spawn_linux.rs::t2_a_write_grant_around_a_hidden_path_fails_the_spawn, tests/spawn_linux.rs::t2_reading_everything_except_secrets
  result: pass
  verdict: verified
  justification: On T2 the hidden file is unreadable directly and through a symbolic-link sibling and a listing
    is denied while a sibling reads; an entry created after the spawn is denied; a write rule around is refused
    at preparation and a write grant around fails the spawn naming both; the secrets class keeps a home's .ssh unreadable
    while reading /. The negative control shows the test fails without the expansion.
  verified_at: '2026-10-31T19:33:45Z'
  commit: 95a407d
- id: verification.sr-004.2026-10-31
  requirement: SR-004
  method: test
  evidence: crates/procage-policy/tests/gaps.rs::reading_everything_needs_exactly_the_spawn_snapshot, tests/spawn_linux.rs::t2_hide_is_piecewise
  result: pass
  verdict: verified
  justification: accept_spawn_snapshot holds exactly the five SPAWN_SNAPSHOT constructs; without it the secrets
    and fs-hide approximations are refused with a message naming the option; with it they lower and appear in the
    degradations; a glob rule stays refused.
  verified_at: '2026-10-31T19:33:45Z'
  commit: 95a407d
decisions: []
