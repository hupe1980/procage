mitigations:
- id: mitigation.no-dirhelper
  name: V2 omits dirhelper and membership; a caged test checks that the per-user temporary directory resolves to
    the private TMPDIR
  riskReduction: 90
  attributes:
    threats:
    - threat.shared-temp-poisoning
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-policy/src/base.rs
    - tests/spawn_macos.rs
- id: mitigation.personal-checks
  name: V2 additions are code, system data and two named personal entries; caged tests check home listing, home
    preferences, Homebrew etc, writes and network stay refused
  riskReduction: 80
