    threats:
    - threat.personal-data-in-base
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage-policy/src/base.rs
    - tests/spawn_macos.rs
- id: mitigation.pins
  name: V1, V2 and the presets' profiles are pinned; every base rule carries a filter
  riskReduction: 85
  attributes:
    threats:
    - threat.unfiltered-rule
    - threat.frozen-drift
    status: verified
    kind: detective
    requirements:
    - SR-003
    touchpoints:
    - crates/procage-policy/tests/base.rs
    - crates/procage-policy/tests/presets.rs
requirements:
- id: SR-001
  statement: Under base V2 the child's per-user temporary directory MUST resolve to its private TMPDIR, and V2 MUST
    NOT allow com.apple.bsd.dirhelper or com.apple.system.opendirectoryd.membership.
  priority: P1
  mitigations:
  - mitigation.no-dirhelper
  acceptance:
  - given: base V2 with the tmpdir grant
    then: both are inside its private TMPDIR
    when: the child asks getconf DARWIN_USER_TEMP_DIR and runs mktemp
  tasks: []
- id: SR-002
  statement: Base V2 MUST NOT let the child list the home directory, read home preferences or ~/.ssh, read Homebrew
    etc files other than OpenSSL's configuration, write system or Homebrew locations, or reach the network.
  priority: P1
  mitigations:
  - mitigation.personal-checks
  acceptance:
  - given: base V2
    then: each fails
    when: the child tries each of these
  tasks: []
- id: SR-003
  statement: V1, V2 and every preset's profile MUST be pinned, and every base rule MUST carry at least one filter
    except V1's sysctl-read.
  priority: P1
  mitigations:
  - mitigation.pins
  acceptance:
  - given: the policy crate tests
    then: the pinned contents match and no base rule is unfiltered
    when: they run
  tasks: []
verification:
- id: verification.sr-001.2026-10-31
  requirement: SR-001
  method: test
  evidence: tests/spawn_macos.rs::base_v2_runs_developer_tools, crates/procage-policy/tests/base.rs::v2_adds_no_service
  result: pass
  verdict: verified
  justification: Under base V2 with the tmpdir grant, getconf DARWIN_USER_TEMP_DIR and mktemp both land in the child's
    private TMPDIR (the caged test prints "private"); the policy test asserts V2's mach-lookup rules equal V1's
    and name neither dirhelper nor membership.
  verified_at: '2026-10-31T20:17:57Z'
  commit: 407f2e0
- id: verification.sr-002.2026-10-31
  requirement: SR-002
  method: test
  evidence: tests/spawn_macos.rs::base_v2_grants_nothing_personal
  result: pass
  verdict: verified
  justification: Under base V2 the child cannot list the home, read ~/Library/Preferences or ~/.ssh, read a Homebrew
    etc file that is not OpenSSL's, write /opt/homebrew or /usr/local, or connect to a loopback port; stat of $HOME
    succeeds as documented.
  verified_at: '2026-10-31T20:17:57Z'
  commit: 407f2e0
- id: verification.sr-003.2026-10-31
  requirement: SR-003
  method: test
  evidence: crates/procage-policy/tests/base.rs::macos_v2_is_v1_plus_its_pinned_additions, crates/procage-policy/tests/base.rs::every_base_rule_has_a_filter,
    crates/procage-policy/tests/presets.rs::every_v2_preset_is_pinned, crates/procage-policy/tests/presets.rs::every_preset_is_pinned
  result: pass
  verdict: verified
  justification: V1's rendered allows are pinned and unchanged; V2 is V1 plus three pinned rules; every base rule
    except V1's sysctl-read carries a filter (rendered and structural check); the v1 and v2 preset profiles are
    pinned fixtures.
  verified_at: '2026-10-31T20:17:57Z'
  commit: 407f2e0
