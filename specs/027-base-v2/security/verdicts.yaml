verdicts:
  - requirement: SR-001
    verdict: verified
    method: test
    evidence: tests/spawn_macos.rs::base_v2_runs_developer_tools, crates/procage-policy/tests/base.rs::v2_adds_no_service
    result: pass
    justification: Under base V2 with the tmpdir grant, getconf DARWIN_USER_TEMP_DIR and mktemp both land in the child's private TMPDIR (the caged test prints "private"); the policy test asserts V2's mach-lookup rules equal V1's and name neither dirhelper nor membership.
  - requirement: SR-002
    verdict: verified
    method: test
    evidence: tests/spawn_macos.rs::base_v2_grants_nothing_personal
    result: pass
    justification: Under base V2 the child cannot list the home, read ~/Library/Preferences or ~/.ssh, read a Homebrew etc file that is not OpenSSL's, write /opt/homebrew or /usr/local, or connect to a loopback port; stat of $HOME succeeds as documented.
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: crates/procage-policy/tests/base.rs::macos_v2_is_v1_plus_its_pinned_additions, crates/procage-policy/tests/base.rs::every_base_rule_has_a_filter, crates/procage-policy/tests/presets.rs::every_v2_preset_is_pinned, crates/procage-policy/tests/presets.rs::every_preset_is_pinned
    result: pass
    justification: V1's rendered allows are pinned and unchanged; V2 is V1 plus three pinned rules; every base rule except V1's sysctl-read carries a filter (rendered and structural check); the v1 and v2 preset profiles are pinned fixtures.
