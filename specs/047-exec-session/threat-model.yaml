mitigations:
- id: mitigation.checked-first
  name: Group leaders without a session refused before the process changes; pids 0 and 1 ignored; end_session called
    before reaping
  riskReduction: 80
  attributes:
    threats:
    - threat.half-applied-exec
    - threat.wrong-session-killed
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - crates/procage/src/linux/mod.rs
    - crates/procage/src/macos/mod.rs
- id: mitigation.exec-session-boundary
  name: The command leads its own session; setsid refused on Linux; end_session kills the session and group, repeated
    for members forked meanwhile
  riskReduction: 90
  attributes:
    threats:
    - threat.grouped-descendant-outlives-exec
    - threat.session-escape-exec
    status: verified
    kind: preventive
    requirements:
    - SR-001
    - SR-002
    touchpoints:
    - crates/procage/src/linux/mod.rs
    - crates/procage/src/linux/child.rs
    - crates/procage/src/macos/mod.rs
    - crates/procage/tests/exec.rs
requirements:
- id: SR-001
  statement: A command run with exec_session MUST lead its own session; on Linux its descendants MUST be able to
    start process groups and MUST NOT start sessions.
  priority: P1
  mitigations:
  - mitigation.exec-session-boundary
  acceptance:
  - given: a plain-child helper calling exec_session
    then: setpgid succeeds; on Linux setsid fails
    when: a descendant calls setpgid(0, 0) and setsid
  tasks: []
- id: SR-002
  statement: end_session of the helper pid MUST kill every live process of its session, including one in a process
    group of its own.
  priority: P1
  mitigations:
  - mitigation.exec-session-boundary
  acceptance:
  - given: a descendant in its own process group
    then: it dies within two seconds on macOS, T1 and T2
    when: the owner calls end_session with the helper pid
  tasks: []
- id: SR-003
  statement: exec_session in a process group leader that leads no session MUST fail before the process changes;
    end_session MUST ignore pids 0 and 1.
  priority: P1
  mitigations:
  - mitigation.checked-first
  acceptance:
  - given: a helper started with process_group(0)
    then: it fails with SpawnError::GroupLeader and the command never runs
    when: it calls exec_session
  tasks: []
verification:
- id: verification.sr-001.2026-11-02
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/exec.rs::a_session_exec_allows_groups_and_ends_by_session
  result: pass
  verdict: verified
  justification: A helper started as a plain child calls Cage::exec_session of a shell; a descendant's perl setpgrp(0,
    0) exits 0 on macOS, T1 and T2, and on Linux /usr/bin/setsid exits 1. Passed in both container lanes (Linux
    7.0) and on macOS 26, 2026-11-02.
