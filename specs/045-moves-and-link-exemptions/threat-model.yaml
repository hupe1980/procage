requirements:
- id: SR-001
  statement: 'A move between directories MUST NOT take a protected target out from under its protection or replace
    it: on T1 it stays unwritable under every name and a rename onto it fails; on T2 protect stays a refused gap.'
  priority: P1
  mitigations:
  - mitigation.refer-with-write-only
  acceptance:
  - given: T1 with ws/sub/p protected
    then: the protected file is unwritable under every name and keeps its content
    when: the child renames ws/sub in place and into another directory
  - given: T1 with the file ws/f protected
    then: the rename fails with EBUSY (EXDEV at ABI 1)
    when: the child renames a file from another directory onto it
  - given: T2
    then: the cage is refused with an fs-protect gap
    when: a policy protects a path
  tasks: []
- id: SR-002
  statement: During a run no hidden or protected file MUST gain a second name in a writable tree.
  priority: P1
  mitigations:
  - mitigation.refer-with-write-only
  acceptance:
  - given: a hidden file and a protected one (on T2 a file of a read-only tree)
    then: both links fail on every tier
    when: the child links either into the writable tree
  tasks: []
- id: SR-003
  statement: REFER MUST be granted only with write; a move or link that would give a file a right it lacks, or take
    it out of a read-only tree, MUST be refused, while moves between writable directories MUST work from ABI 2.
  priority: P1
  mitigations:
  - mitigation.refer-with-write-only
  acceptance:
  - given: the rights of every access kind
    then: only write at ABI 2 or later includes REFER
    when: computed at ABI 1, 2 and 12
  - given: ws writable with ws/bin executable and a read-only tree
    then: each is refused, while moves and links between ws directories and from TMPDIR succeed (EXDEV at ABI 1)
    when: the child moves a file into ws/bin, or moves or links one out of the read-only tree
  tasks: []
- id: SR-004
  statement: A link exemption MUST skip only the named subtrees, and only for protected files; a second name of
    any other protected file MUST still refuse the spawn, and the run audit MUST list the exemptions.
  priority: P1
  mitigations:
  - mitigation.exemption-scoped
  acceptance:
  - given: a clone with hard-linked objects and .git protected
    then: the first is refused naming the object; the second runs and its audit lists the exemption
    when: spawning without and then with .git/objects exempt
  - given: the exemption and a second name for .git/config
    then: the spawn is refused naming the config
    when: spawning
  tasks: []
- id: SR-005
  statement: Hidden files MUST be examined inside exempt subtrees.
  priority: P1
  mitigations:
  - mitigation.exemption-scoped
  acceptance:
  - given: a hidden tree containing an exempt subtree with a two-name file
    then: the file is a finding
    when: the link check runs
  tasks: []
- id: SR-006
  statement: A relative link exemption MUST fail the cage.
  priority: P2
  mitigations:
  - mitigation.exemption-scoped
  acceptance:
  - given: CageOptions with a relative exemption
    then: it fails with Unsupported::Setting
    when: the cage is built
  tasks: []
verification:
- id: verification.sr-001.2026-11-02
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/escape_linux.rs::r04_a_protected_file_stays_protected_when_an_ancestor_is_renamed
  result: pass
  verdict: verified
  justification: On T1 renames the protected tree's ancestor in place and into another directory and asserts the
    protected file is unwritable under all three names and keeps its content; on T2 asserts the fs-protect gap.
    r30_a_protected_file_cannot_be_replaced asserts a rename from another directory onto the protected file fails
    with EBUSY (EXDEV at ABI 1). Both passed in the T1 and T2 container lanes (kernel 7.0, ABI 8), 2026-11-02.
