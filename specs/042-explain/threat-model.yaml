threats:
- id: threat.answer-reveals-rules
  name: A harness relays answers into the cage, and a deciding rule's pattern wider than the path asked tells caged
    code which hidden or protected paths exist
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    impact: 40
    likelihood: 30
  attributes:
    source: spec.md#US1
    assets:
    - asset.answer
    - asset.host
    status: open
    actor: actor.caged-code
    elements:
    - flow.answer
    - component.docs
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.canonicalisation-owner
  name: '[NEEDS CLARIFICATION: the portable evaluator cannot read the file system; which layer resolves a symlinked
    component that is not a known alias, and what does the policy crate alone refuse?]'
  categories:
  - Tampering
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.answer
    status: open
    actor: actor.consumer
    disposition: needs-clarification
    elements:
    - component.query
    profile: stride
    severity: unrated
    technique: injection
- id: threat.diff-hides-loosening
  name: diff misses a newly allowed operation (an overlapping subpath or glob, a waiver, a base or preset version
    change, network, process or signal rules), so a reviewer approves a loosening
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-697
  risk:
    impact: 90
    likelihood: 40
  attributes:
    source: spec.md#US2
    assets:
    - asset.diff
    - asset.host
    status: open
    actor: actor.policy-author
    constitution: VII. A library, not a harness (loosening a frozen preset is a breaking change)
    elements:
    - component.diff
    - flow.policies
    - flow.diff
    profile: stride
    severity: high
    technique: privilege-escalation-via-config
- id: threat.evaluator-exhaustion
  name: A crafted policy or question (deep globs, many overlapping rules, a very long path) makes explain or diff
    run unbounded in the harness
  categories:
  - Denial of Service
  cwes:
  - CWE-400
  - CWE-1333
  risk:
    impact: 40
    likelihood: 30
  attributes:
    source: spec.md#SC-003
    assets:
    - asset.harness
    status: open
    actor: actor.policy-author
    elements:
    - component.evaluator
    - component.diff
    profile: stride
    severity: low
    technique: resource-exhaustion
- id: threat.false-denied
  name: explain answers denied, protected or hidden for an operation the kernel allows (a T1 path created after
    spawn, a grant left out, an undocumented Seatbelt or Landlock rule), so the user trusts a protection that does
    not hold
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-697
  risk:
    impact: 85
    likelihood: 40
  attributes:
    source: spec.md#Edge-Cases
    assets:
    - asset.host
    - asset.answer
    status: open
    actor: actor.consumer
    constitution: III. The kernel is the oracle
    elements:
    - component.evaluator
    - flow.answer
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.misleading-remedy
  name: explain names an allow the kernel does not honour, the wrong deciding rule, or a remedy wider than the question
    (a subpath over the home directory, a waiver), so the user weakens the policy more than needed
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-732
  risk:
    impact: 70
    likelihood: 45
  attributes:
    source: spec.md#US1
    assets:
    - asset.host
    - asset.answer
    status: open
    actor: actor.consumer
    elements:
    - component.evaluator
    - flow.answer
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.non-canonical-query
  name: A question path spelled through an alias, firmlink, symlink or dot component, or carrying pattern characters
    from a child-controlled violation path, is answered as if canonical and literal, so the answer is about a different
    file (R-02, R-03, R-12)
  categories:
  - Tampering
  cwes:
  - CWE-41
  - CWE-155
  risk:
    impact: 75
    likelihood: 40
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.answer
    - asset.host
    status: open
    actor: actor.caged-code
    elements:
    - component.query
    - flow.violation-question
    profile: stride
    severity: high
    technique: injection
- id: threat.oracle-overclaim
  name: The oracle or the docs claim proof the oracle does not give (sandbox_check used for an unproven operation,
