  name: The caged child and its descendants
  risk:
    trustRating: 5
- id: tz.harness
  name: The harness process, and the CI lanes that run the oracle
  risk:
    trustRating: 90
- id: tz.kernel
  name: The enforcing kernel (Seatbelt and sandbox_check on macOS; Landlock and seccomp on Linux)
  risk:
    trustRating: 95
- id: tz.repo
  name: Where policies and frozen presets are stored and reviewed
  risk:
    trustRating: 60
assets:
