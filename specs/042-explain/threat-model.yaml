  statement: An operation outside the modelled set MUST return not modelled, never allowed, denied or a default.
  priority: P2
  mitigations:
  - mitigation.closed-operations
  acceptance:
  - given: each operation kind the kernel knows and explain does not model
    then: the answer is not modelled
    when: it is explained under every preset
  tasks: []
- id: SR-008
  statement: For two policies and the targets given, every question whose explain answers differ on a target MUST
    be covered by a diff entry for that target naming its direction; changes to waivers, the base, the preset version,
    network, process and signal rules MUST appear; every other plan field that differs MUST be listed as a changed
    setting, never as unchanged.
  priority: P1
  mitigations:
  - mitigation.sound-diff
  acceptance:
  - given: generated policy pairs and generated questions
    then: a diff entry covers that question with the right direction
    when: explain disagrees between the two for a question
  - given: a policy and the same policy with one more writable path, or one more waiver
    then: the diff names that path and its operations only, or that class and its operations only
    when: they are diffed
  - given: every frozen preset pair vN and vN+1
    then: every entry comes from the base and the base setting is listed, as the changelog says
    when: diffed on every target
  - given: a change only Linux expresses (a Linux layer rule)
    then: every entry is tagged with the Linux target
    when: diffed for macOS and Linux
  tasks: []
- id: SR-009
  statement: explain MUST run in time linear in the plan size and path length and under 1 ms per question in release
    on the reference machine; diff MUST run in O(n log n) in the plans' rules, with no pattern intersection.
  priority: P3
  mitigations:
  - mitigation.bounded-evaluation
  acceptance:
