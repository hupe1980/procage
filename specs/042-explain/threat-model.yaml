- id: threat.single-target-diff
  name: '[NEEDS CLARIFICATION: diff is per target; how does a reviewer see a change that loosens only one target
    or one Linux tier?]'
  categories:
  - Elevation of Privilege
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.diff
    status: open
    actor: actor.reviewer
    disposition: needs-clarification
    elements:
    - component.diff
    profile: stride
    severity: unrated
    technique: privilege-escalation-via-config
- id: threat.unmodelled-guess
  name: An operation explain does not model falls through to the default or the base and comes back as denied or
    allowed instead of not modelled
  categories:
  - Repudiation
  cwes:
  - CWE-1023
  risk:
    impact: 60
    likelihood: 35
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.answer
    status: open
    actor: actor.contributor
    elements:
    - component.evaluator
    profile: stride
    severity: medium
    technique: missing-audit-trail
mitigations:
- id: mitigation.bounded-evaluation
  name: explain is linear in the plan; diff has a documented bound and refuses beyond it
  riskReduction: 80
  attributes:
    threats:
    - threat.evaluator-exhaustion
    status: required
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - component.evaluator
    - component.diff
- id: mitigation.canonical-question
  name: Questions take a canonical-path type; lexical and known-alias spellings are refused naming the canonical
    form; pattern characters stay literal
  riskReduction: 80
  attributes:
    threats:
    - threat.non-canonical-query
    status: required
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - component.query
- id: mitigation.closed-operations
  name: A closed set of modelled operations; anything else answers not modelled
  riskReduction: 85
  attributes:
    threats:
    - threat.unmodelled-guess
    status: required
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - component.evaluator
- id: mitigation.differential-oracle
  name: Generated questions per preset, target and rule kind, asked of the kernel on every lane; any disagreement
    or unresolved outcome fails and names the question; no skip
  riskReduction: 85
  attributes:
    threats:
    - threat.false-denied
    - threat.oracle-overclaim
    - threat.misleading-remedy
    status: required
    kind: detective
    requirements:
    - SR-001
    - SR-002
    touchpoints:
    - component.oracle
    - component.evaluator
- id: mitigation.full-question
  name: Questions carry the target, tier and grants; T1 answers outside the spawn-time covers say covered at spawn
    with the limits
  riskReduction: 75
  attributes:
    threats:
    - threat.false-denied
    status: required
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - component.query
    - component.evaluator
- id: mitigation.minimal-remedy
  name: The suggested change is the narrowest that flips the question, checked by applying it and diffing
  riskReduction: 75
  attributes:
    threats:
    - threat.misleading-remedy
    status: required
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - component.evaluator
    - component.diff
- id: mitigation.proven-list
  name: The docs' list of proven operations is checked against the oracle suite; nothing else is called proven
  riskReduction: 70
  attributes:
    threats:
    - threat.oracle-overclaim
    status: required
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - component.docs
    - component.oracle
- id: mitigation.relay-guidance
  name: The docs say an answer names the deciding rule and is for the user, not to be relayed into the cage unfiltered
  riskReduction: 50
  attributes:
    threats:
    - threat.answer-reveals-rules
    status: required
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - component.docs
- id: mitigation.sound-diff
  name: diff is checked against explain on generated policy pairs, covers every rule dimension, and lists what it
    does not compare
  riskReduction: 85
  attributes:
    threats:
    - threat.diff-hides-loosening
    status: required
    kind: detective
    requirements:
    - SR-008
    touchpoints:
    - component.diff
    - component.evaluator
requirements:
- id: SR-001
  statement: On every CI lane, a differential oracle MUST ask the kernel at least 1,000 generated questions per
    preset and target, reaching every rule kind (allow, protect, hide, hard-deny class, base, default, grant, T1
    cover), for every operation listed as proven, and MUST fail naming the question on any disagreement; a lane
    that cannot confine its children MUST fail, never skip.
  priority: P1
  mitigations:
  - mitigation.differential-oracle
  acceptance:
  - given: the oracle suite on each lane
    then: every rule kind is reached, at least 1,000 questions per preset and target are asked, and all agree
    when: it runs
  - given: an evaluator mutated to flip the decision of one rule kind
    then: it fails and names a question of that kind
    when: the oracle runs
  - given: a lane that is itself sandboxed
    then: it fails with AlreadySandboxed
    when: the oracle starts
  tasks: []
- id: SR-002
  statement: The oracle MUST classify a kernel outcome as allowed, denied or unresolved (absent file, other error),
    MUST fail on an unresolved question rather than count it as agreement, and MUST use sandbox_check only for operations
    a kernel fact proves reliable.
  priority: P1
  mitigations:
  - mitigation.differential-oracle
  acceptance:
  - given: a question about a file that does not exist
    then: the question is unresolved and the suite fails unless the generator creates the file first
    when: the caged child observes ENOENT
  - given: an operation without a kernel fact for sandbox_check
    then: it uses a caged child's observed result
    when: the oracle checks it
  tasks: []
- id: SR-003
  statement: The docs MUST list, per target, exactly the operations the oracle suite proves, and MUST NOT call any
    other answer proven.
  priority: P1
  mitigations:
  - mitigation.proven-list
  acceptance:
  - given: the docs list and the oracle suite's covered operations
    then: they are equal per target
    when: a test compares them
  tasks: []
- id: SR-004
  statement: A question MUST carry the target, the Linux tier and the per-spawn grants; on Linux T1 a path outside
    the spawn-time covers MUST answer covered at spawn with the cover's limits, never a plain denied.
  priority: P1
  mitigations:
  - mitigation.full-question
  acceptance:
  - given: a protected directory on T1 and a file created in it after spawn
    then: the answer says covered at spawn and names the limit, and the oracle agrees with the kernel's observed
      result
    when: a write to it is explained
  - given: a path outside the policy and a grant for it
    then: it is allowed by the grant with it and denied by the deciding rule without it, as the kernel observes
    when: it is explained with and without the grant
  tasks: []
- id: SR-005
  statement: What would change an answer MUST be the narrowest change that flips that question (a literal rule or
    grant for the path asked, a waiver by class only when a hard-deny class decides), and MUST name every other
    question it also flips.
  priority: P1
  mitigations:
  - mitigation.minimal-remedy
  acceptance:
  - given: every generated denied question of a preset
    then: the question flips and the diff lists only the path asked, or exactly the questions the suggestion names
    when: its suggested change is applied and the old and new policies are diffed
  - given: a write to .git/hooks/x
    then: the answer is denied by hard deny trust-handoff and names that waiver, and no subpath grant
    when: explained
  tasks: []
- id: SR-006
  statement: explain MUST accept only a canonical absolute path; a relative path, dot or dot-dot components, repeated
    separators, a trailing separator and a known alias or firmlink spelling MUST return an error naming the canonical
    form; pattern characters in a question path MUST stay literal.
  priority: P1
  mitigations:
  - mitigation.canonical-question
  acceptance:
  - given: /etc/hosts on macOS and /a/../b
    then: each is an error naming /private/etc/hosts and /b
    when: they are explained
  - given: a path containing * and [ under a protect rule for a sibling
    then: the answer is about that literal path only, and the oracle agrees
    when: it is explained
  tasks: []
- id: SR-007
  statement: An operation outside the modelled set MUST return not modelled, never allowed, denied or a default.
  priority: P2
  mitigations:
  - mitigation.closed-operations
  acceptance:
  - given: each operation kind the kernel knows and explain does not model
    then: the answer is not modelled
    when: it is explained under every preset
  tasks: []
- id: SR-008
  statement: For two policies on one target, every question whose explain answers differ MUST be covered by a diff
    entry naming its direction; changes to waivers, the base, the preset version, network, process and signal rules
    MUST appear; anything diff does not compare MUST be listed as not compared, never as unchanged.
  priority: P1
  mitigations:
  - mitigation.sound-diff
  acceptance:
  - given: generated policy pairs and generated questions
    then: a diff entry covers that question with the right direction
    when: explain disagrees between the two for a question
  - given: a policy and the same policy with one more writable path, or one more waiver
    then: the diff names that path and its operations only, or that class and its operations only
    when: they are diffed
  - given: every frozen preset pair vN and vN+1
    then: the result matches the changelog entry of that version
    when: diffed
  tasks: []
