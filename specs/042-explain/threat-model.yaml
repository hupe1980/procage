  type: document
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-006
- id: component.evaluator
  name: explain over a lowered plan (policy crate, no_std)
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-001
- id: component.oracle
  name: Differential oracle suite (sandbox_check for proven operations, caged children otherwise)
  type: service
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-004
- id: component.query
  name: Question construction and the canonical-path check
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#Clarifications
dataflows:
- id: flow.answer
  name: The answer reaches the user, who may change the policy
  source: component.evaluator
  destination: actor.consumer
  assets:
  - asset.answer
  - asset.host
  attributes:
    crosses: []
- id: flow.claims
  name: The docs tell the user which answers are proven
  source: component.docs
  destination: actor.consumer
  assets:
  - asset.answer
  attributes:
    crosses: []
- id: flow.compare
  name: The oracle compares the evaluator's answers with the kernel's
  source: component.evaluator
  destination: component.oracle
  assets:
  - asset.answer
  attributes:
    crosses: []
- id: flow.diff
  name: The diff reaches the reviewer
  source: component.diff
  destination: actor.reviewer
  assets:
  - asset.diff
  - asset.host
  attributes:
    crosses: []
- id: flow.kernel-answer
  name: The kernel answers the same questions (sandbox_check or a caged child's observed result)
  source: tz.kernel
  destination: component.oracle
  assets:
  - asset.answer
  attributes:
    crosses:
    - tz.kernel
    - tz.harness
- id: flow.policies
  name: Two stored policies or preset versions reach the diff
  source: tz.repo
  destination: component.diff
  assets:
  - asset.diff
  attributes:
    crosses:
    - tz.repo
    - tz.harness
- id: flow.question
  name: A checked question reaches the evaluator with the target and grants
  source: component.query
  destination: component.evaluator
  assets:
  - asset.answer
  attributes:
    crosses: []
- id: flow.violation-question
  name: A denied operation of the caged code becomes a question
  source: tz.cage
  destination: component.query
  assets:
  - asset.answer
  attributes:
    crosses:
    - tz.cage
    - tz.harness
threats:
- id: threat.answer-reveals-rules
  name: A harness relays answers into the cage, and a deciding rule's pattern wider than the path asked tells caged
    code which hidden or protected paths exist
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    impact: 40
    likelihood: 30
  attributes:
    source: spec.md#US1
    assets:
    - asset.answer
    - asset.host
    status: mitigated
    actor: actor.caged-code
    elements:
    - flow.answer
    - component.docs
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.canonicalisation-owner
  name: '[NEEDS CLARIFICATION: the portable evaluator cannot read the file system; which layer resolves a symlinked
    component that is not a known alias, and what does the policy crate alone refuse?]'
  categories:
  - Tampering
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.answer
    status: retired
    actor: actor.consumer
    disposition: needs-clarification
    elements:
    - component.query
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: injection
- id: threat.diff-hides-loosening
  name: diff misses a newly allowed operation (an overlapping subpath or glob, a waiver, a base or preset version
    change, network, process or signal rules, or a change on only one target or tier), so a reviewer approves a
    loosening
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-697
  risk:
    impact: 90
    likelihood: 40
  attributes:
    source: spec.md#US2
    assets:
    - asset.diff
    - asset.host
    status: mitigated
    actor: actor.policy-author
    constitution: VII. A library, not a harness (loosening a frozen preset is a breaking change)
    elements:
    - component.diff
    - flow.policies
    - flow.diff
    profile: stride
    severity: high
    technique: privilege-escalation-via-config
- id: threat.evaluator-exhaustion
  name: A crafted policy or question (deep globs, many overlapping rules, a very long path) makes explain or diff
    run unbounded in the harness
