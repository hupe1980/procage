mitigations:
- id: mitigation.bounded-evaluation
  name: explain matches regexes with a linear-time NFA; diff compares rule lists by sorting, with no pattern pairs
  riskReduction: 80
  attributes:
    threats:
    - threat.evaluator-exhaustion
    status: verified
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - crates/procage-policy/src/explain/regex.rs
    - crates/procage-policy/src/explain/diff.rs
- id: mitigation.canonical-question
  name: Cage::explain resolves the path on the host; the policy crate refuses lexical and macOS alias spellings
    naming the canonical form; question paths are bytes, never patterns
  riskReduction: 80
  attributes:
    threats:
    - threat.non-canonical-query
    status: verified
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - crates/procage-policy/src/explain/mod.rs
    - crates/procage/src/macos/mod.rs
    - crates/procage/src/linux/mod.rs
- id: mitigation.closed-operations
  name: A closed set of modelled operations; anything else answers not modelled
  riskReduction: 85
  attributes:
    threats:
    - threat.unmodelled-guess
    status: verified
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - crates/procage-policy/src/explain/mod.rs
    - crates/procage-policy/src/explain/macos.rs
- id: mitigation.differential-oracle
  name: Generated questions per preset, target and rule kind, asked of the kernel on every lane; any disagreement
    or unresolved outcome fails and names the question; no skip
  riskReduction: 85
  attributes:
    threats:
    - threat.false-denied
    - threat.oracle-overclaim
    - threat.misleading-remedy
    status: verified
    kind: detective
    requirements:
    - SR-001
    - SR-002
    touchpoints:
    - crates/procage/tests/oracle.rs
- id: mitigation.full-question
  name: Questions carry the target, tier and grants; T1 answers outside the spawn-time covers say covered at spawn
    with the limits
  riskReduction: 75
  attributes:
    threats:
    - threat.false-denied
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - crates/procage-policy/src/explain/linux.rs
    - crates/procage/src/linux/mod.rs
- id: mitigation.minimal-remedy
  name: The remedy is the narrowest change for the deciding rule, verified by re-lowering, and carries its own diff
  riskReduction: 75
  attributes:
    threats:
    - threat.misleading-remedy
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - crates/procage-policy/src/explain/mod.rs
- id: mitigation.proven-list
  name: The docs' list of proven operations is checked against the oracle suite; nothing else is called proven
  riskReduction: 70
  attributes:
    threats:
    - threat.oracle-overclaim
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - site/content/docs/explain.md
    - crates/procage/tests/oracle.rs
- id: mitigation.relay-guidance
  name: The docs say an answer names the deciding rule and is for the user, not to be relayed into the cage unfiltered
  riskReduction: 50
  attributes:
    threats:
    - threat.answer-reveals-rules
    status: verified
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - site/content/docs/explain.md
    - crates/procage-policy/src/explain/mod.rs
- id: mitigation.sound-diff
  name: diff is the rule-list difference for every target given, plus every other differing plan field as a setting,
    checked against explain on generated pairs
  riskReduction: 85
  attributes:
    threats:
    - threat.diff-hides-loosening
    status: verified
    kind: detective
    requirements:
    - SR-008
    touchpoints:
    - crates/procage-policy/src/explain/diff.rs
requirements:
- id: SR-001
  statement: On every CI lane, a differential oracle MUST ask the kernel at least 1,000 generated questions per
    preset and target, reaching every rule kind (allow, protect, hide, hard-deny class, base, default, grant, T1
    cover), for every operation listed as proven, and MUST fail naming the question on any disagreement; a lane
    that cannot confine its children MUST fail, never skip.
  priority: P1
  mitigations:
  - mitigation.differential-oracle
  acceptance:
  - given: the oracle suite on each lane
    then: every rule kind is reached, at least 1,000 questions per preset and target are asked, and all agree
    when: it runs
  - given: an evaluator mutated to flip the decision of one rule kind
    then: it fails and names a question of that kind
    when: the oracle runs
  - given: a lane that is itself sandboxed
    then: it fails with AlreadySandboxed
    when: the oracle starts
  tasks: []
- id: SR-002
  statement: The oracle MUST ask a caged child on every lane and classify its observed result as allowed (success),
    denied (EACCES, EPERM, EROFS) or unresolved (anything else, including ENOENT for a file the generator made),
    and MUST fail on an unresolved question rather than count it as agreement.
  priority: P1
  mitigations:
  - mitigation.differential-oracle
  acceptance:
  - given: a question whose open fails with ENOENT or another unexpected errno
    then: the suite fails naming the question
    when: the oracle compares it
  - given: any lane
    then: it uses a caged child's observed open or execve result, never sandbox_check
    when: the oracle asks the kernel
  tasks: []
- id: SR-003
  statement: explain MUST model exactly the operations the oracle suite proves on every target, and the docs MUST
    list exactly those; no other answer is called proven.
  priority: P1
  mitigations:
  - mitigation.proven-list
  acceptance:
  - given: the modelled operations, the oracle suite's covered operations and the docs list
    then: they are equal on every target
    when: a test compares them
  tasks: []
- id: SR-004
  statement: A question MUST carry the target, the Linux tier, the per-spawn grants and the homes; on Linux an answer
    that holds only for paths existing at spawn (class covers on T1, piecewise hides on T2) MUST say so with the
    limit, never a plain denied.
  priority: P1
  mitigations:
  - mitigation.full-question
  acceptance:
  - given: a trust-handoff name under a writable tree on T1
    then: the answer is denied by that class with the spawn caveat, and the oracle agrees for a file that existed
      at spawn
    when: a write to a file in it is explained
  - given: a path outside the policy and a grant for it
    then: it is allowed by the grant with it and denied by the deciding rule without it, as the kernel observes
    when: it is explained with and without the grant
  tasks: []
- id: SR-005
  statement: A remedy MUST be the narrowest change for the deciding rule (a literal rule of the asked access for
    the path asked, a waiver by class only when a hard-deny class decides, the removal of the deciding protect or
    hide rule), MUST be offered only when re-lowering confirms it flips the question, and MUST carry the diff of
    the change so it names every other question it also flips.
  priority: P1
  mitigations:
  - mitigation.minimal-remedy
  acceptance:
  - given: every generated denied question of a preset
    then: the question flips and the diff equals the remedy's diff
    when: its remedy is applied and the old and new policies are diffed
  - given: a write to .git/hooks/x
    then: the answer is denied by hard deny trust-handoff, the remedy is that waiver, and no subpath rule
    when: explained
  tasks: []
- id: SR-006
  statement: 'explain MUST accept only a canonical absolute path: a relative path, dot or dot-dot components, repeated
    separators, a trailing separator and the macOS alias spellings MUST return an error naming the canonical form;
    Cage::explain MUST resolve symbolic links on the host first; pattern characters in a question path MUST stay
    literal.'
  priority: P1
  mitigations:
  - mitigation.canonical-question
  acceptance:
  - given: /etc/hosts on macOS and /a/../b
    then: each is an error naming /private/etc/hosts and /b
    when: they are explained
  - given: a path containing * and [ under a protect rule for a sibling
    then: the answer is about that literal path only, and the oracle agrees
    when: it is explained
  - given: a symbolic link to a protected file
    then: the answer is about the file it resolves to
    when: Cage::explain is asked about the link
