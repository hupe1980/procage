requirements:
- id: SR-001
  statement: The fact suite MUST fail, never skip or pass, every enforcement fact when the test process is already
    inside a Seatbelt sandbox, and the failure message MUST name the condition and the outside-sandbox command.
  priority: P1
  mitigations:
  - mitigation.outside-sandbox-precheck
  acceptance:
  - given: the suite is started under a Seatbelt profile (e.g. sandbox-exec or an agent harness)
    then: it fails with an already-sandboxed message naming the outside-sandbox command; no enforcement fact reports
      pass or skip
    when: an enforcement fact runs
  tasks: []
- id: SR-002
  statement: Every enforcement fact MUST include a control run of the same action without the restriction that succeeds,
    and MUST match the specific expected errno, exit code or data, never just "the child failed".
  priority: P1
  mitigations:
  - mitigation.positive-controls
  acceptance:
  - given: an enforcement fact whose target file is missing
    then: the control run fails and the fact reports a setup failure, not a pass
    when: the fact runs
  - given: a denied action that fails with an unexpected errno
    then: the fact fails and reports expected and observed errno
    when: the fact runs
  tasks: []
- id: SR-003
  statement: The TIOCSTI probe MUST operate only on a pseudo-terminal pair it creates, after detaching from any
    controlling terminal, and MUST NOT write a newline or command text.
  priority: P1
  mitigations:
  - mitigation.private-pty
  acceptance:
  - given: the maintainer runs the suite in an interactive terminal
    then: no character appears in, or is executed by, the maintainer's terminal; the observation is read back from
      the probe's own pty
    when: the TIOCSTI probe runs
  tasks: []
- id: SR-004
  statement: Facts MUST execute only absolute-path commands with constant arguments, never through a shell or with
    arguments derived from the environment, and any setuid exec MUST be non-interactive and time-bounded.
  priority: P2
  mitigations:
  - mitigation.fixed-argv-no-shell
  acceptance:
  - given: the probe source
    then: no fact execs a shell or builds argv from environment variables
    when: it is reviewed or grepped
  - given: the setuid fact on a host where sudo would prompt
    then: it completes within its timeout without prompting
    when: it runs
  tasks: []
- id: SR-005
  statement: Facts MUST create and touch files only in their own freshly created 0700 temp directory (or under unique,
    exclusively created names where a fact needs /private/tmp itself), MUST NOT write under $HOME, and MUST remove
    what they create.
  priority: P2
  mitigations:
  - mitigation.private-scratch-dirs
  acceptance:
  - given: a pre-existing symlink at a predictable /tmp name
    then: they neither follow it nor write through it
    when: the /tmp facts run
  - given: a full suite run
    then: no files created by the suite remain and nothing under $HOME changed
    when: it finishes
  tasks: []
- id: SR-006
  statement: Every fact that may abort inside a system library MUST run in a separate child process, and an abort
    MUST be recorded as an observation while the suite continues.
  priority: P1
  mitigations:
  - mitigation.crash-isolated-children
  acceptance:
  - given: the 20,000-rule fact
    then: the fact records the abort signal and every later fact still runs
    when: libsandbox aborts
  tasks: []
- id: SR-007
  statement: Timing-dependent facts MUST use fixed trial counts and per-child timeouts that kill the child and fail
    the fact; the compile-abort bisection MUST be opt-in and time-budgeted.
  priority: P2
  mitigations:
  - mitigation.bounded-trials
  acceptance:
  - given: a child that hangs
    then: it is killed and the fact fails with a timeout
    when: its timeout expires
  - given: the default test command
    then: the compile-abort bisection does not run; the asserting fact checks only the recorded bracket edges
    when: it runs
  tasks: []
- id: SR-008
  statement: Fact code MUST NOT run between fork and exec in the test runner process; each fact runs in a freshly
    exec'd probe binary, and fork-then-apply code exists only in that binary and issues syscalls only.
  priority: P2
  mitigations:
  - mitigation.exec-fresh-probe-binary
  acceptance:
  - given: the test harness source
    then: it contains no pre_exec closure or raw fork; children start through the standard process API
    when: it is reviewed
  tasks: []
- id: SR-009
  statement: All unsafe code MUST be confined to one test-only sys module per OS, with a SAFETY comment on every
    unsafe block; private symbols MUST be resolved by dynamic lookup and a missing symbol MUST fail its fact by
    name.
  priority: P1
  mitigations:
  - mitigation.confined-audited-ffi
  acceptance:
  - given: the workspace
    then: unsafe_code is forbidden in every module except the sys modules, and every unsafe block has a SAFETY comment
    when: lints run
  - given: a symbol name that does not exist
    then: the fact fails reporting the symbol as unavailable and the suite continues
    when: it is resolved
  tasks: []
- id: SR-010
  statement: The CI workflow MUST pin every third-party action to a full commit SHA, set token permissions to read-only,
    use no secrets on fact lanes, and check out without persisted credentials.
  priority: P2
  mitigations:
  - mitigation.pinned-least-privilege-ci
  acceptance:
  - given: the CI workflow file
    then: every uses reference has a 40-hex SHA, permissions is contents read, and no secrets reference appears
    when: it is checked
  tasks: []
- id: SR-011
  statement: The local CI command MUST run a dependency policy check (advisories, licence allowlist, crates.io-only
    sources, bans), and the lockfile MUST be part of the tree.
  priority: P2
  mitigations:
  - mitigation.dependency-policy
  acceptance:
  - given: a dependency with a disallowed licence or a git source
    then: it fails at the dependency gate
    when: the local CI command runs
  tasks: []
- id: SR-012
  statement: Every fact report and question finding MUST record OS version and build or kernel release, architecture,
    tier (Linux), and date; question findings MUST also record the method and whether the answer is proven or inferred.
  priority: P2
  mitigations:
  - mitigation.attributed-reports
  acceptance:
  - given: any suite run
    then: its header contains OS build or kernel, architecture, date and tier
    when: the report is printed
  tasks: []
- id: SR-013
  statement: Local Linux fact runs MUST NOT use privileged containers or host networking, MUST run the facts as
    a non-root user, and MUST mount the host workspace read-only.
  priority: P3
  mitigations:
  - mitigation.unprivileged-container
  acceptance:
  - given: the documented container recipe
    then: it has no --privileged, no host network, a read-only source mount and a non-root user
    when: it is inspected
  tasks: []
- id: SR-014
  statement: Probes MUST report byte counts, errno values and exit codes only, never file contents or environment
    variable values.
  priority: P3
  mitigations:
  - mitigation.report-redaction
  acceptance:
  - given: the inherited-fd fact reads a file
    then: the report shows the byte count, not the contents
    when: it reports
  tasks: []
- id: SR-015
  statement: The local CI command MUST fail when any published file mentions the private notes directory, specs/
    or .specify/.
  priority: P3
  mitigations:
  - mitigation.planning-path-gate
  acceptance:
  - given: a source comment citing a private research note
    then: the planning-path gate fails naming the file
    when: the local CI command runs
  tasks: []
- id: SR-016
  statement: The Linux probe MUST derive the tier only from measurements taken in throwaway children, MUST treat
    a failed, crashed or timed-out measurement as absent, and MUST NOT consult the kernel version string for capabilities.
  priority: P1
  mitigations:
  - mitigation.measured-tier-floor
  acceptance:
  - given: a container with default seccomp
    then: it reports T2 with user namespaces absent (EPERM)
    when: the probe runs
  - given: a measurement child that crashes
    then: the capability counts as absent and the tier is not raised
    when: the probe derives the tier
  tasks: []
- id: SR-017
  statement: Sandbox extension tokens MUST be passed between steps only over a stdin pipe, MUST NOT appear in argv,
    environment or observations, and MUST grant only a 0700 scratch directory.
  priority: P3
  mitigations:
  - mitigation.token-over-pipe
  acceptance:
  - given: the KF-M20 and KF-M25 steps run
    then: no token string appears; the child reads it from stdin
    when: argv, env and the report are inspected
  tasks: []
