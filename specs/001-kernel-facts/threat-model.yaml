otmVersion: 0.2.0
project:
  id: 001-kernel-facts
  name: Kernel facts as regression tests
threatspec:
  actors:
  - id: actor.action-publisher
    name: Publisher of a third-party CI action
    trust: untrusted
  - id: actor.agent-harness
    name: Agent harness running the suite inside its own Seatbelt sandbox
    trust: semi-trusted
  - id: actor.caged-child
    name: Child process run under a profile or Landlock domain by a fact
    trust: untrusted
  - id: actor.dependency-publisher
    name: Publisher of a crate dependency
    trust: untrusted
  - id: actor.local-process
    name: Other processes on the host sharing /tmp and the terminal
    trust: untrusted
  - id: actor.maintainer
    name: Maintainer on the reference Mac
    trust: trusted
  dispositions:
  - disposition: not-applicable
    reason: 'no authentication surface: the suite authenticates no principal; CI uses the platform token only, covered
      under privilege-escalation-via-config'
    technique: credential-theft
  - disposition: not-applicable
    reason: 'no authentication surface: no component accepts identities'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: 'no shared-tenant surface: hosted CI runners are single-job ephemeral VMs; the suite stores no tenant
      data'
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: 'no authorization surface: the feature tests the kernel''s access control but enforces none of its own'
    technique: broken-access-control
  - disposition: no-threat-detected
    reason: 'checked flow.probe-to-suite and flow.suite-to-probe: results travel as fixed exit codes and a fixed-format
      status line, argv is built from constants and the fact id; there is no shell, SQL, template or path sink fed
      by child output (held by SR-004)'
    technique: injection
  - disposition: no-threat-detected
    reason: 'checked asset.kernel-fact and asset.question-finding: expectations live in the published test source
      under version control, so a change is a reviewed diff; no separate mutable store exists'
    technique: data-tampering-at-rest
  - disposition: not-applicable
    reason: 'no llm-inference surface: the feature calls no language model'
    technique: prompt-injection-direct
  - disposition: not-applicable
    reason: no untrusted-content-to-model surface
    technique: prompt-injection-indirect
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: sensitive-information-disclosure
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: excessive-agency
  - disposition: not-applicable
    reason: 'no model-supply-chain surface: no models, adapters or datasets'
    technique: model-supply-chain
  - disposition: not-applicable
    reason: no persistent-model-input surface
    technique: training-data-poisoning
  - disposition: not-applicable
    reason: no cost-bearing-inference surface
    technique: unbounded-consumption
  - disposition: not-applicable
    reason: no user-facing-generation surface
    technique: misinformation
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: hidden-context-exposure
  - disposition: not-applicable
    reason: no retrieval-path surface
    technique: vector-embedding-weakness
  - disposition: not-applicable
    reason: 'no output-to-sink surface: no model output exists'
    technique: improper-output-handling
  - disposition: not-applicable
    reason: no llm-inference surface
    technique: model-extraction
  - disposition: not-applicable
    reason: 'no agent-autonomy surface: the feature contains no agent; an agent harness is only a possible runner,
      covered by threat.sandboxed-runner-false-result'
    technique: goal-hijack
  - disposition: not-applicable
    reason: no write-capable-tool surface exposed to an agent
    technique: tool-misuse
  - disposition: not-applicable
    reason: no delegated-identity surface
    technique: identity-privilege-abuse
  - disposition: not-applicable
    reason: no external-skill-supply surface in the shipped feature; crate and CI-action supply chain is modelled
      under STRIDE
    technique: agentic-supply-chain
  - disposition: not-applicable
    reason: no code-execution surface for an agent; children run fixed commands chosen by the suite (SR-004)
    technique: unexpected-code-execution
  - disposition: not-applicable
    reason: no agent-memory surface
    technique: memory-context-poisoning
  - disposition: not-applicable
    reason: no multi-agent surface
    technique: insecure-inter-agent-communication
  - disposition: not-applicable
    reason: no multi-agent or agent-autonomy surface
    technique: cascading-failure
  - disposition: not-applicable
    reason: no human-in-loop agent surface
    technique: human-agent-trust-exploitation
  - disposition: not-applicable
    reason: no agent-autonomy surface
    technique: rogue-agent
  exclusions: []
  extends: null
  generated: '2026-11-01T17:26:05Z'
  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: plan.md
    sha256: 531c0b64141dba680f95729c7a4bf0918ade323b36ccacf36dd3f6ed30698cbd
  - path: spec.md
    sha256: d344d6ffe86eba881b9e7369d801c1c7ff012030121dff188afa1a128783ad92
  surfaces:
  - external-input
  - network-boundary
  - persistent-store
  - audit-relevant
  version: '0.1'
trustZones:
- id: tz.caged
  name: Caged child (Seatbelt profile or Landlock/namespace domain)
  risk:
    trustRating: 10
- id: tz.container
  name: Local Linux container (Docker Desktop VM)
  risk:
    trustRating: 50
- id: tz.host
  name: Maintainer host or CI runner, user account
  risk:
    trustRating: 70
- id: tz.internet
  name: Internet (crates.io, GitHub Actions marketplace)
  risk:
    trustRating: 1
- id: tz.os
  name: Kernel and system libraries (libsandbox, Landlock, seccomp)
  risk:
    trustRating: 90
assets:
- id: asset.ci-token
  name: CI job token and runner
  risk:
    availability: 40
    confidentiality: 80
    integrity: 80
  attributes:
    type: credential
    source: spec.md#FR-017
    classification: secret
- id: asset.fact-report
  name: Fact run report (per fact pass/fail, OS build, date)
  risk:
    availability: 40
    confidentiality: 20
    integrity: 85
  attributes:
    type: log
    source: spec.md#FR-004
    classification: internal
- id: asset.kernel-fact
  name: Kernel fact
  risk:
    availability: 40
    confidentiality: 5
    integrity: 95
  attributes:
    type: business-data
    source: spec.md#Key-Entities
    classification: public
- id: asset.maintainer-session
  name: Maintainer user account, terminal and home directory
  risk:
    availability: 60
    confidentiality: 80
    integrity: 95
  attributes:
    type: configuration
    source: spec.md#User-Story-1
    classification: confidential
- id: asset.probe-result
  name: Probe result (Linux)
  risk:
    availability: 40
    confidentiality: 10
    integrity: 90
  attributes:
    type: business-data
    source: spec.md#Key-Entities
    classification: public
- id: asset.question-finding
  name: Question finding
  risk:
    availability: 30
    confidentiality: 5
    integrity: 85
  attributes:
    type: business-data
    source: spec.md#Key-Entities
    classification: public
- id: asset.source-tree
  name: Published source tree and lockfile
  risk:
    availability: 50
    confidentiality: 10
    integrity: 90
  attributes:
    type: source-code
    source: spec.md#FR-014
    classification: public
components:
- id: component.ci-workflow
  name: CI workflow and its lanes
  type: service
  parent:
    trustZone: tz.host
  attributes:
    source: spec.md#FR-017
    entity: Lane
- id: component.container
  name: Local Linux container run (default and unconfined seccomp)
  type: service
  parent:
    trustZone: tz.container
  attributes:
    source: spec.md#SC-003
- id: component.fact-suite
  name: Fact suite (test harness that runs the catalog)
  type: service
  parent:
    trustZone: tz.host
  attributes:
    source: spec.md#FR-001
- id: component.kf-probe
  name: kf-probe binary (one step per invocation)
  type: process
  parent:
    trustZone: tz.caged
  attributes:
    source: plan.md#Project-Structure
    path: tests/kernel_facts/src/bin/kf-probe/
- id: component.lane
  name: Lane
  type: service
  parent:
    trustZone: tz.host
  attributes:
    source: spec.md#Key-Entities
- id: component.linux-probe
  name: Linux tier probe
  type: process
  parent:
    trustZone: tz.caged
  attributes:
    source: spec.md#FR-009
    entity: Probe result (Linux)
- id: component.local-ci
  name: Local CI command (all gates)
  type: service
  parent:
    trustZone: tz.host
  attributes:
    source: spec.md#FR-016
- id: component.probe-child
  name: Probe child that performs one fact and reports the observation
  type: process
  parent:
    trustZone: tz.caged
  attributes:
    source: spec.md#FR-003
- id: component.question-probes
  name: Question probes (path A layout, compile-abort threshold, extension ordering, TIOCSTI)
  type: process
  parent:
    trustZone: tz.caged
  attributes:
    source: spec.md#FR-012
- id: component.registry
  name: Crate registry and action marketplace
  type: service
  parent:
    trustZone: tz.internet
  attributes:
    source: spec.md#FR-019
- id: component.sys-ffi
  name: Test-only sys FFI modules (the only unsafe)
  type: library
  parent:
    trustZone: tz.host
  attributes:
    source: plan.md#Complexity-Tracking
    path: tests/kernel_facts/src/sys/
- id: component.system-sandbox
  name: libsandbox, Seatbelt, Landlock, seccomp, namespaces
  type: library
  parent:
    trustZone: tz.os
  attributes:
    source: spec.md#Context
- id: component.workspace
  name: Workspace (policy crate, facade crate, test-only sys modules)
  type: library
  parent:
    trustZone: tz.host
  attributes:
    source: spec.md#FR-014
dataflows:
- id: flow.actions-fetch
  name: CI actions fetched by the workflow
  source: component.registry
  destination: component.ci-workflow
  assets:
  - asset.ci-token
  attributes:
    crosses:
    - tz.internet
    - tz.host
- id: flow.child-to-filesystem
  name: Probe children create, read and delete files on the host
  source: component.probe-child
  destination: tz.host
  assets:
  - asset.maintainer-session
  attributes:
    crosses:
    - tz.host
- id: flow.child-to-terminal
  name: Probe child's terminal access (TIOCSTI probe)
  source: component.question-probes
  destination: actor.maintainer
  assets:
  - asset.maintainer-session
  attributes:
    crosses:
    - tz.host
- id: flow.deps-fetch
  name: Dependencies fetched into the workspace
  source: component.registry
  destination: component.workspace
  assets:
  - asset.source-tree
  attributes:
    crosses:
    - tz.internet
    - tz.host
- id: flow.host-to-container
  name: Workspace mounted into a local container for Linux facts
  source: component.local-ci
  destination: component.container
  assets:
  - asset.source-tree
  - asset.maintainer-session
  attributes:
    crosses:
    - tz.container
- id: flow.linux-probe-to-suite
  name: Linux probe returns measurements and tier
  source: component.linux-probe
  destination: component.fact-suite
  assets:
  - asset.probe-result
  attributes:
    crosses:
    - tz.caged
- id: flow.probe-to-suite
  name: Probe child returns its observation (exit status, errno, status line)
  source: component.probe-child
  destination: component.fact-suite
  assets:
  - asset.fact-report
  attributes:
    crosses:
    - tz.caged
- id: flow.probe-to-system
  name: Probe child compiles and applies profiles, restricts itself
  source: component.probe-child
  destination: component.system-sandbox
  assets:
  - asset.kernel-fact
  attributes:
    crosses:
    - tz.os
- id: flow.questions-to-suite
  name: Question probes return dated findings
  source: component.question-probes
  destination: component.fact-suite
  assets:
  - asset.question-finding
  attributes:
    crosses:
    - tz.caged
- id: flow.report-to-log
  name: Fact reports written to the terminal and CI logs
  source: component.fact-suite
  destination: component.lane
  assets:
  - asset.fact-report
  attributes:
    crosses: []
- id: flow.suite-to-probe
  name: Suite starts a probe child with a fact id and fixed arguments
  source: component.fact-suite
  destination: component.probe-child
  assets:
  - asset.kernel-fact
  attributes:
    crosses:
    - tz.caged
- id: flow.token-pipe
  name: Extension token from ext-parent to ext-child over stdin
  source: component.kf-probe
  destination: component.probe-child
  assets:
  - asset.maintainer-session
  attributes:
    crosses:
    - tz.caged
threats:
- id: threat.compile-abort-kills-harness
  name: The 20,000-rule libsandbox abort, or a compile-abort bisection step, runs in the test process and kills
    the whole run, so no other fact is reported
  categories:
  - Denial of Service
  cwes:
  - CWE-400
  risk:
    impact: 50
    likelihood: 80
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.fact-report
    status: mitigated
    actor: actor.caged-child
    disposition: threat
    elements:
    - component.question-probes
    - flow.probe-to-system
    profile: stride
    severity: high
    technique: resource-exhaustion
- id: threat.container-host-exposure
  name: The local Linux run uses a privileged container, root or a writable host mount, so a fact or escape probe
    can modify the host workspace or Docker VM
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-250
  risk:
    impact: 55
    likelihood: 25
  attributes:
    source: spec.md#SC-003
    assets:
    - asset.maintainer-session
    - asset.source-tree
    status: mitigated
    actor: actor.caged-child
    disposition: threat
    elements:
    - flow.host-to-container
    - component.container
    profile: stride
    severity: low
    technique: privilege-escalation-via-config
- id: threat.escape-fact-runs-unconfined-payload
  name: Escape facts (no-sandbox exec, inherited-fd read, setuid exec) run code unconfined or elevated; built from
    variable input or interactive, they could run arbitrary commands or hang on a password prompt
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-78
  - CWE-250
  risk:
    impact: 75
    likelihood: 30
  attributes:
    source: spec.md#Fact-catalog
    assets:
    - asset.maintainer-session
    status: mitigated
    actor: actor.caged-child
    disposition: threat
    elements:
    - component.probe-child
    - flow.suite-to-probe
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.extension-token-exposure
  name: The per-spawn sandbox extension token (a write capability for a directory) passed between ext-parent and
    ext-child steps via argv or printed in observations is readable by other same-user processes or CI logs and
    consumable by them
  categories:
  - Information Disclosure
  - Elevation of Privilege
  cwes:
  - CWE-214
  - CWE-532
  risk:
    impact: 45
    likelihood: 30
  attributes:
    source: plan.md#Project-Structure; contracts/probe-protocol.md#Steps-macOS
    assets:
    - asset.maintainer-session
    status: mitigated
    actor: actor.local-process
    disposition: threat
    elements:
    - flow.token-pipe
    - component.kf-probe
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.false-pass-enforcement-fact
  name: An enforcement fact passes because the child failed for an unrelated reason (missing binary, wrong path
    spelling, setup error), so a broken enforcement looks verified
  categories:
  - Spoofing
  - Tampering
  cwes:
  - CWE-754
  risk:
    impact: 90
    likelihood: 60
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.kernel-fact
    - asset.fact-report
    status: mitigated
    actor: actor.caged-child
    constitution: III. The kernel is the oracle
    disposition: threat
    elements:
    - flow.probe-to-suite
    - component.probe-child
    profile: stride
    severity: high
    technique: false-evidence
- id: threat.ffi-misdeclaration
  name: A wrong FFI declaration (variadic sandbox_check, apply argument struct, extension calls) causes undefined
    behaviour, so the suite records garbage observations or corrupts memory
  categories:
  - Tampering
  cwes:
  - CWE-628
  - CWE-119
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#FR-015
    assets:
    - asset.kernel-fact
    - asset.source-tree
    status: mitigated
    actor: actor.maintainer
    constitution: IV. unsafe in sys only, with SAFETY comments
    disposition: threat
    elements:
    - component.sys-ffi
    - flow.probe-to-system
    profile: stride
    severity: high
    technique: memory-safety
- id: threat.fork-in-multithreaded-harness
  name: A child forked from the multithreaded test runner allocates or takes locks before exec and deadlocks or
    misbehaves, giving hangs or flaky results
  categories:
  - Denial of Service
  - Tampering
  cwes:
  - CWE-833
  - CWE-479
  risk:
    impact: 60
    likelihood: 60
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.fact-report
    status: mitigated
    actor: actor.maintainer
    constitution: IV. Syscalls only between fork and exec
    disposition: threat
    elements:
    - component.fact-suite
    - flow.suite-to-probe
    profile: stride
    severity: medium
    technique: memory-safety
- id: threat.malicious-dependency
  name: A crate dependency with a known advisory, an unexpected licence or a non-registry source enters the workspace
  categories:
  - Tampering
  cwes:
  - CWE-1357
  risk:
    impact: 75
    likelihood: 20
  attributes:
    source: spec.md#FR-016
    assets:
    - asset.source-tree
    status: mitigated
    actor: actor.dependency-publisher
    disposition: threat
    elements:
    - flow.deps-fetch
    profile: stride
    severity: medium
    technique: data-tampering-in-transit
- id: threat.planning-path-leak
  name: The published tree cites local planning paths (the private notes directory, specs/, .specify/), exposing
    internal notes and creating dead references
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    impact: 20
    likelihood: 40
  attributes:
    source: spec.md#FR-018
    assets:
    - asset.source-tree
    status: mitigated
    actor: actor.maintainer
    disposition: threat
    elements:
    - component.workspace
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.probe-overstates-tier
  name: The Linux probe reports a higher tier than the host supports (inferred from the kernel version, or a crashed
    measurement counted as success), so later specs trust protection that is absent
  categories:
  - Spoofing
  - Elevation of Privilege
  cwes:
  - CWE-754
  risk:
    impact: 80
    likelihood: 35
  attributes:
    source: spec.md#FR-010
    assets:
    - asset.probe-result
    status: mitigated
    actor: actor.caged-child
    constitution: I. Fail closed, never silently weaker; VI. Linux capabilities are probed, never inferred
    disposition: threat
    elements:
    - component.linux-probe
    - flow.linux-probe-to-suite
    profile: stride
    severity: high
    technique: false-evidence
- id: threat.sandboxed-runner-false-result
  name: When the suite runs inside an agent harness's Seatbelt sandbox, applies fail or are silently ignored, so
    enforcement facts report wrong outcomes or skip
  categories:
  - Spoofing
  risk:
    impact: 80
    likelihood: 80
  attributes:
    source: spec.md#FR-007
    assets:
    - asset.kernel-fact
    - asset.fact-report
    status: mitigated
    actor: actor.agent-harness
    constitution: III. The kernel is the oracle (enforcement tests fail, never skip, on AlreadySandboxed)
    disposition: threat
    elements:
    - component.fact-suite
    - flow.probe-to-system
    profile: stride
    severity: critical
    technique: false-evidence
- id: threat.secret-leak-in-reports
  name: Probes print environment variables or contents of files they read into terminal and CI logs, leaking secrets
  categories:
  - Information Disclosure
  cwes:
  - CWE-532
  risk:
    impact: 60
    likelihood: 25
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.maintainer-session
    - asset.fact-report
    status: mitigated
    actor: actor.caged-child
    disposition: threat
    elements:
    - flow.report-to-log
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.shared-tmp-races
  name: Facts that create files under /private/tmp or delete them race with or follow symlinks planted by other
    local processes, writing or deleting outside the test's own files
  categories:
  - Tampering
  cwes:
  - CWE-377
  - CWE-59
  risk:
    impact: 60
    likelihood: 35
  attributes:
    source: spec.md#Fact-catalog
    assets:
    - asset.maintainer-session
    status: mitigated
    actor: actor.local-process
    disposition: threat
    elements:
    - flow.child-to-filesystem
    profile: stride
    severity: medium
    technique: data-tampering-in-transit
- id: threat.tiocsti-injects-into-maintainer-terminal
  name: The TIOCSTI probe injects input into the maintainer's or CI's real terminal, where it runs as the user
  categories:
  - Elevation of Privilege
  - Tampering
  cwes:
  - CWE-74
  risk:
    impact: 90
    likelihood: 50
  attributes:
    source: spec.md#FR-012
    assets:
    - asset.maintainer-session
    status: mitigated
    actor: actor.caged-child
    constitution: V. Hygiene by default (no inherited controlling terminal)
    disposition: threat
    elements:
    - flow.child-to-terminal
    - component.question-probes
    profile: stride
    severity: high
    technique: terminal-injection
- id: threat.unattributed-evidence
  name: A fact report or question finding lacks the OS build, kernel, tier or date, so nobody can tell which release
    a fact was verified on
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 45
    likelihood: 55
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.fact-report
    - asset.question-finding
    status: mitigated
    actor: actor.maintainer
    constitution: III. Findings carry the date and the macOS build or kernel release
    disposition: threat
    elements:
    - flow.report-to-log
    - flow.questions-to-suite
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.unbounded-fact-runtime
  name: Contention trials or the compile-abort bisection hang or run for many minutes, blocking local runs and CI
    lanes
  categories:
  - Denial of Service
  cwes:
  - CWE-400
  - CWE-835
  risk:
    impact: 40
    likelihood: 50
  attributes:
    source: spec.md#FR-006
    assets:
    - asset.fact-report
    status: mitigated
    actor: actor.caged-child
    disposition: threat
    elements:
    - component.probe-child
    - component.question-probes
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.unpinned-ci-actions
  name: A third-party CI action referenced by a mutable tag is replaced and runs attacker code with the job token
  categories:
  - Elevation of Privilege
  - Tampering
  cwes:
  - CWE-829
  risk:
    impact: 75
    likelihood: 30
  attributes:
    source: spec.md#FR-017
    assets:
    - asset.ci-token
    - asset.source-tree
    status: mitigated
    actor: actor.action-publisher
    disposition: threat
    elements:
    - flow.actions-fetch
    - component.ci-workflow
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
mitigations:
- id: mitigation.attributed-reports
  name: Every report and finding carries OS version and build or kernel release, architecture, tier, date, and for
    findings the method and proven/inferred flag
  riskReduction: 80
  attributes:
    threats:
    - threat.unattributed-evidence
    status: verified
    kind: detective
    requirements:
    - SR-012
    touchpoints:
    - tests/kernel_facts/tests/kernel_facts.rs
    - tests/kernel_facts/src/lib.rs
- id: mitigation.bounded-trials
  name: Fixed trial counts, per-child timeouts with kill, and an opt-in time-budgeted compile-abort bisection
  riskReduction: 70
  attributes:
