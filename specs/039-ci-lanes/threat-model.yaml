  exclusions: []
  extends: null
  generated: '2026-11-01T21:15:52Z'
  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: spec.md
    sha256: 126f92403c883c6e2afe705e15aab32552637db76f6135f1348361da3a4f61c8
  surfaces:
  - external-input
  - authentication
  - network-boundary
