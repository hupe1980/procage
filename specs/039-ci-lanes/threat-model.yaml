otmVersion: 0.2.0
project:
  id: 039-ci-lanes
  name: CI lanes for the releases people run
threatspec:
  actors:
  - id: actor.action-author
    name: Maintainer of a third-party action the workflow uses, or whoever compromises that action's repository
    trust: untrusted
  - id: actor.consumer
    name: Developer of a harness who reads the supported releases and tiers and relies on them
    trust: trusted
  - id: actor.contributor
    name: procage contributor who edits the workflow, the lane assertions, the base profiles or the platform docs
    trust: semi-trusted
  - id: actor.image-provider
    name: The provider of the hosted runner images, which updates and remaps image labels on its own schedule
    trust: semi-trusted
  - id: actor.pr-author
    name: Author of a pull request, possibly from a fork, whose code the lanes build and run
    trust: untrusted
  dispositions:
  - disposition: no-threat-detected
    reason: 'checked flow.image: the identity that matters is which OS a lane really runs, covered by threat.silent-image-change'
    technique: identity-spoofing
  - disposition: no-threat-detected
    reason: 'checked flow.actions: actions and toolchains are fetched over TLS by the runner; integrity of what
      is fetched is threat.action-supply-chain'
    technique: data-tampering-in-transit
  - disposition: not-applicable
    reason: no shared-tenant surface; hosted runners are ephemeral per job and the repository is the only tenant
    technique: cross-tenant-leak
  - disposition: no-threat-detected
    reason: 'checked component.lane: a hung caged test turns the lane red at the job timeout; it delays the signal
      and grants nothing'
    technique: resource-exhaustion
  - disposition: no-threat-detected
    reason: 'checked flow.report: the lane report prints OS, build, architecture, tier, Landlock ABI and errata,
      all public; tokens are threat.token-overreach'
    technique: sensitive-data-exposure
  - disposition: not-applicable
    reason: the CI lanes call no model and run no agent; programs run in caged tests are the adversary inside the
      child, modelled under STRIDE
    technique: prompt-injection-direct
  - disposition: not-applicable
    reason: the CI lanes call no model and run no agent; programs run in caged tests are the adversary inside the
