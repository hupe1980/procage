mitigations:
- id: mitigation.cap-answer-first
  name: Answer first, then record into the capped record (10,000) and bounded receiver; detached runs keep being
    answered until POLLHUP
  riskReduction: 80
  attributes:
    threats:
    - threat.record-flood
    - threat.blocked-run
    status: verified
    kind: preventive
    requirements:
    - SR-002
    - SR-006
    touchpoints:
    - crates/procage/src/linux/violations.rs
    - crates/procage/src/violation.rs
- id: mitigation.eperm-only
  name: 'The answer is built in one place: error -EPERM, value 0, flags 0, sent before recording'
  riskReduction: 90
  attributes:
    threats:
    - threat.continue-answer
    - threat.blocked-run
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage/src/linux/violations.rs
- id: mitigation.hup-complete
  name: Complete only after POLLHUP and the child reaped; coverage SystemCalls documents that Landlock denials are
    not reported
  riskReduction: 80
  attributes:
    threats:
    - threat.false-complete
    status: verified
    kind: detective
    requirements:
    - SR-007
    touchpoints:
    - crates/procage/src/linux/violations.rs
    - crates/procage/src/lib.rs
    - crates/procage/THREAT_MODEL.md
- id: mitigation.no-copy
  name: The listener is created close-on-exec, sent before execve and closed in the child; /proc reopen is refused
    by the kernel (measured ENXIO/EACCES); pidfd_getfd and ptrace stay refused by the process-access class, whose
    waiver already hands the parent to the child
  riskReduction: 85
  attributes:
    threats:
    - threat.listener-hijack
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage/src/linux/sys.rs
    - crates/procage/tests/escape_linux.rs
- id: mitigation.plain-fallback
  name: On listener failure the child installs the plain filter in the same step and reports the errno; any other
    failure aborts the spawn as today
  riskReduction: 90
  attributes:
    threats:
    - threat.unfiltered-fallback
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - crates/procage/src/linux/sys.rs
- id: mitigation.same-oracle
  name: Condition::matches checked against the BPF interpreter on generated arguments; process name read before
    answering and dropped unless the notification is still valid
  riskReduction: 75
  attributes:
    threats:
    - threat.wrong-reason
    status: verified
    kind: detective
    requirements:
    - SR-005
    touchpoints:
    - crates/procage-policy/src/linux.rs
    - crates/procage/src/linux/seccomp.rs
    - crates/procage/src/linux/violations.rs
- id: mitigation.verdict-only
  name: Both filters come from one builder; only EPERM verdicts differ; reference-policy filters byte-identical
    without reporting; Linux escape suite with reporting on
  riskReduction: 90
  attributes:
    threats:
    - threat.filter-drift
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - crates/procage/src/linux/seccomp.rs
    - crates/procage/tests/escape_linux.rs
requirements:
- id: SR-001
  statement: 'No process of the run MUST hold or be able to open the seccomp listener: the child closes it before
    execve, and a caged process scanning its descriptors and the parent''s /proc entries MUST find none it can use.'
  priority: P1
  mitigations:
  - mitigation.no-copy
  acceptance:
  - given: a reporting run on T1 and T2
    then: it holds no seccomp listener and the open fails
    when: the caged process lists its descriptors and tries to open the parent's listener through /proc
  tasks: []
- id: SR-002
  statement: The supervisor MUST answer every notification with EPERM (value 0, no flags) before recording it, and
    MUST keep answering until the listener hangs up, also after detach.
  priority: P1
  mitigations:
  - mitigation.eperm-only
  - mitigation.cap-answer-first
  acceptance:
  - given: a reporting run
    then: it fails with EPERM and the record lists it
    when: the child makes a refused call
  - given: a detached run
    then: the call returns EPERM instead of blocking
    when: its process makes a refused call
  tasks: []
- id: SR-003
  statement: Without reporting the filter MUST be byte-identical to today's; with it only the verdict of EPERM rules
    MUST differ, and the Linux escape suite MUST pass with reporting on.
  priority: P1
  mitigations:
  - mitigation.verdict-only
  acceptance:
  - given: every reference policy and target
    then: they differ only in EPERM verdicts, and without it equals the plain builder
    when: the filter is built with and without notification
  - given: the Linux escape suite
    then: every canary holds
    when: run with reporting on, T1 and T2
  tasks: []
- id: SR-004
  statement: If the listener cannot be created the child MUST install the plain filter before execve and the record
    MUST say Unavailable with the reason; no run MUST exec without a filter.
  priority: P1
  mitigations:
  - mitigation.plain-fallback
  acceptance:
  - given: an outer filter that already has a listener
    then: the child is confined, its refused calls fail with EPERM, and coverage is Unavailable naming EBUSY
    when: a reporting cage spawns
  tasks: []
- id: SR-005
  statement: A violation's reason MUST be the reason of the first rule whose condition matches, evaluated as the
    filter does, and its process name MUST be dropped if the notification is no longer valid.
  priority: P2
  mitigations:
  - mitigation.same-oracle
  acceptance:
  - given: generated arguments for every condition
    then: they agree
    when: matches() and the BPF interpreter evaluate them
  - given: a refused socket, setsid and ptrace
    then: the reasons are not granted, lifetime and the process-access class
    when: they are recorded
  tasks: []
- id: SR-006
  statement: The record MUST keep at most 10,000 violations and count the rest; answering MUST NOT wait on the harness.
  priority: P2
  mitigations:
  - mitigation.cap-answer-first
  acceptance:
  - given: a child making 20,000 refused calls
    then: every call returns EPERM promptly and the record holds the cap with the rest counted
    when: it runs
  tasks: []
- id: SR-007
  statement: A Linux record MUST be complete only after the listener hung up and the child was reaped, and its coverage
    MUST be SystemCalls, Unavailable or Off; docs MUST say Landlock denials are not reported.
  priority: P1
  mitigations:
  - mitigation.hup-complete
  acceptance:
  - given: a running child or a surviving descendant
    then: it is not complete
    when: the record is read
  - given: the run ended by kill_all
    then: it is complete with coverage SystemCalls
    when: the record is read
  tasks: []
verification:
- id: verification.sr-001.2026-11-01
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/escape_linux.rs::r32_the_seccomp_listener_stays_out_of_reach
  result: pass
  verdict: verified
  justification: On T1 and T2 with /proc granted, the caged child counts seccomp listeners among its own descriptors
    (0) and tries to reopen every listener it sees under /proc/<parent>/fd (0 reopened, the kernel refuses), while
    its coverage is SystemCalls. The child closes the listener after sendmsg (sys.rs ChildPlan::run); pidfd_getfd
    and ptrace stay refused by the process-access class.
  verified_at: '2026-11-01T06:27:37Z'
  commit: 36ed673
