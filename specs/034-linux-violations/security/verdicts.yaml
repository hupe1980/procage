verdicts:
  - requirement: SR-001
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r32_the_seccomp_listener_stays_out_of_reach
    result: pass
    justification: On T1 and T2 with /proc granted, the caged child counts seccomp listeners among its own descriptors (0) and tries to reopen every listener it sees under /proc/<parent>/fd (0 reopened, the kernel refuses), while its coverage is SystemCalls. The child closes the listener after sendmsg (sys.rs ChildPlan::run); pidfd_getfd and ptrace stay refused by the process-access class.
  - requirement: SR-002
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_linux.rs::refused_calls_are_reported_with_their_reason; crates/procage/tests/spawn_linux.rs::a_detached_run_is_still_answered
    result: pass
    justification: Refused ptrace, socket and setsid each return EPERM in the child and appear in the record; a detached run's later refused calls return EPERM instead of blocking. The answer is built only in sys::answer_eperm (error -EPERM, value 0, flags 0) and sent before the violation is built (violations.rs supervise).
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: crates/procage/src/linux/seccomp.rs::notifying_changes_only_eperm_verdicts; crates/procage/tests/escape_linux.rs (PROCAGE_ESCAPE_VIOLATIONS=1, T1 and T2)
    result: pass
    justification: For varied policies on both tiers and ABIs 1–8, the notifying filter has the same instructions as the plain one except EPERM returns, which become SECCOMP_RET_USER_NOTIF; the plain path (notify false) is unchanged and its existing filter tests pass; the Linux escape suite passes 22/22 with reporting on, on both tiers.
  - requirement: SR-004
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_linux.rs::without_a_listener_the_run_is_still_confined
    result: pass
    justification: With an outer filter holding a listener on the spawning thread, the reporting child's listener install fails with EBUSY, it installs the plain filter, ptrace still returns EPERM, and the record's coverage is Unavailable naming the busy error.
  - requirement: SR-005
    verdict: verified
    method: test
    evidence: crates/procage/src/linux/seccomp.rs::matches_agrees_with_the_filter; crates/procage-policy/tests/seccomp_reasons.rs::each_origin_names_its_reason; crates/procage/tests/spawn_linux.rs::refused_calls_are_reported_with_their_reason
    result: pass
    justification: Condition::matches equals the BPF interpreter on edge and pseudo-random arguments for every EPERM rule of varied plans; each rule origin carries its reason; the caged test finds process-access, not granted and lifetime for ptrace, socket and setsid. The process name is read before answering and kept only if NOTIF_ID_VALID still holds.
  - requirement: SR-006
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_linux.rs::a_flood_is_answered_and_capped
    result: pass
    justification: 20,000 refused ptrace calls all return EPERM; the record holds 10,000 and counts 10,000 dropped, and is complete.
  - requirement: SR-007
    verdict: verified
    method: test
    evidence: crates/procage/tests/spawn_linux.rs::a_record_completes_when_the_run_ends; crates/procage/tests/spawn_linux.rs::a_surviving_descendant_keeps_the_record_open
    result: pass
    justification: A running child's record is incomplete (the receiver already yielded its ptrace), and complete after kill_all; a background descendant keeps the record incomplete after the child exits until kill_all. Crate docs, THREAT_MODEL and the site state that Landlock denials are not reported.
