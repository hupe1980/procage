mitigations:
- id: mitigation.deny-then-name
  name: The process-access class denies sysctl-read of the kern.procargs prefix and, first in the profile, process-info-pidinfo
    unfiltered, then allows pidinfo for the same sandbox; the canary reads another process's KERN_PROCARGS2, KERN_PROCARGS
    and pidinfo by numeric call, with positive controls on self and an own child and a control with the class waived
  riskReduction: 85
  attributes:
    threats:
    - threat.procargs-variant
    - threat.numeric-unnamed-sysctl
    status: required
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/src/sbpl.rs
    - crates/procage/src/macos/sys.rs
    - crates/procage/tests/escape_macos.rs
- id: mitigation.fresh-proc
  name: The target runs inside the new PID namespace and /proc is mounted fresh from inside it, over the old one;
    the T1 canary checks /proc, a known outside pid and every proc mount in mountinfo
  riskReduction: 90
  attributes:
    threats:
    - threat.stale-proc-view
    status: rejected
    kind: preventive
    requirements: []
    touchpoints:
    - no PID namespace in this change (clarification 2026-11-02)
- id: mitigation.lifetime-suite
  name: The R-23 escape suite runs unchanged on T1 with the PID namespace, and a test checks that orphans are reaped
    and that no process of the run survives its end
  riskReduction: 85
  attributes:
    threats:
    - threat.pidns-lifetime
    status: rejected
    kind: preventive
    requirements: []
    touchpoints:
    - no PID namespace in this change (clarification 2026-11-02)
- id: mitigation.literal-allowlist
  name: The class adds exactly the prefix deny, the early pidinfo deny and the same-sandbox pidinfo allow and allows
    nothing else (the pidinfo allow is the only allow without a policy rule); the policy tests pin the lines and
    the preset fixtures v1 to v3 pin every preset
  riskReduction: 85
  attributes:
    threats:
    - threat.rule-weakened
    status: required
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/tests/base.rs
    - crates/procage-policy/tests/precedence.rs
    - crates/procage-policy/tests/gaps.rs
    - crates/procage-policy/tests/presets.rs
    - crates/procage-policy/tests/fixtures/presets
- id: mitigation.measure-before-freeze
  name: The R-25 canaries fail, never skip, in every just escape variant (default, with reporting, base V3 with
    reporting) and on every macOS lane; the macOS 27 lane re-measures the rule when it exists
  riskReduction: 80
  attributes:
    threats:
    - threat.unmeasured-release
    - threat.prefix-future-name
    status: required
    kind: detective
    requirements:
    - SR-003
    touchpoints:
    - crates/procage/tests/escape_macos.rs
    - .github/workflows/ci.yml
    - justfile
- id: mitigation.no-default-proc
  name: The Linux base and every preset grant nothing under /proc beyond /proc/self and /proc/thread-self; a canary
    reads another process's cmdline on the default policy and expects a denial
  riskReduction: 80
  attributes:
    threats:
    - threat.t2-silent-proc
    status: required
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - crates/procage-policy/src/base.rs
    - crates/procage-policy/src/presets.rs
    - crates/procage-policy/tests/presets.rs
    - crates/procage/tests/escape_linux.rs
- id: mitigation.per-platform-status
  name: 'THREAT_MODEL marks R-25 mitigated with per-platform text, the site pages state the Linux residual with
    the approximation accepted and the macOS waiver, and the CHANGELOG carries both migration notes (macOS: waive
    ProcessAccess; Linux: allow ProcOtherProcesses)'
  riskReduction: 75
  attributes:
    threats:
    - threat.status-overclaim
    - threat.linux-root-refused
    status: required
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - crates/procage/THREAT_MODEL.md
    - site/content/docs/macos.md
    - site/content/docs/linux.md
    - site/content/docs/threat-model.md
    - CHANGELOG.md
- id: mitigation.proc-gap
  name: On Linux T1 and T2 a file rule, raw Landlock rule or glob that reaches /proc other than /proc/self and /proc/thread-self
    is an approximation in the lowering; at cage creation a rule whose canonicalised path reaches /proc (a symbolic
    link) is refused unless accepted, then listed in the plan; at spawn a grant's resolved path is checked the same
    way and, when accepted, listed in the run's receipt
  riskReduction: 85
  attributes:
    threats:
    - threat.t2-silent-proc
    - threat.proc-reach-bypass
    - threat.linux-root-refused
    status: required
    kind: preventive
    requirements:
