trustZones:
- id: tz.cage
  name: The caged child and the run's descendants
  risk:
    trustRating: 5
- id: tz.harness
  name: The harness that builds cages
  risk:
    trustRating: 90
- id: tz.os
  name: The kernel (Seatbelt and sysctl on macOS; /proc and Landlock on Linux)
  risk:
    trustRating: 95
- id: tz.others
  name: The user's other processes (editor, agent, shell, the calling program)
  risk:
    trustRating: 70
assets:
- id: asset.base
  name: The process-access hard-deny class and the frozen macOS base profiles (V1 to V3) and presets (v1 to v3)
    it applies to, with their fixtures
  risk:
    availability: 50
    confidentiality: 0
    integrity: 90
  attributes:
    type: capability
    source: spec.md#Key-Entities
    classification: internal
- id: asset.compat
  name: 'Existing policies: Linux rules or grants on / or /proc, macOS runs that read other processes, and the programs
    of the base program set'
  risk:
    availability: 70
    confidentiality: 0
    integrity: 30
  attributes:
    type: capability
    source: plan.md#Summary
    classification: internal
- id: asset.lifetime
  name: 'The run-lifetime guarantee: no process of the run outlives it (unchanged; no PID namespace in this change)'
  risk:
    availability: 50
    confidentiality: 0
    integrity: 90
  attributes:
    type: capability
    source: spec.md#FR-003
    classification: internal
- id: asset.process-secrets
  name: Command lines and environments of the user's other processes, which routinely hold tokens
  risk:
    availability: 0
    confidentiality: 100
    integrity: 0
  attributes:
    type: credential
    source: spec.md#Input
    classification: secret
components:
- id: component.canaries
  name: R-25 canaries on the default policy in every just escape variant and on Linux T1/T2, and the base program
    set
  type: test
  parent:
    trustZone: tz.harness
  attributes:
    source: plan.md#Summary
    files:
    - crates/procage/tests/escape_macos.rs
    - crates/procage/tests/escape_linux.rs
    - crates/procage/tests/spawn_macos.rs
- id: component.docs
  name: THREAT_MODEL, crate docs, site and CHANGELOG on R-25
  type: document
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-005
    files:
    - crates/procage/THREAT_MODEL.md
    - site/content/docs/macos.md
    - site/content/docs/linux.md
    - site/content/docs/threat-model.md
    - CHANGELOG.md
- id: component.lifetime
  name: Run-lifetime enforcement (the whole run is killed when it ends); unchanged by this change
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#Clarifications
- id: component.preset-fixtures
  name: Frozen preset fixtures v1 to v3 (each three lines longer) and the policy tests that pin the class's rules
  type: test
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#Key-Entities
    files:
    - crates/procage-policy/tests/fixtures/presets
    - crates/procage-policy/tests/presets.rs
    - crates/procage-policy/tests/base.rs
    - crates/procage-policy/tests/precedence.rs
    - crates/procage-policy/tests/gaps.rs
- id: component.proc-reach
  name: 'Linux proc-other-processes approximation on T1 and T2: the shared predicate reaches_other_processes, the
    lowering''s proc_reach (file rules, raw Landlock rules, globs), proc_links at cage creation (rules that resolve
    to /proc) and the grant check in bind at spawn'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-003
    files:
    - crates/procage-policy/src/linux.rs
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage-policy/src/lower/mod.rs
    - crates/procage/src/linux/mod.rs
- id: component.process-access-class
  name: 'macOS process-access hard-deny class: (deny sysctl-read (sysctl-name-prefix "kern.procargs")), a quiet
    early unfiltered (deny process-info-pidinfo) and (allow process-info-pidinfo (target same-sandbox)), in every
    policy on every base, lifted only by waiving the class'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#Clarifications
    files:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/src/sbpl.rs
- id: component.receipt
  name: Cage plan (degradations) and run receipt (RunFacts::with_approximation) that list accepted approximations
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#User-Story-2
    files:
    - crates/procage/src/receipt.rs
dataflows:
- id: flow.approximation
  name: An accepted proc-other-processes approximation is listed in the plan and the receipt
  source: component.proc-reach
  destination: component.receipt
  assets:
  - asset.process-secrets
  attributes:
    crosses: []
- id: flow.claims
  name: The docs tell the consumer that the class closes R-25 on macOS unless waived, the Linux default, and what
    the approximation leaves open
  source: component.docs
  destination: actor.consumer
  assets:
  - asset.process-secrets
  attributes:
    crosses: []
- id: flow.confine
  name: The process-access class confines the child on macOS on every base and preset
  source: component.process-access-class
  destination: tz.cage
  assets:
  - asset.base
  - asset.process-secrets
  attributes:
    crosses:
    - tz.harness
    - tz.cage
- id: flow.exposure
  name: The kernel hands other processes' arguments and environment to the child
  source: tz.others
  destination: tz.cage
  assets:
  - asset.process-secrets
  attributes:
    crosses:
    - tz.others
    - tz.cage
- id: flow.kill
  name: The harness kills every process of the run when it ends
  source: component.lifetime
  destination: tz.cage
  assets:
  - asset.lifetime
  attributes:
    crosses:
    - tz.harness
    - tz.cage
- id: flow.measure
  name: The canaries and the program set measure the class's rule and the Linux refusal on each lane
  source: component.canaries
  destination: component.process-access-class
  assets:
  - asset.base
  - asset.compat
  attributes:
    crosses: []
- id: flow.policy-in
  name: The consumer's Linux policy (file rules, raw Landlock rules, grants) and accepted approximations enter the
    lowering
  source: actor.consumer
  destination: component.proc-reach
  assets:
  - asset.process-secrets
  - asset.compat
  attributes:
    crosses: []
- id: flow.presets
  name: The preset fixtures pin the class's rules in every preset version
  source: component.preset-fixtures
  destination: component.process-access-class
  assets:
  - asset.base
  attributes:
    crosses: []
- id: flow.procfs
  name: The child lists /proc and reads cmdline and environ of other processes
  source: tz.cage
  destination: tz.os
  assets:
  - asset.process-secrets
  attributes:
    crosses:
    - tz.cage
    - tz.os
- id: flow.sysctl
  name: The child queries sysctls by name or numeric MIB and process information of other processes (KERN_PROCARGS2,
    pidinfo)
  source: tz.cage
  destination: tz.os
  assets:
  - asset.process-secrets
  - asset.compat
  attributes:
    crosses:
    - tz.cage
    - tz.os
threats:
- id: threat.allowlist-widening
  name: A contributor widens the V4 allowlist to make a program work (a kern. or kern.proc prefix without the dot,
    a regular expression, an unjustified entry, or a broad process-info allow), re-admitting KERN_PROCARGS or KERN_PROCARGS2
  categories:
  - Elevation of Privilege
  - Information Disclosure
  risk:
    comment: prefixes are allowed now, and one short prefix (kern.) was measured to reopen the read
    impact: 90
    likelihood: 30
  attributes:
    source: research.md
    assets:
    - asset.base
    - asset.process-secrets
    status: retired
    actor: actor.contributor
    constitution: VII. A library, not a harness (presets are versioned and frozen)
    elements:
    - component.process-access-class
    profile: stride
    retired_reason: 'Session 2026-11-02 (no release users yet): the fix went in place into the process-access class;
      there is no base V4 and no sysctl allowlist to widen. Weakening the class''s rule is threat.rule-weakened.'
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.linux-root-refused
  name: Existing policies change behaviour after the upgrade (on Linux a rule or grant on / or /proc is refused;
    on macOS a run that reads other processes is refused on every base and preset), so consumers break, or accept
    proc-other-processes or waive process-access reflexively without seeing the exposure
  categories:
  - Denial of Service
  - Information Disclosure
  risk:
    comment: read grants on / are common in existing policies and tests
    impact: 50
    likelihood: 50
  attributes:
    source: plan.md#Summary
    assets:
    - asset.compat
    - asset.process-secrets
    status: mitigated
    actor: actor.consumer
    constitution: VII. A library, not a harness (breaking changes ship with a migration note)
    elements:
    - component.proc-reach
    - component.process-access-class
    - component.docs
    - flow.policy-in
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.nc-default-base
  name: '[NEEDS CLARIFICATION: do the default presets move to the V4 base, or must callers opt in to it, leaving
    R-25 open on macOS for every cage that does not?]'
  categories:
  - Information Disclosure
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.process-secrets
    - asset.base
    status: retired
    actor: actor.consumer
    disposition: needs-clarification
    elements:
    - component.process-access-class
    profile: stride
    retired_reason: 'Superseded by Session 2026-11-02 (no release users yet): the fix went in place into the process-access
      class of every policy: there is no V4 base to opt in to; every base and preset closes the read unless the
      class is waived.'
    severity: unrated
    technique: sensitive-data-exposure
- id: threat.nc-pid-one
  name: '[NEEDS CLARIFICATION: who is PID 1 of the new T1 namespace (the target or a minimal init prepared in the
    parent), and how are orphans reaped and termination signals delivered to it?]'
  categories:
  - Denial of Service
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.lifetime
    status: retired
    actor: actor.caged-code
    disposition: needs-clarification
    elements:
    - component.lifetime
    profile: stride
    retired_reason: 'Clarification 2026-11-02: no PID namespace and no PID 1 in this change.'
    severity: unrated
    technique: broken-access-control
- id: threat.numeric-unnamed-sysctl
  name: A query the child makes by numeric MIB is matched differently from its name (an exact sysctl-name filter
    does not match KERN_PROCARGS2 by number), so a rule that reads right lets other processes' arguments through
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    comment: 'measured on macOS 26.6.2: a prefix matches the numeric call, an exact name does not'
    impact: 70
    likelihood: 25
  attributes:
    source: research.md
    assets:
    - asset.process-secrets
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.process-access-class
    - flow.sysctl
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.pidns-lifetime
  name: The PID namespace changes how the run is tracked and killed (namespace-relative pids, orphans reparented
    inside it, signals to its init ignored), so a descendant outlives the run (R-23) or zombies pile up
  categories:
  - Elevation of Privilege
  - Denial of Service
  risk:
    comment: an outliving descendant runs on after the harness believes the run ended
    impact: 90
    likelihood: 30
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.lifetime
    status: retired
    actor: actor.caged-code
    constitution: V. Hygiene by default
    elements:
    - component.lifetime
    - flow.kill
    profile: stride
    retired_reason: 'Clarification 2026-11-02: no PID namespace in this change, so run tracking and killing are
      unchanged.'
    severity: medium
    technique: broken-access-control
- id: threat.prefix-future-name
  name: Every base still allows sysctl-read outside the kern.procargs prefix, so a sysctl a later macOS release
    adds (or one not yet known) that returns other processes' arguments or environment is admitted
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    comment: Apple has added process sysctls before; the canaries probe the queries known today
    impact: 90
    likelihood: 20
  attributes:
    source: research.md
    assets:
    - asset.process-secrets
    - asset.base
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.process-access-class
    - flow.sysctl
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.proc-reach-bypass
  name: The /proc reach check misses a rule or grant that reaches other processes (a symbolic link or bind mount
    to /proc, a raw Landlock rule, a glob, a grant bound at spawn), or the /proc/self carve-out resolves to a process
    other than the child, so the read is silent
  categories:
  - Information Disclosure
  - Elevation of Privilege
  cwes:
  - CWE-22
  - CWE-59
  risk:
    comment: lexical path checks and magic links are easy to get wrong
    impact: 80
    likelihood: 30
  attributes:
    source: plan.md#Summary
    assets:
    - asset.process-secrets
    status: mitigated
    actor: actor.consumer
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.proc-reach
    - flow.policy-in
    - flow.procfs
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.procargs-variant
  name: On any base the child reads another process's arguments or environment through a query the class's rule
    does not cover (KERN_PROCARGS by numeric MIB, a pidinfo flavour, a pidinfo of a process outside the sandbox),
    stealing tokens
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  - CWE-214
  risk:
    comment: the unmediated query is a known, one-call read; sibling queries are an obvious next try
    impact: 90
    likelihood: 50
  attributes:
    source: research.md
    assets:
    - asset.process-secrets
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.process-access-class
    - flow.sysctl
    - flow.exposure
    profile: stride
    severity: high
    technique: sensitive-data-exposure
- id: threat.program-set-gap
  name: The class's new rules break a program of the base program set or a frozen preset (a tool that reads its
    own or a sibling's process information, ps of the run), pushing consumers to waive process-access
  categories:
  - Denial of Service
  risk:
    comment: the early pidinfo deny is quiet and Seatbelt does not log sysctl-read denials, so a break shows only
      as a failing tool
    impact: 50
    likelihood: 50
  attributes:
    source: spec.md#User-Story-1
    assets:
    - asset.compat
    - asset.base
    status: mitigated
    actor: actor.consumer
    elements:
    - component.process-access-class
    - component.canaries
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.rule-weakened
  name: A contributor weakens the process-access class's rule to make a program work (an exact sysctl-name instead
    of the kern.procargs prefix, which the numeric call does not match; a filtered or dropped early pidinfo deny;
    a pidinfo allow beyond same-sandbox; a new unfiltered allow), re-admitting KERN_PROCARGS2 on every base and
    preset
  categories:
  - Elevation of Privilege
  - Information Disclosure
  risk:
    comment: 'the measured shapes are non-obvious: the exact name looks right and does not hold'
    impact: 90
    likelihood: 30
  attributes:
    source: research.md
    assets:
    - asset.base
    - asset.process-secrets
    status: mitigated
    actor: actor.contributor
    constitution: VII. A library, not a harness (presets are versioned and frozen)
    elements:
    - component.process-access-class
    - component.preset-fixtures
    - flow.presets
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.stale-proc-view
  name: 'On T1 the child still sees other processes: the target runs outside the new PID namespace (unshare without
    a fork), /proc is mounted from the old namespace, or another proc mount stays reachable'
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    comment: the order of unshare, fork and mount is easy to get wrong; a leftover mount defeats it silently
    impact: 90
    likelihood: 40
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.process-secrets
    status: retired
    actor: actor.caged-code
    elements:
    - flow.procfs
    profile: stride
    retired_reason: 'Clarification 2026-11-02: no PID namespace in this change; Linux /proc reach is an approximation
      by name on both tiers (threat.t2-silent-proc). The PID namespace component was dropped from the model.'
    severity: high
    technique: sensitive-data-exposure
- id: threat.status-overclaim
  name: The docs or the threat model present R-25 as closed for a run with process-access waived or a Linux cage
    with proc-other-processes accepted, or omit the documented limits, so a consumer passes secrets in arguments
    it believes hidden
  categories:
  - Repudiation
  risk:
    comment: one status per class hides per-platform, per-waiver and per-approximation differences
    impact: 60
    likelihood: 40
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.process-secrets
    status: mitigated
    actor: actor.contributor
    constitution: III. The kernel is the oracle
    elements:
    - component.docs
    - flow.claims
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.t2-silent-proc
  name: On Linux T1 or T2 a policy whose rules or grants reach /proc (literally, through an ancestor such as /,
    a symbolic link, a raw Landlock rule or a glob) runs without the caller accepting proc-other-processes, so other
    processes' command lines are readable silently
  categories:
  - Information Disclosure
  - Elevation of Privilege
  risk:
    comment: read grants on / are common, and without a PID namespace T1 sees every process of the user
    impact: 80
    likelihood: 50
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.process-secrets
    status: mitigated
    actor: actor.consumer
    constitution: I. Fail closed, never silently weaker
    elements:
