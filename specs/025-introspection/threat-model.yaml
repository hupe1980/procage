    - crates/procage/tests/escape_linux.rs
- id: mitigation.program-set-v4
  name: The base program set and the escape suite run with the class in force; the run's own and its children's
    arguments and process information stay readable (same-sandbox allow); ps (setuid, refused in any cage) and pgrep
    (needs sysmond) are documented limits
  riskReduction: 75
  attributes:
    threats:
    - threat.program-set-gap
    status: required
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - crates/procage/tests/spawn_macos.rs
    - crates/procage/tests/escape_macos.rs
    - site/content/docs/macos.md
requirements:
- id: SR-001
  statement: On macOS, on every base, the process-access class MUST refuse with EPERM the child's reads of the arguments,
    environment and process information of any process outside the run (KERN_PROCARGS2 and KERN_PROCARGS by numeric
    MIB, pidinfo), while its reads of its own and its children's MUST succeed; waiving the class MUST lift the refusal.
  priority: P1
  mitigations:
  - mitigation.deny-then-name
  acceptance:
  - given: a same-user process outside the run and a child on the default policy
    then: each read fails with EPERM
    when: the child reads that process's KERN_PROCARGS2, KERN_PROCARGS and pidinfo by numeric call
  - given: the same child with a child of its own
    then: every read succeeds
    when: it reads its own and its child's KERN_PROCARGS2 and pidinfo
  - given: the same policy with HardDenyClass::ProcessAccess waived
    then: it succeeds
    when: the child reads the other process's KERN_PROCARGS2
  tasks: []
- id: SR-002
  statement: The process-access class MUST add exactly (deny sysctl-read (sysctl-name-prefix "kern.procargs")),
    the quiet early unfiltered (deny process-info-pidinfo) and (allow process-info-pidinfo (target same-sandbox))
    and MUST allow nothing else; the preset profiles v1 to v3 MUST change only by these three lines, pinned by their
    fixtures.
  priority: P1
  mitigations:
  - mitigation.literal-allowlist
  acceptance:
  - given: the empty policy
    then: the only allow is (allow process-info-pidinfo (target same-sandbox))
    when: it is lowered for macOS
  - given: the reference policies
    then: the same-sandbox pidinfo allow is the only allow without a policy rule
    when: every allow is traced to its source
  - given: every preset version v1 to v3
    then: it equals its fixture, which contains the prefix deny, the early pidinfo deny and the same-sandbox allow
    when: it is lowered
  tasks: []
- id: SR-003
  statement: The R-25 canaries MUST run on the default policy and MUST fail, never skip, when another process's
    arguments are readable, in every just escape variant and on every macOS lane; the macOS 27 lane MUST re-measure
    the rule when it exists.
  priority: P1
  mitigations:
  - mitigation.measure-before-freeze
  acceptance:
  - given: every just escape variant (default, with reporting, base V3 with reporting)
    then: it passes, and it is not ignored
    when: r25_other_processes_arguments_are_unreadable runs
  - given: a lane where the read succeeds
    then: it fails the lane
    when: the canary runs
  tasks: []
- id: SR-004
  statement: On Linux (T1 and T2) the base and every preset MUST grant nothing under /proc beyond /proc/self and
    /proc/thread-self, so on the default policy a child's read of another process's cmdline or environ MUST be denied.
  priority: P1
  mitigations:
  - mitigation.no-default-proc
  acceptance:
  - given: Linux T1 or T2, the base policy and a same-user process outside the run
    then: both reads are denied
    when: the child reads that process's cmdline and environ
  - given: every preset version v1 to v3 on T1 and T2
    then: none names proc-other-processes
    when: its rules are lowered
  tasks: []
- id: SR-005
  statement: With the class in force the run's own processes MUST stay readable (the pidinfo allow is same-sandbox,
    not self and children) and the base program set MUST work as before; ps (setuid, refused in any cage) and pgrep
    (needs sysmond) MUST be documented as limits.
  priority: P2
  mitigations:
  - mitigation.program-set-v4
  acceptance:
  - given: a child on the default policy with a child of its own
    then: every read succeeds
    when: it reads its own and its child's arguments and pidinfo
  - given: the base program set
    then: every program works as before
    when: it runs with the class in force
  - given: the macOS docs
    then: they state what of ps of the run works and the ps and pgrep limits
    when: they describe R-25
  tasks: []
- id: SR-006
  statement: On Linux T1 and T2 a policy whose file rule, raw Landlock rule or glob reaches /proc other than /proc/self
    and /proc/thread-self (literally, through an ancestor such as /, or through a symbolic link resolved at cage
    creation), or a grant whose resolved path does at spawn, MUST be refused naming proc-other-processes unless
    the caller accepts it by name; an accepted rule MUST be listed in the plan and an accepted grant in the run's
    receipt, which is then not enforced as written; other processes' environ MUST stay unreadable.
  priority: P1
  mitigations:
  - mitigation.proc-gap
  acceptance:
  - given: T1 or T2 and a rule on /proc
    then: it is refused naming proc-other-processes
    when: the cage is made without the approximation
  - given: the approximation accepted by name
    then: environ is refused, cmdline is readable (the residual), its own environ is readable, and the plan lists
      the approximation
    when: the child reads another process's environ and cmdline and its own environ
  - given: a rule on a symbolic link to /proc
    then: it is refused naming the construct, then made with the approximation in the plan
    when: the cage is made without, then with the approximation
  - given: a grant bound at spawn to a symbolic link to /proc
    then: the spawn is refused naming the construct, then the receipt lists the approximation and enforced_as_written
      is false
    when: the run is spawned without, then with the approximation
  tasks: []
- id: SR-007
  statement: 'THREAT_MODEL MUST mark R-25 mitigated with per-platform text (macOS: the class on every base, lifted
    by waiving it; Linux: no /proc by default, the approximation by name with its residual), the site docs MUST
    say the same, and the CHANGELOG MUST carry the migration notes (macOS: waive ProcessAccess; Linux: allow ProcOtherProcesses).'
  priority: P2
  mitigations:
  - mitigation.per-platform-status
  acceptance:
  - given: THREAT_MODEL, the crate docs and the site
    then: they give the macOS class and its waiver, the Linux default and the residual with the approximation, and
      no base or preset that does not exist
    when: they describe R-25
  - given: the CHANGELOG
    then: it lists the macOS refusal under Security and the Linux approximation under Changed, each with its migration
    when: the release is cut
  tasks: []
