threats:
- id: threat.binary-substitution
  name: The loader picks the native addon from an environment variable, the working directory or a search path,
    so whoever controls those loads their own code into the agent process in place of the sandbox
  categories:
  - Elevation of Privilege
  risk:
    impact: 90
    impactComment: arbitrary native code in the agent process; no cage
    likelihood: 30
    likelihoodComment: generated loaders offer an override path through the environment
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.host
    - asset.wheel
    status: mitigated
    actor: actor.supply-chain
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.wrapper
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.env-leak
  name: The binding copies process.env (or the caller's whole environment) into the command as explicit variables,
    which procage always keeps, so secrets in the environment reach the cage past the allowlist
  categories:
  - Information Disclosure
  risk:
    impact: 90
    impactComment: tokens and keys in the environment reach the caged code
    likelihood: 50
    likelihoodComment: spreading process.env is the child_process habit
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.host
    status: mitigated
    actor: actor.contributor
    constitution: V. Hygiene by default
    disposition: threat
    elements:
    - component.wrapper
    - flow.spawn
    profile: stride
    severity: high
    technique: sensitive-data-exposure
- id: threat.gil-starvation
  name: A blocking spawn, wait or read runs on the event loop thread, so the whole Node process stalls while one
    command runs
  categories:
  - Denial of Service
  risk:
    impact: 30
    impactComment: other tool calls stall; no confinement is lost
    likelihood: 40
    likelihoodComment: a synchronous binding call is the simplest to write
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.policy
    status: mitigated
    actor: actor.contributor
    disposition: threat
    elements:
    - component.native
    profile: stride
    severity: low
    technique: resource-exhaustion
- id: threat.orphaned-run
  name: A run outlives its JavaScript object or the process (collection deferred, exit skipping finalisers, an aborted
    request), so caged processes keep running unowned
  categories:
  - Elevation of Privilege
  risk:
    impact: 60
    impactComment: caged code keeps running after the agent stopped
    likelihood: 40
    likelihoodComment: V8 does not finalise objects at exit
  attributes:
    source: spec.md#US1
    assets:
    - asset.host
    status: mitigated
    actor: actor.caged-code
    constitution: V. Hygiene by default
    disposition: threat
    elements:
    - component.wrapper
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.python-in-child
  name: JavaScript runs in the child between fork and exec (a callback across the fork), or the spawn runs on the
    event loop thread
  categories:
  - Elevation of Privilege
  risk:
    impact: 80
    impactComment: code runs uncaged in the child or the spawn hangs
    likelihood: 25
    likelihoodComment: a callback option is tempting
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.host
    status: mitigated
    actor: actor.contributor
    constitution: IV. Syscalls only between fork and exec
    disposition: threat
    elements:
    - component.native
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.silent-weakening
  name: 'The binding loosens what the caller asked: an unknown or misspelt field is dropped, a gap is ignored, or
    a default policy allows more than the Rust default'
  categories:
  - Elevation of Privilege
  risk:
    impact: 85
    impactComment: the cage is weaker than the policy the caller wrote
    likelihood: 35
    likelihoodComment: dict-to-struct glue often ignores unknown keys
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.policy
    - asset.host
    status: mitigated
    actor: actor.contributor
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.native
    - flow.spawn
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.untested-wheel
  name: A binary is published for a platform where the binding was never run against the kernel, or the docs claim
    more than the tests show
  categories:
  - Repudiation
  risk:
    impact: 60
    impactComment: users rely on a sandbox nobody measured there
    likelihood: 40
    likelihoodComment: cross-built wheels are easy to add
  attributes:
