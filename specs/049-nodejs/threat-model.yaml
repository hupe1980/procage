    status: verified
    kind: preventive
    requirements:
    - SR-008
    touchpoints:
    - bindings/nodejs/index.js
- id: mitigation.release-gil
  name: Spawn, wait and reads run on the libuv thread pool
  riskReduction: 80
  attributes:
