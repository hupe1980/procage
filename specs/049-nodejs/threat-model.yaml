    status: verified
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - bindings/nodejs/src/lib.rs
- id: mitigation.rust-spawn
  name: Spawning is the Rust child sequence on a worker thread; the binding exposes no hook that runs in the child
  riskReduction: 95
  attributes:
    threats:
    - threat.python-in-child
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - bindings/nodejs/src/lib.rs
- id: mitigation.same-semantics
  name: Policies come only through the Rust presets and the versioned format, which refuses unknown fields; every
    Rust error becomes a typed exception; no binding default differs from Rust
  riskReduction: 90
  attributes:
    threats:
    - threat.silent-weakening
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - bindings/nodejs/src/lib.rs
    - bindings/nodejs/index.js
- id: mitigation.tested-wheels
  name: Each published platform runs the escape subset and the example from the packed package, on the kernel, in
    CI
  riskReduction: 85
  attributes:
    threats:
    - threat.untested-wheel
    status: verified
    kind: detective
    requirements:
    - SR-006
    touchpoints:
    - bindings/nodejs/build.sh
    - bindings/nodejs/test/procage.test.js
    - .github/workflows/ci.yml
- id: mitigation.trusted-publishing
  name: The package is built from the tag by pinned actions and published with npm Trusted Publishing and provenance
    from a protected environment; no stored token
  riskReduction: 85
  attributes:
    threats:
    - threat.wheel-tampering
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - .github/workflows/release.yml
requirements:
- id: SR-001
  statement: The binding MUST NOT copy process.env into the command; only variables passed in env are set explicitly,
    and the policy environment rules decide the rest.
  priority: P1
  mitigations:
  - mitigation.explicit-env
  acceptance:
  - given: a secret variable in process.env and a preset policy
    then: the secret is absent
    when: a caged command prints its environment
  - given: the same and env naming one variable
    then: that variable is present and the secret absent
    when: the command prints its environment
  tasks: []
- id: SR-002
  statement: The binding MUST NOT run JavaScript in the child between fork and exec, and MUST spawn off the event
    loop thread.
  priority: P1
  mitigations:
  - mitigation.rust-spawn
  acceptance:
  - given: many concurrent runs started from one event loop
    then: every spawn completes
    when: they all run
  tasks: []
- id: SR-003
  statement: A policy MUST reach the cage only through the presets or the versioned format, an unknown field or
    invalid value MUST throw PolicyError, a gap MUST throw CapabilityGapError with the gaps, and the binding MUST
    add no default the Rust API does not have.
  priority: P1
  mitigations:
  - mitigation.same-semantics
  acceptance:
  - given: a JSON policy with an unknown field
    then: PolicyError is thrown
    when: Policy.fromJSON is called
  - given: a policy the host cannot enforce
    then: CapabilityGapError is thrown with the gaps
    when: a Cage is made
  tasks: []
- id: SR-004
  statement: Every process of a run MUST be killed when it is killed, disposed, aborted, timed out, collected, or
    the Node process exits.
  priority: P1
  mitigations:
  - mitigation.end-on-release
  acceptance:
  - given: a running command and an AbortSignal
    then: its processes are dead
    when: the signal aborts
  - given: a running command when the Node process exits
    then: its processes are dead
    when: the process exits
  tasks: []
- id: SR-005
  statement: The package MUST be built from the tagged commit by actions pinned to full SHAs and published with
    npm Trusted Publishing and provenance from a protected environment, with no stored token.
  priority: P1
  mitigations:
  - mitigation.trusted-publishing
  acceptance:
  - given: the release workflow
    then: every action is SHA-pinned and the publish job uses OIDC in the npm environment with provenance
    when: the workflows gate runs
  tasks: []
- id: SR-006
  statement: Every published platform MUST run the escape subset and the shell tool example from the packed package
    on its CI lane, and the docs MUST claim no platform beyond them.
  priority: P2
  mitigations:
  - mitigation.tested-wheels
  acceptance:
  - given: each platform lane
    then: reads and writes outside the workspace, secrets and the network are refused and the example runs
    when: the Node tests run against the installed package
  tasks: []
- id: SR-007
  statement: Spawn, wait and the reading of output MUST NOT block the event loop.
  priority: P3
  mitigations:
  - mitigation.release-gil
  acceptance:
  - given: a run of one second
    then: it fires on time
    when: a timer is due meanwhile
  tasks: []
- id: SR-008
  statement: The package MUST load its native addon only from its own directory by a fixed name for the host platform,
    ignoring environment variables and the working directory, and MUST throw a typed error on an unsupported platform.
  priority: P1
  mitigations:
  - mitigation.fixed-loader
  acceptance:
  - given: an environment variable naming another addon
    then: the packaged addon is loaded
    when: the package is imported
  - given: an unsupported platform
    then: it throws UnsupportedError naming the platform
    when: the package is imported
  tasks: []
