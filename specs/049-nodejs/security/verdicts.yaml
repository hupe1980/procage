verdicts:
  - requirement: SR-001
    verdict: verified
    method: test
    evidence: bindings/nodejs/test/procage.test.js::escape subset::process.env is not copied
    result: pass
    justification: With a secret in process.env and env naming one variable, a caged env prints that variable and not the secret, on macOS and Linux T1 and T2 from the packed package; the addon sets only env entries.
  - requirement: SR-002
    verdict: verified
    method: test
    evidence: bindings/nodejs/test/procage.test.js::concurrency::many runs at once, and the event loop stays free
    result: pass
    justification: Six runs started from one event loop complete together; spawn is an AsyncTask on the libuv pool through procage's Rust child sequence, and the API has no hook that runs in the child.
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: bindings/nodejs/test/procage.test.js::policies::a gap throws with the gaps
    result: pass
    justification: Unknown fields, unknown presets, bad versions, relative workspaces and unknown relaxations throw PolicyError; a gap throws CapabilityGapError (instanceof ProcageError) with gaps; the Linux test shows the accepting option named without being applied.
  - requirement: SR-004
    verdict: verified
    method: test
    evidence: bindings/nodejs/test/procage.test.js::lifetime::aborting ends the run
    result: pass
    justification: Timeout, AbortSignal, Symbol.asyncDispose and the exit of a child Node process each leave the run's process dead; collection drops the Child through the addon's finaliser.
  - requirement: SR-005
    verdict: implemented-unverified
    method: review
    evidence: .github/workflows/release.yml:142
    result: inconclusive
    justification: The node and npm jobs use SHA-pinned actions, test each addon from a packed package, check the tag and the three addons, pack with the contents check and run npm publish --provenance with id-token write in the npm environment and no token; not yet run, and npm's trusted publisher for procage must name release.yml and the npm environment.
  - requirement: SR-006
    verdict: implemented-unverified
    method: review
    evidence: .github/workflows/ci.yml:112
    result: inconclusive
    justification: Every facts lane runs bindings/nodejs/build.sh all (build, pack with the contents check, 25 tests and the example from the tarball; Node 22 on Linux, 26 on macOS); passed locally on macOS and Linux T1 and T2, not yet on the CI lanes.
  - requirement: SR-007
    verdict: verified
    method: test
    evidence: bindings/nodejs/test/procage.test.js::concurrency::many runs at once, and the event loop stays free
    result: pass
    justification: While six one-second runs proceed, a 20 ms interval never waits more than 500 ms; wait, output and violations are AsyncTasks on the pool.
  - requirement: SR-008
    verdict: verified
    method: test
    evidence: bindings/nodejs/test/procage.test.js::loader::loads the packaged addon whatever the environment says
    result: pass
    justification: With NAPI_RS_NATIVE_LIBRARY_PATH set to another path the import loads the packaged addon; the loader builds the file name from platform and arch beside index.js and throws UnsupportedError on any other platform or without glibc.
