requirements:
- id: SR-001
  statement: Every path, name and pattern text emitted into SBPL MUST pass through the one quoting function or be
    passed as a named parameter; the function MUST escape backslash and quote and MUST refuse NUL, control characters
    and invalid UTF-8 with a typed error, and every accepted value MUST decode back to the exact input.
  priority: P1
  mitigations:
  - mitigation.single-escaper
  acceptance:
  - given: a subtree named /tmp/a"b\c(d)
    then: the profile holds one subtree rule whose quoted string decodes to exactly those bytes and adds no other
      syntax
    when: the policy is lowered for macOS
  - given: a path containing a newline or a non-UTF-8 byte
    then: lowering fails with a typed error and the path is not altered or dropped
    when: it is lowered for macOS
  - given: at least 10,000 generated byte strings and the fuzz corpus
    then: each result either decodes to its input or is refused
    when: each is quoted
  tasks: []
- id: SR-002
  statement: Literal, subtree and glob MUST be distinct kinds chosen by the author; a glob MUST lower to one anchored
    pattern in which every non-glob character is escaped, and unsupported wildcard syntax MUST be refused.
  priority: P1
  mitigations:
  - mitigation.typed-patterns
  acceptance:
  - given: a subtree whose name contains * ? [ ] . + ( ) |
    then: it is emitted as a subtree, not a pattern
    when: it is lowered for macOS
  - given: the glob /work/**/*.rs
    then: the result is one pattern anchored at both ends with the dot escaped
    when: it is lowered for macOS
  - given: a glob containing [ or {
    then: it is refused with a typed error
    when: it is constructed
  tasks: []
- id: SR-003
  statement: A policy path MUST be exact bytes of an absolute, lexically normal path; empty, relative, tilde, dot,
    dot-dot, empty-component, trailing-slash and NUL inputs MUST be refused with typed errors and nothing is silently
    resolved.
  priority: P1
  mitigations:
  - mitigation.abs-path-validation
  acceptance:
  - given: relative/dir, ~/dir, /a/../b, /a//b, /a/ or a NUL byte
    then: each is refused with an error naming its reason
    when: each is used as a policy path
  - given: a valid path with non-UTF-8 bytes
    then: the bytes are identical
    when: it is stored and read back
  tasks: []
- id: SR-004
  statement: No value of the Seatbelt layer, including deserialised values, MUST be able to produce (with no-sandbox),
    (with no-profile) or any modifier other than the run tag; operation names outside the closed list MUST be accepted
    only behind the unstable option and only if they match [a-z0-9*-]+; grant and parameter names MUST be short
    identifiers.
  priority: P1
  mitigations:
  - mitigation.closed-raw-layer
  acceptance:
  - given: an unstable operation name containing a parenthesis, space or quote
    then: it is refused
    when: it is constructed or read from a document
  - given: every operation in the closed list
    then: each compiles
    when: each is compiled through libsandbox on the development Mac
  - given: a grant name containing a quote, space or slash
    then: it is refused
    when: it is constructed
  tasks: []
- id: SR-005
  statement: Lowering MUST return the complete list of capability gaps for constructs the target cannot express
    exactly; an approximation MUST be accepted only when the caller allowed that construct by name and MUST then
    be listed as a degradation in the plan; tier T2 with a Landlock version below 4 MUST be refused and no other
    tier substituted.
  priority: P1
  mitigations:
  - mitigation.typed-gaps
  acceptance:
  - given: a policy with a protect rule and a glob rule
    then: lowering fails listing both gaps with construct, target and tier
    when: it is lowered for Linux T2 without allowed degradations
  - given: a single-file rule and the single-file approximation allowed by name
    then: a plan is returned and its degradations name that construct
    when: it is lowered for Linux
  - given: tier T2 with Landlock version 3
    then: it fails with a typed tier error and returns no plan
    when: lowering runs
  tasks: []
- id: SR-006
  statement: The lowering table published in the crate docs MUST be the fixture of a test that lowers each construct
    for each target and asserts the stated outcome.
  priority: P2
  mitigations:
  - mitigation.table-as-fixture
  acceptance:
  - given: a row of the table changed without a matching change to lowering (or the reverse)
    then: they fail naming the construct and target
    when: the tests run
  tasks: []
- id: SR-007
  statement: Every plan MUST place allows first, then protect and hide rules, then the hard-deny tier last, regardless
    of input order, and MUST list every hard-deny waiver; a waiver MUST name a known class.
  priority: P1
  mitigations:
  - mitigation.fixed-precedence
  acceptance:
  - given: any reference policy with its rules shuffled
    then: the profile is byte-identical and its last rules are the hard-deny tier
    when: it is lowered for macOS
  - given: a policy waiving one hard-deny class by name
    then: that class is absent and the plan lists the waiver
    when: it is lowered
  tasks: []
- id: SR-008
  statement: The limits guard MUST only apply rewrites that match exactly the same requests and MUST never broaden
    an allow.
  priority: P1
  mitigations:
  - mitigation.exact-rewrite-only
  acceptance:
  - given: generated profiles and at least 10,000 generated requests
    then: every decision is identical
    when: guarded and unguarded profiles are evaluated by the reference evaluator
  tasks: []
- id: SR-009
  statement: Lowering for macOS MUST fail with a typed limit error naming the limit and the count when the profile
    exceeds the configured rule limit, and MUST emit a quoted value over the inline cap as a named parameter whose
    exact value the plan carries.
  priority: P2
  mitigations:
  - mitigation.limits-and-params
  acceptance:
  - given: a policy one rule over the configured limit
    then: it fails naming the limit and the count
    when: it is lowered for macOS
  - given: a path whose quoted form is longer than 1016 bytes
    then: the profile references a parameter and the plan holds the exact path bytes
    when: it is lowered for macOS
  tasks: []
- id: SR-010
  statement: The data format MUST be versioned, MUST refuse unknown fields, MUST apply every constructor check on
    reading, and reading and lowering MUST never panic on any input.
  priority: P1
  mitigations:
  - mitigation.strict-format
  acceptance:
  - given: a document with an unknown field
    then: reading fails naming the field
    when: it is read
  - given: a document with a relative path or a malformed glob
    then: reading fails with the constructor's error
    when: it is read
  - given: the fuzz targets for reading and lowering
    then: no panic occurs and every accepted document round-trips
    when: each runs at least 60 seconds
  tasks: []
- id: SR-011
  statement: Crate docs MUST describe what lowering produces and MUST NOT claim that a profile or plan is enforced;
    the libsandbox compile test MUST be described as a well-formedness check only.
  priority: P2
  mitigations:
  - mitigation.no-enforcement-wording
  acceptance:
  - given: the policy crate docs and the compile test
    then: no sentence states or implies that a child is caged by them
    when: they are reviewed
  tasks: []
