requirements:
- id: SR-001
  statement: A violation MUST be attributed only by the exact marker of a live run of this process on the last line
    of the message; a path containing a newline and another tag MUST stay with the run that caused it.
  priority: P1
  mitigations:
  - mitigation.last-line
  acceptance:
  - given: two runs and a path containing a newline followed by the other run's marker
    then: the violation is in the first run's record with the full path, and not in the other's
    when: the first run is denied that path
  - given: a message whose last line is no live marker
    then: it is ignored
    when: it is parsed
  tasks: []
- id: SR-002
  statement: A run slot MUST NOT be freed before a fence passed after the run ended.
  priority: P1
  mitigations:
  - mitigation.fence-before-free
  acceptance:
  - given: a run denied just before it ends
    then: the denial is in the first record and not in the second
    when: its slot is reused by the next run
  tasks: []
- id: SR-003
  statement: Without reporting the rendered profile MUST equal the lowering fixtures recorded before this feature;
    with reporting only rule messages MUST differ, the run-marker block MUST carry none, and the escape suite MUST
    pass with reporting on.
  priority: P1
  mitigations:
  - mitigation.identical-off
  acceptance:
  - given: every lowering fixture
    then: removing the messages gives the same text, and without reporting it equals the fixture
    when: rendered with and without reporting
  - given: the macOS escape suite
    then: every canary still holds
    when: run with reporting on
  tasks: []
- id: SR-004
  statement: A run record MUST keep at most a fixed number of violations and count the rest; the receiver MUST be
    bounded.
  priority: P2
  mitigations:
  - mitigation.cap
  acceptance:
  - given: more distinct denials than the cap
    then: it holds the cap and counts the dropped ones
    when: the record is read
  tasks: []
- id: SR-005
  statement: A record MUST say complete only after a fence passed after the child exited, and MUST state its coverage
    (off, unavailable with reason, not observed on this platform); docs MUST call reporting best-effort and diagnostic.
  priority: P1
  mitigations:
  - mitigation.honest-record
  acceptance:
  - given: a running child
    then: it is not complete
    when: the record is read
  - given: a cage without reporting, or Linux
    then: coverage says off or not observed, never complete with zero violations as a claim
    when: the record is read
  tasks: []
- id: SR-006
  statement: The helper MUST run absolute /usr/bin/log under /bin/sh, both passing the integrity check (owned by
    root, not group- or world-writable, on a read-only volume), with an empty environment and no inherited descriptors,
    and MUST end when the process that started it dies.
  priority: P2
  mitigations:
  - mitigation.watchdog
  acceptance:
  - given: a process that started the helper
    then: no helper of it remains within a second
    when: it is killed with SIGKILL
  - given: a helper path that fails the integrity check
    then: it runs nothing and coverage is unavailable with the reason
    when: the monitor starts
  tasks: []
- id: SR-007
  statement: Waiting for the helper, a fence or a slot release MUST be bounded; a timeout MUST leave the record
    incomplete instead of blocking.
  priority: P2
  mitigations:
  - mitigation.bounded-waits
  acceptance:
  - given: a helper that never answers
    then: it returns within the limit, incomplete
    when: violations() is called after exit
  tasks: []
verification:
- id: verification.sr-001.2026-11-01
  requirement: SR-001
  method: test
  evidence: crates/procage/src/violation.rs::a_newline_in_the_target_cannot_move_the_violation; crates/procage/tests/spawn_macos.rs::a_newline_in_a_path_stays_with_its_run
  result: pass
  verdict: verified
  justification: The unit test feeds a target containing a newline and another run's marker plus a code and asserts
    the marker is the kernel's last line, the full target is kept and the kind stays NotGranted; other_messages_are_ignored
    rejects messages without a marker line. The caged test is denied a real file named with a newline and a fake
    marker and finds the violation in its own record. The reader routes only to registered markers (violations.rs
    read()).
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
- id: verification.sr-002.2026-11-01
  requirement: SR-002
  method: test
  evidence: crates/procage/tests/spawn_macos.rs::runs_keep_their_own_violations; crates/procage-kernel-facts/tests/kernel_facts.rs::KF-M29
  result: pass
  verdict: verified
  justification: Two concurrent runs keep only their own denials; after both are dropped (kill_all fences before
    freeing the slot, child.rs finish_record) the next run on a freed slot sees none of them. KF-M29 pins the ordering
    the fence relies on (a later process's denial arrives after a run's), 10/10 idle and 8/8 under full CPU load.
    A failed fence retires the slot instead of freeing it.
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
- id: verification.sr-003.2026-11-01
  requirement: SR-003
  method: test
  evidence: crates/procage-policy/tests/violations.rs::reporting_adds_only_messages; crates/procage-policy/tests/violations.rs::the_run_marker_block_carries_no_message;
    crates/procage/tests/escape_macos.rs (PROCAGE_ESCAPE_VIOLATIONS=1)
  result: pass
  verdict: verified
  justification: For every reference policy the profile without reporting has no message, and the reporting profile
    with messages stripped equals it; the preset fixtures and lowering table still pass unchanged; the marker block
    has no message; every reference profile compiles with reporting (policy_compiles); the escape suite passes 23/23
    with reporting on (just escape and a CI step).
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
- id: verification.sr-004.2026-11-01
  requirement: SR-004
  method: test
  evidence: crates/procage/src/violation.rs::the_record_keeps_the_cap_and_counts_the_rest; crates/procage/src/violation.rs::the_receiver_is_bounded_and_never_blocks
  result: pass
  verdict: verified
  justification: With a cap of 3, five pushes keep 3 and count 2 dropped; the receiver holds at most 1,024 and pushing
    past it or after the receiver is dropped never blocks.
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
- id: verification.sr-005.2026-11-01
  requirement: SR-005
  method: test
  evidence: crates/procage/tests/spawn_macos.rs::violations_arrive_while_the_child_runs; crates/procage/tests/spawn_macos.rs::reporting_is_off_by_default;
    crates/procage/tests/native.rs::violation_records_have_the_same_shape
  result: pass
  verdict: verified
  justification: A running child's record is not complete and becomes complete only after kill_all fenced; a cage
    without the option reports Off, empty and not complete; the native test asserts Observed or NotObserved on each
    OS (Linux lane). Crate docs, THREAT_MODEL limits and the site page call reporting diagnostic and best-effort.
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
- id: verification.sr-006.2026-11-01
  requirement: SR-006
  method: test
  evidence: crates/procage/tests/spawn_macos.rs::the_helper_ends_with_its_process; crates/procage/src/macos/violations.rs::user_files_are_not_trusted
  result: pass
  verdict: verified
  justification: A process that started the helper is SIGKILLed and no helper carrying its prefix remains within
    2 s; a user-owned file fails the integrity check (system binaries pass), and start() returns that reason, which
    ensure() turns into Coverage::Unavailable. The helper runs absolute /bin/sh and /usr/bin/log with env_clear
    and std's close-on-exec descriptors.
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
- id: verification.sr-007.2026-11-01
  requirement: SR-007
  method: test
  evidence: crates/procage/src/macos/violations.rs::a_silent_helper_times_out; crates/procage/tests/spawn_macos.rs::a_dead_helper_is_reported_and_restarted
  result: pass
  verdict: verified
  justification: A monitor whose helper never delivers the fence returns None after the 200 ms limit, so violations()
    returns an incomplete record; a helper killed mid-run marks the record Unavailable and incomplete, and the next
    spawn restarts it. violations_of asserts violations() returns within 1 s after exit.
  verified_at: '2026-11-01T05:41:57Z'
  commit: 7b50b8c
