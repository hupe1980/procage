- id: mitigation.strip-equals-v2
  name: Stripping the no-report rules from every V3 profile gives the V2 profile; V1/V2 and presets v1/v2 fixtures
    unchanged; presets v3 fixtures; escape suite with presets v3
  riskReduction: 90
  attributes:
    threats:
    - threat.v3-loosens
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-policy/src/base.rs
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/tests/presets.rs
requirements:
- id: SR-001
  statement: Every V3 profile with its no-report rules removed MUST equal the V2 profile of the same policy, and
    V1, V2 and presets v1/v2 MUST stay byte-identical; the escape suite MUST pass with presets v3.
  priority: P1
  mitigations:
  - mitigation.strip-equals-v2
  acceptance:
  - given: every reference policy on V3
    then: removing the no-report lines gives its V2 profile
    when: its profile is rendered
  - given: the frozen fixtures
    then: V1, V2 and presets v1/v2 match unchanged
    when: the tests run
  tasks: []
- id: SR-002
  statement: The quiet probes MUST be a fixed list, none of which is a target of a hard-deny rule or a data class.
  priority: P2
  mitigations:
  - mitigation.quiet-list
  acceptance:
  - given: the quiet list
    then: no target is shared
    when: compared with every hard-deny and data-class rule
  tasks: []
- id: SR-003
  statement: Quiet denies MUST come before every allow, so access a policy grants is never refused by them.
  priority: P2
  mitigations:
  - mitigation.first
  acceptance:
  - given: base V3 with Tty::Inherit
    then: it succeeds
    when: the child opens /dev/tty
  tasks: []
- id: SR-004
  statement: Violations MUST merge only when pid, process, operation, target and rule are all equal; the repeat
    count MUST saturate.
  priority: P2
  mitigations:
  - mitigation.exact-key
  acceptance:
  - given: violations differing in any one field
    then: they stay separate
    when: pushed
  - given: the same violation pushed repeatedly
    then: one entry with that count
    when: read
  tasks: []
verification:
- id: verification.sr-001.2026-11-01
  requirement: SR-001
  method: test
  evidence: crates/procage-policy/tests/base.rs::v3_is_v2_plus_quiet_denies; crates/procage-policy/tests/presets.rs::every_v3_preset_is_pinned;
    crates/procage/tests/escape_macos.rs (PROCAGE_ESCAPE_BASE=v3)
  result: pass
  verdict: verified
  justification: For every reference policy, the V3 profile minus its three no-report lines equals the V2 profile;
    V1/V2 and presets v1/v2 fixtures pass unchanged; presets v3 are pinned and equal v2 apart from the base; the
    macOS escape suite passes 23/23 on base V3 with reporting.
  verified_at: '2026-11-01T07:09:33Z'
  commit: 2e3e490
- id: verification.sr-002.2026-11-01
  requirement: SR-002
  method: test
  evidence: crates/procage-policy/tests/base.rs::quiet_targets_are_not_hard_deny_targets
  result: pass
  verdict: verified
  justification: No quiet service name or path appears in any hard-deny or data-class rule of the full hard-deny
    policy, and V3 adds exactly three quiet lines from the fixed list (base::MACOS_V3_QUIET_SERVICES, dtracehelper,
    /dev/tty).
  verified_at: '2026-11-01T07:09:33Z'
  commit: 2e3e490
- id: verification.sr-003.2026-11-01
  requirement: SR-003
  method: test
  evidence: crates/procage/tests/spawn_macos.rs::v3_keeps_a_granted_terminal; crates/procage-policy/tests/precedence.rs::blocks_are_in_fixed_order_and_the_tier_is_last
  result: pass
  verdict: verified
  justification: Every quiet deny precedes every allow in every reference profile; with Tty::Inherit the caged open
    of /dev/tty is not refused by the sandbox (ENXIO from the kernel, no EPERM). KF-M30 pins that a later allow
    overrides a no-report deny.
  verified_at: '2026-11-01T07:09:33Z'
  commit: 2e3e490
- id: verification.sr-004.2026-11-01
  requirement: SR-004
  method: test
  evidence: crates/procage/src/violation.rs::only_equal_denials_merge; crates/procage/src/violation.rs::the_record_keeps_the_cap_and_counts_the_rest
  result: pass
  verdict: verified
  justification: Violations differing in pid, process, operation, target or kind stay separate; equal ones merge
    and the count saturates at u32::MAX; past the cap a kept entry keeps counting and a new key is dropped. Caged
    tests show a repeated read as one entry (macOS) and a 20,000-call flood as one entry with 20,000 repeats (Linux
    T1/T2).
  verified_at: '2026-11-01T07:09:33Z'
  commit: 2e3e490
decisions: []
