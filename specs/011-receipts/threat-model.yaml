requirements:
- id: SR-001
  statement: The policy digest MUST be SHA-256 over one canonical encoding of the policy, its versioned serialised
    form (fixed field order, order-insensitive lists sorted, order kept only where it changes meaning, every path
    by its bytes, no omitted defaults), written sha256:<hex>; equal policies MUST have equal digests however they
    were built, and policies that differ in any rule, waiver, base or preset tag MUST have different digests.
  priority: P1
  mitigations:
  - mitigation.canonical-digest
  acceptance:
  - given: two equal policies built with their fs rules, grants and sets in a different order
    then: the digests are equal
    when: both are digested
  - given: a policy and a copy that differs in one path byte, one waiver, the base or the preset tag
    then: the digests differ
    when: both are digested
  - given: a fixture policy with a pinned digest
    then: the digest equals the pinned value
    when: it is digested on every CI lane and after a round trip through the serialised form
  tasks: []
- id: SR-002
  statement: The receipt MUST list every accepted approximation by construct, every fit relaxation with its lift
    and every waived hard-deny class held by the cage's plan, and MUST carry one field that says enforced as written
    only when all three lists are empty.
  priority: P1
  mitigations:
  - mitigation.plan-is-the-source
  acceptance:
  - given: a fitted cage with relaxations, a cage with an accepted approximation and a cage with each waivable class
      waived
    then: the receipt lists exactly the plan's entries and enforced as written is false
    when: a run of each ends
  - given: a cage with none of them
    then: the three lists are empty and enforced as written is true
    when: a run ends
  tasks: []
- id: SR-003
  statement: A receipt reader MUST refuse, with a typed error, a receipt of any version other than the ones it knows
    and a receipt holding any field or value it does not know, in any nested map; it MUST NOT present a receipt
    it only partly understood; older format versions MUST stay readable.
  priority: P1
  mitigations:
  - mitigation.fail-closed-reader
  acceptance:
  - given: a receipt with an added field at the top level, and one in each of backend, violations, exit and a relaxation
    then: it is refused with a typed error
    when: it is read
  - given: a receipt with a relaxation kind or coverage value the reader does not know
    then: it is refused with a typed error
    when: it is read
  - given: a receipt of the next format version
    then: the reader returns an unsupported-version error
    when: it is read
  - given: a receipt of the current format version
    then: it parses with every field intact
    when: it is written and read back
  tasks: []
- id: SR-004
  statement: The violation summary MUST carry the record's coverage, completeness and dropped count; with coverage
    off or unavailable it MUST NOT carry a violation count.
  priority: P1
  mitigations:
  - mitigation.typed-coverage
  acceptance:
  - given: a run with reporting off, and a run where reporting was unavailable
    then: the coverage is off or unavailable and the summary holds no count, so no reader can read zero
    when: their receipts are serialised
  - given: a macOS run whose record dropped reports
    then: the summary carries coverage observed, the dropped count and completeness as the record reports them
    when: its receipt is built
  tasks: []
- id: SR-005
  statement: Without with_policy_in_receipt, the receipt MUST NOT contain environment values, command arguments,
    file contents, policy paths, grant paths, relaxation subjects, violation paths or process names; with it, the
    receipt MUST add only the policy and the relaxation subjects.
  priority: P2
  mitigations:
  - mitigation.field-allowlist
  acceptance:
  - given: a canary string in an environment value, an argument, a policy path, a grant path, a relaxation subject,
      a file the child reads and a path the child is denied
    then: no canary bytes appear in it
    when: the run's receipt is serialised
  - given: the same cage with with_policy_in_receipt
    then: only the policy-path, grant-path and relaxation-subject canaries appear, inside the policy and subject
      fields
    when: the receipt is serialised
  tasks: []
- id: SR-006
  statement: Every receipt field MUST come from the parent's cage and plan, the parent's own host fact reads, the
    kernel's reports and the reaped exit status; strings the caged code controls MUST NOT appear in a receipt.
  priority: P2
  mitigations:
  - mitigation.parent-only-facts
  acceptance:
  - given: a child that names itself and its paths with format-breaking bytes and exits with a chosen code
    then: the exit code is recorded, none of its strings appear, and every other field equals the cage's own values
    when: its receipt is read back
  tasks: []
- id: SR-007
  statement: The child's call sequence between fork and exec MUST be identical with and without receipts; the receipt
    MUST be built in the parent only.
  priority: P2
  mitigations:
  - mitigation.parent-only-facts
  acceptance:
  - given: the multithreaded spawn tests on every lane
    then: they pass, and the child-side code holds no receipt state
    when: they run with receipts
  - given: the spawn benchmark
    then: spawn latency is unchanged within noise
    when: it runs with and without receipts
  tasks: []
- id: SR-008
  statement: Child::receipt MUST return None until the child was reaped, and a receipt MUST carry the violation
    record's own completeness (never complete while the record is open); the exit MUST hold exactly one of code
    and signal, and ended_by_caller MUST be true only when kill_all or dropping the handle signalled the child while
    it was still running.
  priority: P2
  mitigations:
  - mitigation.final-after-reap
  acceptance:
  - given: a running child
    then: None is returned, and after wait the receipt is returned
    when: its receipt is asked for
  - given: runs ended by a normal exit, a signal and a caller kill_all
    then: each holds exactly one of code and signal, and ended_by_caller is true only for the kill_all run
    when: their receipts are read
  - given: a child that has already exited
    then: ended_by_caller is false
    when: kill_all is called and the receipt is taken
  tasks: []
- id: SR-009
  statement: The receipt docs MUST state that a receipt is the caller's own unsigned record and not an attestation,
    that whoever can write where it is kept can change it (so keep it outside every path a later run may write),
    that an empty complete record does not prove nothing was denied, that Cage::exec produces no receipt, that Child::receipt
    is None until the run exits, that it names the OS release and build or kernel release, and that with_policy_in_receipt
    adds every policy path and relaxation subject to each receipt of the cage.
  priority: P1
  mitigations:
  - mitigation.honest-docs
  acceptance:
  - given: the crate docs and the site page on receipts
    then: each states all seven points, and no text calls a receipt proof, attestation or signature
    when: they describe what a receipt proves
  tasks: []
- id: SR-010
  statement: Every receipt MUST name the procage crate version that made it and the per-spawn grant names, sorted,
    and MUST NOT name a grant path unless the policy is included.
  priority: P2
  mitigations:
  - mitigation.run-context-fields
  acceptance:
  - given: a run with two grants activated in either order
    then: procage equals the crate version and grants lists both names sorted, with no path
    when: its receipt is read
  tasks: []
- id: SR-011
  statement: sha2, serde and serde_json MUST come from crates.io, be locked in Cargo.lock with only the features
    the receipt needs, and pass cargo-deny (advisories, yanked, licences, sources) in CI.
  priority: P2
  mitigations:
  - mitigation.pinned-deps
  acceptance:
  - given: the workspace with the receipt dependencies
    then: it passes with no advisory, yanked crate, unlisted licence or non-registry source
    when: just deny runs in the gates lane
  tasks: []
