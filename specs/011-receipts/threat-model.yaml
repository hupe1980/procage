  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: plan.md
    sha256: de46338fc8c0511fa3ec7ae6de200e19b295cb6b712645430fdb1d0faa22790e
  - path: spec.md
    sha256: 368fb7b8f1582ae1b6be092c9d4552f35db81d9b074209a5f62f63d41d7ddfca
