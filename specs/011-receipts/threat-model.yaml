otmVersion: 0.2.0
project:
  id: 011-receipts
  name: Receipts, evidence of how a run was caged
threatspec:
  actors:
  - id: actor.caged-code
    name: Arbitrary code in the caged child, and in later caged runs of the same harness
    trust: untrusted
  - id: actor.consumer
    name: Developer of a harness that spawns cages and stores their receipts
    trust: trusted
  - id: actor.contributor
    name: procage contributor who edits the receipt builder, the encoder, the format or the docs
    trust: semi-trusted
  - id: actor.dependency-publisher
    name: Publisher of a crate procage now depends on (sha2, serde, serde_json)
    trust: untrusted
  - id: actor.reviewer
    name: Auditor or pull-request reviewer who reads a stored receipt after the run
    trust: trusted
  dispositions:
  - disposition: not-applicable
    reason: no authentication surface; a receipt is handed to the caller in-process
    technique: credential-theft
  - disposition: not-applicable
    reason: no authentication or network boundary; procage never sends a receipt anywhere
    technique: identity-spoofing
  - disposition: not-applicable
    reason: no data in transit; the receipt is returned to the caller's own process
    technique: data-tampering-in-transit
  - disposition: no-threat-detected
    reason: 'checked flow.child-output and flow.read: the only child-controlled inputs are the exit status and the
      violation record (covered by threat.child-shaped-fields); Receipt::from_json reads text the harness stored,
      typed through serde with every map refusing unknown fields (covered by threat.unknown-field-dropped and threat.receipt-as-attestation)'
    technique: injection
  - disposition: not-applicable
    reason: single user; a receipt belongs to the run of the caller that spawned it
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: no principals; procage authorises nothing when it builds or reads a receipt
    technique: broken-access-control
  - disposition: no-threat-detected
    reason: 'checked component.format and component.cage-options: reading a receipt never configures or relaxes
      a cage, and with_policy_in_receipt only adds output; a receipt is output only'
    technique: privilege-escalation-via-config
  - disposition: not-applicable
    reason: procage is a library that calls no model and runs no agent; LLM-written code is the adversary inside
      the child, modelled under STRIDE
    technique: prompt-injection-direct
  - disposition: not-applicable
    reason: procage is a library that calls no model and runs no agent; LLM-written code is the adversary inside
      the child, modelled under STRIDE
    technique: prompt-injection-indirect
