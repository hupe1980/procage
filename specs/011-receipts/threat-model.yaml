    actor: actor.consumer
    elements:
    - component.builder
    - flow.serialise
    - flow.store
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.relaxation-omitted
  name: The receipt leaves out an accepted approximation, a fit relaxation or a waived hard-deny class, so a relaxed
    run reads as fully enforced
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 80
    likelihood: 35
  attributes:
    source: spec.md#US2
    assets:
    - asset.receipt
    status: open
    actor: actor.contributor
    constitution: I. Fail closed, never silently weaker (every degradation is recorded in the receipt)
    elements:
    - component.builder
    - flow.serialise
    profile: stride
    severity: high
    technique: missing-audit-trail
- id: threat.unknown-field-dropped
  name: A reader that ignores a field it does not know (a new relaxation kind written by a newer version) reports
    the run as fully enforced
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#US3
    assets:
    - asset.receipt
    status: open
    actor: actor.reviewer
    elements:
    - component.format
    - flow.read
    profile: stride
    severity: high
    technique: missing-audit-trail
- id: threat.unknown-field-rule
  name: '[NEEDS CLARIFICATION: does a reader refuse unknown fields like the policy format (FR-003), or preserve
    or ignore them (US3)? The two requirements disagree]'
  categories:
  - Repudiation
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#US3
    assets:
    - asset.receipt
    status: open
    actor: actor.reviewer
    disposition: needs-clarification
    elements:
    - component.format
    profile: stride
    severity: unrated
    technique: missing-audit-trail
mitigations:
- id: mitigation.canonical-digest
  name: One canonical encoding (fixed field order, sets sorted, paths as bytes, defaults explicit) hashed with SHA-256
    under a format tag and version; property tests and a pinned fixture digest
  riskReduction: 85
  attributes:
    threats:
    - threat.digest-collision
    status: required
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - component.encoder
- id: mitigation.fail-closed-reader
  name: The reader refuses newer versions and never derives enforced-as-written when it meets a field or value it
    does not know
  riskReduction: 80
  attributes:
    threats:
    - threat.unknown-field-dropped
    status: required
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - component.format
- id: mitigation.field-allowlist
  name: The receipt holds only the FR-002 fields, counts instead of violation contents; the policy only on request;
    canary test over every field
  riskReduction: 85
  attributes:
    threats:
    - threat.receipt-leaks-secrets
    status: required
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - component.builder
    - component.format
- id: mitigation.final-after-reap
  name: The final receipt exists only after reaping and a closed record; the partial view is a separate type; exit
    is a typed cause
  riskReduction: 80
  attributes:
    threats:
    - threat.final-state-misstated
    status: required
    kind: preventive
    requirements:
    - SR-008
    touchpoints:
    - component.builder
    - component.record
- id: mitigation.honest-docs
  name: The docs state that a receipt is the caller's unsigned record, where to keep it, what an empty record does
    not prove, and that exec yields none
  riskReduction: 60
  attributes:
    threats:
    - threat.receipt-as-attestation
    - threat.not-observed-as-none
    status: required
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - component.docs
- id: mitigation.parent-only-facts
  name: Every field comes from the parent's plan, the kernel's reports and the reaped status; child-controlled strings
    stay out; the child path is unchanged
  riskReduction: 80
  attributes:
    threats:
    - threat.child-shaped-fields
    - threat.fork-exec-work
    status: required
    kind: preventive
    requirements:
    - SR-006
    - SR-007
    touchpoints:
    - component.builder
    - component.spawn
- id: mitigation.plan-is-the-source
  name: The relaxation, approximation and waiver lists are copied from the cage's own plan, with one enforced-as-written
    field derived from them
  riskReduction: 85
  attributes:
    threats:
    - threat.relaxation-omitted
    status: required
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - component.builder
- id: mitigation.typed-coverage
  name: The violation summary is typed by coverage (not observed, unavailable with reason, observed with completeness
    and dropped count); not observed has no count
  riskReduction: 85
  attributes:
    threats:
    - threat.not-observed-as-none
    status: required
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - component.builder
    - component.record
requirements:
- id: SR-001
  statement: The policy digest MUST be SHA-256 over one canonical encoding of the policy (fixed field order, sets
    sorted, order kept only where it changes meaning, every path as its bytes, no omitted defaults) prefixed by
    a format tag and version; equal policies MUST have equal digests however they were built, and policies that
    differ in any rule, waiver, base or preset tag MUST have different digests.
  priority: P1
  mitigations:
  - mitigation.canonical-digest
  acceptance:
  - given: two equal policies built with their sets in a different order
    then: the digests are equal
    when: both are digested
  - given: a policy and a copy that differs in one path byte, one waiver, the base or the preset tag
    then: the digests differ
    when: both are digested
  - given: a fixture policy with a pinned digest
    then: the digest equals the pinned value
    when: it is digested on every CI lane and after a round trip through the serialised form
  tasks: []
- id: SR-002
  statement: The receipt MUST list every accepted approximation by construct, every fit relaxation with its lift
    and every waived hard-deny class held by the cage's plan, and MUST carry one field that says enforced as written
    only when all three lists are empty.
  priority: P1
  mitigations:
  - mitigation.plan-is-the-source
  acceptance:
  - given: a fitted cage with relaxations, a cage with an accepted approximation and a cage with each waivable class
      waived
    then: the receipt lists exactly the plan's entries and enforced as written is false
    when: a run of each ends
  - given: a cage with none of them
    then: the three lists are empty and enforced as written is true
    when: a run ends
  tasks: []
- id: SR-003
  statement: A receipt reader MUST refuse a receipt of a newer format version with a typed error, and MUST NOT report
    a run as enforced as written when the receipt holds a field or value it does not know.
  priority: P1
  mitigations:
  - mitigation.fail-closed-reader
  acceptance:
  - given: a receipt with an added relaxation kind the reader does not know
    then: it is refused, or read with enforced as written false or unknown, never true
    when: it is read
  - given: a receipt of the next format version
    then: the reader returns an unsupported-version error
    when: it is read
  - given: a receipt of the previous format version
    then: it parses with every field intact
    when: it is read
  tasks: []
- id: SR-004
  statement: The violation summary MUST carry the record's coverage, completeness and dropped count; with reporting
    off or unavailable it MUST say not observed (with the reason) and MUST NOT carry a violation count.
  priority: P1
  mitigations:
  - mitigation.typed-coverage
  acceptance:
  - given: a run with reporting off, and a run where reporting was unavailable
    then: the summary is not observed (unavailable naming the reason) and holds no count, so no reader can read
      zero
    when: their receipts are serialised
  - given: a macOS run whose record dropped reports
    then: the summary carries coverage observed, the dropped count and completeness as the record reports them
    when: its receipt is built
  tasks: []
- id: SR-005
  statement: Without the caller asking for the policy, the receipt MUST NOT contain environment values, command
    arguments, file contents, policy paths, violation paths or process names; asking for the policy MUST add only
    the policy.
  priority: P2
  mitigations:
  - mitigation.field-allowlist
  acceptance:
  - given: a canary string in an environment value, an argument, a policy path, a file the child reads and a path
      the child is denied
    then: no canary bytes appear in it
    when: the run's receipt is serialised
  - given: the same run with the policy requested
    then: only the policy-path canary appears
    when: the receipt is serialised
  tasks: []
- id: SR-006
  statement: Every receipt field MUST come from the parent's cage and plan, the kernel's reports and the reaped
    exit status; strings the caged code controls MUST NOT appear in a receipt.
  priority: P2
  mitigations:
  - mitigation.parent-only-facts
  acceptance:
  - given: a child that names itself and its paths with format-breaking bytes and exits with a chosen code
    then: the exit code is recorded, none of its strings appear, and every other field equals the cage's own values
    when: its receipt is read back
  tasks: []
- id: SR-007
  statement: The child's call sequence between fork and exec MUST be identical with and without receipts; the receipt
    MUST be built in the parent only.
  priority: P2
  mitigations:
  - mitigation.parent-only-facts
  acceptance:
  - given: the multithreaded spawn tests on every lane
    then: they pass, and the child-side code holds no receipt state
    when: they run with receipts
  - given: the spawn benchmark
    then: spawn latency is unchanged within noise
    when: it runs with and without receipts
  tasks: []
- id: SR-008
  statement: A final receipt MUST be available only after the child was reaped and its violation record is complete
    or closed as interrupted; the partial view MUST be a distinct type that cannot be serialised as a final receipt;
    the exit MUST distinguish an exit code, a signal and a kill by the caller, a timeout or the end of the run.
  priority: P2
  mitigations:
  - mitigation.final-after-reap
  acceptance:
  - given: a running child
    then: only the partial view is returned, and it serialises marked partial
    when: the receipt is asked for
  - given: runs ended by a normal exit, a signal, a caller kill and a timeout
    then: each exit field names its cause
    when: their receipts are read
  tasks: []
- id: SR-009
  statement: The receipt docs MUST state that a receipt is the caller's own unsigned record and not an attestation,
    that whoever can write where it is kept can change it (so keep it outside every path a later run may write),
    that an empty complete record does not prove nothing was denied, and that `Cage::exec` produces no receipt.
  priority: P1
  mitigations:
  - mitigation.honest-docs
  acceptance:
  - given: the crate docs and the site page on receipts
    then: each states all four points, and no text calls a receipt proof, attestation or signature
    when: they describe what a receipt proves
  tasks: []
