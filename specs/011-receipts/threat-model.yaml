threats:
- id: threat.child-shaped-fields
  name: Caged code shapes receipt fields beyond its exit status (process names, paths or forged reports), changing
    what the receipt says about the cage
  categories:
  - Tampering
  cwes:
  - CWE-74
  risk:
    impact: 55
    likelihood: 30
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.receipt
    status: open
    actor: actor.caged-code
    elements:
    - flow.child-output
    - component.record
    profile: stride
    severity: low
    technique: injection
- id: threat.digest-collision
  name: A non-canonical encoding (rule order, a path as text or as bytes, omitted defaults) or a weak hash gives
    two different policies the same digest, so a reviewer reads a loosened policy as the reviewed one
  categories:
  - Tampering
  cwes:
  - CWE-328
  - CWE-180
  risk:
    impact: 85
    likelihood: 35
  attributes:
    source: spec.md#US1
    assets:
    - asset.digest
    status: open
    actor: actor.contributor
    elements:
    - component.encoder
    - flow.digest
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.final-state-misstated
  name: The receipt claims a state the run did not reach, a partial view taken while it runs read as final, or a
    kill, signal or timeout recorded as a normal exit
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 55
    likelihood: 30
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.receipt
    status: open
    actor: actor.consumer
    elements:
    - component.builder
    - component.record
    profile: stride
    severity: low
    technique: missing-audit-trail
- id: threat.fork-exec-work
  name: Receipt bookkeeping adds allocation or locking to the child between fork and exec, so a multithreaded parent's
    child can deadlock or run unconfined code paths
  categories:
  - Denial of Service
  cwes:
  - CWE-667
  risk:
    impact: 70
    likelihood: 20
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.spawn
    status: open
    actor: actor.contributor
    constitution: IV. Syscalls only between fork and exec
    elements:
    - component.spawn
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.grants-unrecorded
  name: '[NEEDS CLARIFICATION: does the receipt record the per-spawn grants (as a digest, a count, or paths on request)?
    FR-002 does not list them, and without them two runs with equal policy digests may have reached different paths]'
  categories:
  - Repudiation
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.receipt
    status: open
    actor: actor.reviewer
    disposition: needs-clarification
    elements:
    - component.builder
    profile: stride
    severity: unrated
    technique: missing-audit-trail
- id: threat.lowering-version-unrecorded
  name: '[NEEDS CLARIFICATION: does the receipt name the procage version or a digest of the lowered plan? Equal
    policy, preset and base versions lowered by different procage releases may be enforced differently]'
  categories:
  - Repudiation
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.receipt
    - asset.digest
    status: open
    actor: actor.reviewer
    disposition: needs-clarification
    elements:
    - component.builder
    profile: stride
    severity: unrated
    technique: missing-audit-trail
- id: threat.not-observed-as-none
  name: With reporting off or unavailable, or a lossy macOS record, the receipt's violation summary reads as zero
