  categories:
  - Tampering
  cwes:
  - CWE-345
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.receipt
    status: open
    actor: actor.caged-code
    elements:
    - flow.store
    - flow.read
