trustZones:
- id: tz.cage
  name: The caged child and its descendants
  risk:
    trustRating: 5
- id: tz.harness
  name: The harness process that builds cages and receives receipts
  risk:
    trustRating: 90
- id: tz.os
  name: The kernel and the unified log (exit status, tier facts, violation reports)
  risk:
    trustRating: 95
- id: tz.registry
  name: crates.io, where the new dependencies come from
  risk:
    trustRating: 40
- id: tz.store
  name: Where the harness keeps receipts (logs, pull requests, audit trails)
  risk:
    trustRating: 50
assets:
- id: asset.digest
  name: The policy digest, the identity a reviewer uses to tell two policies apart
  risk:
    availability: 20
    confidentiality: 10
    integrity: 95
  attributes:
    type: capability
    source: spec.md#FR-002
    classification: internal
- id: asset.host-facts
  name: The OS release and build or kernel release a receipt names (the host patch level)
  risk:
    availability: 0
    confidentiality: 40
    integrity: 60
  attributes:
    type: capability
    source: plan.md#Summary
    classification: internal
- id: asset.receipt
  name: The per-run receipt a reviewer reads to decide how a command was caged
  risk:
    availability: 30
    confidentiality: 30
    integrity: 90
  attributes:
    type: capability
    source: spec.md#Key-Entities
    classification: internal
- id: asset.secrets
  name: Environment values, file contents, policy paths and violation paths the caller did not ask to log
  risk:
    availability: 0
    confidentiality: 90
    integrity: 20
  attributes:
    type: credential
    source: spec.md#FR-004
    classification: secret
- id: asset.spawn
  name: The child's call sequence between fork and exec
  risk:
    availability: 70
    confidentiality: 0
    integrity: 70
  attributes:
    type: capability
    source: spec.md#FR-005
    classification: internal
components:
- id: component.builder
  name: Receipt builder (crates/procage/src/receipt.rs) assembling CageFacts, the cached exit status and the violation
    summary
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: plan.md#Summary
- id: component.cage-facts
  name: 'CageFacts: per-cage facts (policy digest, preset, base, grants, backend, approximations, relaxations, waivers)
    built once in with_options and shared by its children via Arc'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: plan.md#Summary
- id: component.cage-options
  name: CageOptions::with_policy_in_receipt, the opt-in that puts the policy and relaxation subjects in every receipt
    of the cage
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: contracts/api.md
- id: component.child
  name: 'Child handle per backend: Child::receipt (None while alive) and the killed flag set by kill_all'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: contracts/api.md
- id: component.deps
  name: New dependencies sha2 0.10, serde 1 (derive) and serde_json, with procage-policy's serde feature always
    on
  type: library
  parent:
    trustZone: tz.registry
  attributes:
    source: plan.md#Technical-Context
- id: component.docs
  name: Receipt docs (crate and site) on what a receipt proves
  type: document
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-006
- id: component.encoder
  name: 'Policy digest: policy_digest(&Policy), SHA-256 of the policy''s canonical JSON (procage-policy serde form)'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: plan.md#Summary
- id: component.format
  name: 'Receipt format: Receipt::to_json / from_json, version 1, deny_unknown_fields on every map, ReceiptError'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: contracts/api.md
- id: component.host-facts
  name: 'Host fact reads in the parent: kern.osproductversion and kern.osversion (macos::sys), /proc/sys/kernel/osrelease,
    tier, ABI and errata (Linux)'
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: plan.md#Summary
- id: component.record
  name: The run's violation record (Child::violations) and cached reaped exit status (existing)
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#Edge-Cases
- id: component.spawn
  name: Child-side spawn path between fork and exec (existing)
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-005
dataflows:
- id: flow.child-output
  name: Caged code shapes its exit status and the violations it causes
  source: tz.cage
  destination: component.record
  assets:
  - asset.receipt
  - asset.secrets
  attributes:
    crosses:
    - tz.cage
    - tz.harness
- id: flow.claims
  name: The docs tell the reviewer what a receipt proves
  source: component.docs
  destination: actor.reviewer
  assets:
  - asset.receipt
  attributes:
    crosses: []
- id: flow.deps-fetch
  name: Cargo fetches sha2, serde and serde_json from crates.io into the build
  source: tz.registry
  destination: component.encoder
  assets:
  - asset.digest
  - asset.receipt
  attributes:
    crosses:
    - tz.registry
    - tz.harness
- id: flow.digest
  name: The encoder hands the policy digest to the cage facts
  source: component.encoder
  destination: component.cage-facts
  assets:
  - asset.digest
  attributes:
    crosses: []
- id: flow.facts
  name: Host facts and the cage plan become CageFacts
  source: component.host-facts
  destination: component.cage-facts
  assets:
  - asset.host-facts
  - asset.receipt
  attributes:
    crosses: []
- id: flow.facts-to-builder
  name: Each child's Arc of CageFacts feeds its receipt
  source: component.cage-facts
  destination: component.builder
  assets:
  - asset.receipt
  - asset.digest
  - asset.host-facts
  - asset.secrets
  attributes:
    crosses: []
- id: flow.host-facts
  name: The kernel reports the OS release and build or the kernel release to the parent
  source: tz.os
  destination: component.host-facts
  assets:
  - asset.host-facts
  attributes:
    crosses:
    - tz.os
    - tz.harness
- id: flow.kill
  name: The consumer calls kill_all or drops the handle, setting the killed flag
  source: actor.consumer
  destination: component.child
  assets:
  - asset.receipt
  attributes:
    crosses: []
- id: flow.option-to-facts
  name: The option adds the policy and relaxation subjects to CageFacts
  source: component.cage-options
  destination: component.cage-facts
  assets:
  - asset.secrets
  attributes:
    crosses: []
- id: flow.policy-option
  name: The consumer asks for the policy in the receipt
  source: actor.consumer
  destination: component.cage-options
  assets:
  - asset.secrets
  attributes:
    crosses: []
- id: flow.read
  name: A reviewer reads a stored receipt
  source: tz.store
  destination: actor.reviewer
  assets:
  - asset.receipt
  - asset.digest
  attributes:
    crosses:
    - tz.store
- id: flow.receipt-call
  name: Child::receipt asks the builder for a receipt once the run has exited
  source: component.child
  destination: component.builder
  assets:
  - asset.receipt
  attributes:
    crosses: []
- id: flow.run-facts
  name: The kernel reports exit status, tier and release facts and violations
  source: tz.os
  destination: component.record
  assets:
  - asset.receipt
  attributes:
    crosses:
    - tz.os
    - tz.harness
- id: flow.serialise
  name: The builder serialises the receipt through the format
  source: component.builder
  destination: component.format
  assets:
  - asset.receipt
  - asset.digest
  - asset.secrets
  attributes:
    crosses: []
- id: flow.store
  name: The harness stores the serialised receipt
  source: component.format
  destination: tz.store
  assets:
  - asset.receipt
  - asset.secrets
  attributes:
    crosses:
    - tz.harness
    - tz.store
- id: flow.summary
  name: The record hands its violation summary and the cached exit to the builder
  source: component.record
  destination: component.builder
  assets:
  - asset.receipt
  - asset.secrets
  attributes:
    crosses: []
threats:
- id: threat.child-shaped-fields
  name: Caged code shapes receipt fields beyond its exit status (process names, paths or forged reports), changing
    what the receipt says about the cage
  categories:
  - Tampering
  cwes:
  - CWE-74
  risk:
    impact: 55
    likelihood: 30
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.receipt
    status: mitigated
    actor: actor.caged-code
    elements:
    - flow.child-output
    - component.record
    - component.host-facts
    profile: stride
    severity: low
    technique: injection
- id: threat.dependency-compromise
  name: A compromised, yanked or vulnerable release of sha2, serde or serde_json enters the build and weakens the
    digest or the reader (a hash that is not SHA-256, a deserialiser that accepts unknown fields)
  categories:
  - Tampering
  cwes:
  - CWE-1357
  risk:
    impact: 80
    impactComment: every receipt and digest depends on them
    likelihood: 15
    likelihoodComment: widely used RustCrypto and serde crates
  attributes:
    source: plan.md#Technical-Context
    assets:
    - asset.digest
    - asset.receipt
    status: mitigated
    actor: actor.dependency-publisher
    elements:
    - component.deps
    - flow.deps-fetch
    profile: stride
    severity: medium
    technique: data-tampering-at-rest
- id: threat.digest-collision
  name: A non-canonical digest input (list order in fs rules, grants, sockets or the env allowlist, a path as text
    or as bytes, omitted defaults) or a weak hash gives two different policies the same digest, so a reviewer reads
    a loosened policy as the reviewed one
  categories:
  - Tampering
  cwes:
  - CWE-328
  - CWE-180
  risk:
    impact: 85
    likelihood: 35
  attributes:
    source: plan.md#Summary
    assets:
    - asset.digest
    status: mitigated
    actor: actor.contributor
    elements:
    - component.encoder
    - flow.digest
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.digest-json-unstable
  name: Equal policies get different digests because list fields keep build order or serde_json changes its output
    between releases, so a reviewer cannot tell a changed policy from an unchanged one across runs or procage versions
  categories:
  - Repudiation
  cwes:
  - CWE-1288
  risk:
    impact: 50
    impactComment: false alarms erode the digest as an identity, no loosening
    likelihood: 40
    likelihoodComment: fs rules, grants and the env allowlist are Vec in the serde form
  attributes:
    source: plan.md#Summary
    assets:
    - asset.digest
    status: mitigated
    actor: actor.contributor
    elements:
    - component.encoder
    - component.deps
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.final-state-misstated
  name: 'The receipt claims a state the run did not reach: built from a violation record still open and marked complete,
    or a signal or a caller kill recorded as the program''s own exit'
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 55
    likelihood: 30
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.receipt
    status: mitigated
    actor: actor.consumer
    elements:
    - component.builder
    - component.record
    - component.child
    profile: stride
    severity: low
    technique: missing-audit-trail
- id: threat.fork-exec-work
  name: Receipt bookkeeping adds allocation or locking to the child between fork and exec, so a multithreaded parent's
    child can deadlock or run unconfined code paths
  categories:
  - Denial of Service
  cwes:
  - CWE-667
  risk:
    impact: 70
    likelihood: 20
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.spawn
    status: mitigated
    actor: actor.contributor
    constitution: IV. Syscalls only between fork and exec
    elements:
    - component.spawn
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.grants-unrecorded
  name: '[NEEDS CLARIFICATION: does the receipt record the per-spawn grants (as a digest, a count, or paths on request)?
    FR-002 does not list them, and without them two runs with equal policy digests may have reached different paths]'
  categories:
  - Repudiation
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.receipt
    status: retired
    actor: actor.reviewer
    disposition: needs-clarification
    elements:
    - component.builder
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: missing-audit-trail
- id: threat.host-fingerprint
  name: The receipt names the exact OS build or kernel release, so a receipt kept in a public log tells a reader
    the host patch level
  categories:
  - Information Disclosure
  cwes:
  - CWE-497
  risk:
    impact: 30
    impactComment: patch level aids targeting; no secret
    likelihood: 40
    likelihoodComment: required by FR-002, so always present
  attributes:
    source: plan.md#Summary
    assets:
    - asset.host-facts
    status: mitigated
    actor: actor.consumer
    elements:
    - component.host-facts
    - flow.store
    profile: stride
    severity: low
    technique: sensitive-data-exposure
- id: threat.killed-flag-misattributed
  name: ended_by_caller is set by kill_all even when the child had already exited, or a kill_all that fails leaves
    it set, so a program's own failure reads as a caller timeout or the reverse
  categories:
  - Repudiation
  cwes:
  - CWE-367
  risk:
    impact: 45
    impactComment: misleads triage, not the cage claim
    likelihood: 35
    likelihoodComment: kill_all races the child's own exit
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.receipt
    status: mitigated
    actor: actor.consumer
    elements:
    - component.child
    - flow.kill
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.lowering-version-unrecorded
  name: '[NEEDS CLARIFICATION: does the receipt name the procage version or a digest of the lowered plan? Equal
    policy, preset and base versions lowered by different procage releases may be enforced differently]'
  categories:
  - Repudiation
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.receipt
    - asset.digest
    status: retired
    actor: actor.reviewer
    disposition: needs-clarification
    elements:
    - component.builder
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: missing-audit-trail
- id: threat.not-observed-as-none
  name: With reporting off or unavailable, or a lossy macOS record, the receipt's violation summary reads as zero
    denials, and a reviewer concludes nothing was denied
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 70
    likelihood: 50
  attributes:
    source: spec.md#Edge-Cases
    assets:
    - asset.receipt
    status: mitigated
    actor: actor.reviewer
    elements:
    - component.builder
    - flow.summary
    profile: stride
    severity: high
    technique: missing-audit-trail
- id: threat.policy-option-leaks-paths
  name: with_policy_in_receipt, set once on a cage, writes every policy path, grant path and relaxation subject
    into the receipt of every child of that cage, which a harness then posts to a log or pull request
  categories:
  - Information Disclosure
  cwes:
  - CWE-532
  risk:
    impact: 55
    impactComment: home and project paths name users and repositories
    likelihood: 35
    likelihoodComment: opt-in, but per cage not per run
  attributes:
    source: contracts/api.md
    assets:
    - asset.secrets
    status: mitigated
    actor: actor.consumer
    elements:
    - component.cage-options
    - flow.option-to-facts
    - flow.store
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.receipt-as-attestation
  name: A later caged run, or anyone who can write where receipts are kept, rewrites a stored receipt, and a reviewer
    who reads the unsigned receipt as an attestation trusts the forgery
  categories:
  - Tampering
  cwes:
  - CWE-345
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.receipt
    status: mitigated
    actor: actor.caged-code
    elements:
    - flow.store
    - flow.read
    - component.docs
    profile: stride
    severity: high
    technique: data-tampering-at-rest
- id: threat.receipt-leaks-secrets
  name: The receipt carries environment values, command arguments, policy paths or violation paths into a log or
    pull request the caller did not mean to expose
  categories:
  - Information Disclosure
  cwes:
  - CWE-532
  - CWE-200
  risk:
    impact: 60
    likelihood: 40
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.secrets
    status: mitigated
    actor: actor.consumer
    elements:
    - component.builder
    - component.cage-facts
    - flow.serialise
    - flow.store
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.receipt-missing-early
  name: Child::receipt returns None while the run is alive; a harness that asks before waiting stores the output
    with no receipt, or reads None as an uncaged run
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 35
    impactComment: evidence lost, cage unaffected
    likelihood: 40
    likelihoodComment: polling before wait is a natural mistake
  attributes:
    source: contracts/api.md
    assets:
    - asset.receipt
    status: mitigated
    actor: actor.consumer
    elements:
    - component.child
    - flow.receipt-call
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.relaxation-omitted
