requirements:
- id: SR-001
  statement: Below Landlock ABI 3, on both tiers, caged code MUST NOT be able to truncate a file outside the writable
    paths by truncate(2), open or openat with O_TRUNC, or openat2.
  priority: P1
  mitigations:
  - mitigation.truncation-guard
  acceptance:
  - given: T1 or T2 with the ABI capped at 1 or 2 and / readable
    then: each fails and the file keeps its size
    when: the child tries each truncation route on a file outside the writable paths
  - given: the same cage
    then: both succeed
    when: the child writes a workspace file with > and truncates it through a write descriptor
  tasks: []
- id: SR-002
  statement: Tier T2 at Landlock ABI 1 to 3 MUST keep writes inside the writable paths, refuse IP sockets with the
    network off and refuse the hard-deny syscalls.
  priority: P1
  mitigations:
  - mitigation.abi-matrix
  acceptance:
  - given: T2 with the ABI capped at 1, 2, 3 and 5 and a writable workspace
    then: each fails
    when: the child writes outside, opens an AF_INET socket and calls ptrace
  tasks: []
- id: SR-003
  statement: 'procage MUST NOT widen Signals::SelfAndChildren on its own: below ABI 6 it MUST be a capability gap;
    only Signals::SameUser, chosen by the caller, lets signals reach the user''s other processes.'
  priority: P1
  mitigations:
  - mitigation.explicit-same-user
  acceptance:
  - given: the ABI capped at 5 and SelfAndChildren
    then: it fails with a gap naming signals-self-and-children
    when: the cage is built
  - given: the kernel ABI (6 or later) and SelfAndChildren
    then: the signal is refused
    when: the child signals a process outside the cage
  tasks: []
- id: SR-004
  statement: The Landlock ABI cap MUST NOT raise the ABI above the kernel's, and lowering and enforcement MUST use
    the same capped ABI, reported by the cage.
  priority: P1
  mitigations:
  - mitigation.cap-is-min
  acceptance:
  - given: a cap above the kernel ABI
    then: it reports the kernel ABI
    when: the cage is built
  - given: a cap of 0
    then: it is refused as a kernel without Landlock
    when: the cage is built
  tasks: []
- id: SR-005
  statement: The docs MUST state, per Landlock ABI, what a policy gets, including the truncation guard's side effect,
    unscoped signals below ABI 6 and passed IP sockets on T2 below ABI 4.
  priority: P2
  mitigations:
  - mitigation.abi-docs
  acceptance:
  - given: the Linux docs, the lowering table and the threat model
    then: each limit is stated
    when: read for a kernel below ABI 6
  tasks: []
verification:
- id: verification.sr-001.2026-10-31
  requirement: SR-001
  method: test
  evidence: tests/escape_linux.rs::r31_files_outside_the_writable_paths_cannot_be_truncated
  result: pass
  verdict: verified
  justification: On T1 and T2 with the ABI capped at 1 and 2, truncate, openat read-only and no-access with O_TRUNC
    fail with EPERM and openat2 with ENOSYS, every outside file keeps its content, and writing plus set_len inside
    the workspace work; at ABI 3 Landlock refuses them (EACCES). With the guard disabled the canary fails (all four
    routes succeed).
  verified_at: '2026-10-31T23:30:55Z'
  commit: 2657b32
- id: verification.sr-002.2026-10-31
  requirement: SR-002
  method: test
  evidence: tests/spawn_linux.rs::older_kernels_keep_writes_the_network_and_hard_denies
  result: pass
  verdict: verified
  justification: On T2 (and T1) at capped ABIs 1, 2, 3, 5 and 8 a workspace write works, an outside write fails
    with EACCES, UDP and TCP sockets and ptrace fail with EPERM.
  verified_at: '2026-10-31T23:30:55Z'
  commit: 2657b32
- id: verification.sr-003.2026-10-31
  requirement: SR-003
  method: test
  evidence: tests/spawn_linux.rs::signals_reach_outside_processes_only_when_the_policy_says_so
  result: pass
  verdict: verified
  justification: Capped at ABI 5 SelfAndChildren is a gap naming signals-self-and-children; at ABI 8 it refuses
    a signal to an outside process (EPERM); only SameUser delivers it; macOS r25 shows the hard-deny class still
    applies to SameUser.
  verified_at: '2026-10-31T23:30:55Z'
  commit: 2657b32
- id: verification.sr-004.2026-10-31
  requirement: SR-004
  method: test
  evidence: tests/spawn_linux.rs::the_abi_cap_only_lowers
  result: pass
  verdict: verified
  justification: A cap of 200 reports and plans the kernel ABI (8); a cap of 0 is Unsupported::Landlock { abi 0,
    needed 1 }; the r31 and matrix tests assert Cage::landlock_abi equals the cap, and one value feeds the tier
    check, lowering and ruleset (src/linux/mod.rs Cage::with_options).
  verified_at: '2026-10-31T23:30:55Z'
  commit: 2657b32
- id: verification.sr-005.2026-10-31
  requirement: SR-005
  method: review
  evidence: src/linux/mod.rs (Kernels section), crates/procage-policy/src/lowering.md, THREAT_MODEL.md
  result: pass
  verdict: verified
  justification: The Kernels table states the truncation guard and its side effect (ABI 3), passed IP sockets on
    T2 (ABI 4) and unscoped signals with SameUser (ABI 6); the lowering table states both tiers' minimum, the guard
    and the signals-same-user row; THREAT_MODEL lists the limits and R-31.
  verified_at: '2026-10-31T23:30:55Z'
  commit: 2657b32
decisions: []
