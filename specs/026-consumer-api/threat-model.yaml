threats:
- id: threat.env-clear-ignored
  name: A consumer calls env_clear and sets its own variables under a passthrough policy, and procage passes the
    caller's whole environment, secrets included, to caged code
  categories:
  - Information Disclosure
  risk:
    comment: happened in a consumer harness
    impact: 90
    likelihood: 70
  attributes:
    source: spec.md#Context
    assets:
    - asset.caller-env
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.env-decision
    - flow.env
    profile: stride
    severity: critical
    technique: sensitive-data-exposure
- id: threat.env-observer-unreliable
  name: The env_clear observation silently stops working (std changes its formatting) or is fooled by argument or
    variable values, so passthrough leaks again or an environment is wrongly cleared
  categories:
  - Information Disclosure
  risk:
    impact: 90
    likelihood: 40
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.caller-env
    status: mitigated
    actor: actor.contributor
    elements:
    - component.env-decision
    profile: stride
    severity: high
    technique: sensitive-data-exposure
- id: threat.native-drift
  name: The native module's common subset diverges between systems, so portable consumer code fails to build on
    one system or behaves differently
  categories:
  - Tampering
  risk:
    impact: 40
    likelihood: 40
  attributes:
    source: spec.md#FR-006
    assets:
    - asset.api-contract
    status: mitigated
    actor: actor.contributor
    elements:
