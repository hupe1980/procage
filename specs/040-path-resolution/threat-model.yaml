    reason: 'folded into asset.plan: a planned path and the identity of the object it resolved to are one entry
      of the mount plan'
  extends: null
  generated: '2026-11-03T08:37:52Z'
  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: plan.md
    sha256: 00d70977d1d01bd98ef7968ee4a0322afdfbd4c2e5ccdcb29957c6acc8bd3a2d
  - path: spec.md
    sha256: 39880bff6dd7a0749832ef9b4e50559a72db01d0720220be72b74b3d87f8e500
