    - crates/procage/tests/escape_macos.rs
    - crates/procage-policy/tests/network_ip.rs
- id: mitigation.relax-to-ip
  name: NoUnixSockets answers socket-class gaps only under Network::All (or Ip), switching to Network::Ip and clearing
    ipc.unix_sockets; the cage is made again from the relaxed policy
  riskReduction: 85
