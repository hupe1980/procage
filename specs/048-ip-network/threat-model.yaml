    - crates/procage/tests/escape_linux.rs
requirements:
- id: SR-001
  statement: Under Network::Ip no Unix socket outside ipc.unix_sockets MUST be reachable on macOS, T1 or T2, while
    IP connects, listening and name resolution MUST work.
  priority: P1
  mitigations:
  - mitigation.ip-families-only
  acceptance:
  - given: Network::Ip without ipc.unix_sockets
    then: the IP operations succeed and the Unix connect fails on every tier
    when: the child connects over TCP, listens, resolves a name and connects to a Unix socket
  - given: Network::Ip with ipc.unix_sockets naming a socket
    then: it connects (T1 and T2 from ABI 9, macOS)
    when: the child connects to it
  tasks: []
- id: SR-002
  statement: Relax::no_unix_sockets MUST answer hd-service-handoff and hd-container-engines gaps only under Network::All,
    by switching the policy to Network::Ip; under any other network the gap MUST stay.
  priority: P1
  mitigations:
  - mitigation.relax-to-ip
  acceptance:
  - given: T2, Network::All and a session bus socket in a runtime directory
    then: the cage is made with Network::Ip, the gap is reported relaxed with the T1 lift, and the child cannot
      connect to the bus
    when: fitting with no_unix_sockets
  - given: a socket-class gap and a Loopback network
    then: the gap is returned unanswered and the policy is unchanged
    when: applying no_unix_sockets
  tasks: []
- id: SR-003
  statement: On Linux, Network::Ip MUST refuse every socket family but AF_INET, AF_INET6 and, with ipc.unix_sockets,
    AF_UNIX; ipc.unix_sockets with Network::Ip on T1 below ABI 6 MUST be unsupported.
  priority: P1
  mitigations:
  - mitigation.ip-families-only
  acceptance:
  - given: Network::Ip lowered for T1 and T2
    then: seccomp refuses socket() except AF_INET and AF_INET6 (and AF_UNIX with ipc.unix_sockets), even with socket-families
      waived
    when: the plan is built
  - given: Network::Ip with ipc.unix_sockets on T1 at ABI 5
    then: ipc-unix-sockets is an unsupported gap
    when: lowering
  tasks: []
verification:
- id: verification.sr-001.2026-11-02
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/escape_linux.rs::r34_the_ip_network_keeps_every_unix_socket_out, crates/procage/tests/escape_macos.rs::r34_the_ip_network_keeps_every_unix_socket_out
  result: pass
  verdict: verified
  justification: Under Network::Ip the caged child connects over TCP, sends UDP, listens and resolves a name, while
    connects to a fake bus, a fake engine and an abstract bus fail with EPERM on T1 and T2 (container lanes), and
    on macOS to the engine and another listener; the project's socket at ipc.unix_sockets connects (macOS, T1; T2
    below ABI 9 is the expected gap).
  verified_at: '2026-11-02T22:54:55Z'
  commit: 476d2a1
