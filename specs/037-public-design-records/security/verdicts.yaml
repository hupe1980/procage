    verdict: verified
    method: review
    evidence: specs/README.md
    result: pass
    justification: The README says records describe each change as made, that the README, the threat model and the documentation are authoritative and win where they differ, and explains what each file of a record holds.
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: just planning-paths with a planted decision id in specs/README.md
    result: pass
    justification: The gate exits 1 with the planted line and 0 after it is removed; it also caught its own pattern text in the justfile during development (fixed with a bracket expression).
