    (mounts, optional); crates/procage/src/linux/sys.rs (ChildMount optional, child loop); just linux-t1 (spawn
    47/47, escape 22/22 with and without reporting)
  result: pass
  verdict: verified
  justification: The churn test (300 T1 spawns while a socket is bound and removed) failed at spawn 3 before the
    fix and passes after it. Only cover groups are marked optional; the child skips an optional mount only on ENOENT
    and then skips the remount of the same target; any other error, and every declared mount, still fails the spawn.
    The T1 mask tests and escape suite pass unchanged.
  verified_at: '2026-11-01T17:16:20Z'
  commit: 09db927
- id: verification.sr-002.2026-11-01
  requirement: SR-002
  method: review
  evidence: crates/procage/src/violation.rs (module docs, Coverage::Observed, Violations::complete); site/content/docs/violations.md
    (Live, complete and honest)
  result: pass
  verdict: verified
  justification: Both say an empty record never proves nothing was denied, that Linux reports refused system calls
    only, and that macOS drops reports under heavy load, with the measurement (82 of 640 missing from an independent
    log stream, 16 runs in parallel, none in serial runs). No remaining text calls a complete Observed record proof.
