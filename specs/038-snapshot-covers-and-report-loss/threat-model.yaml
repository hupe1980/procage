mitigations:
- id: mitigation.measured-docs
  name: The docs state the measured loss and that an empty record never proves nothing was denied
  riskReduction: 80
  attributes:
    threats:
    - threat.record-overclaim
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage/src/violation.rs
    - site/content/docs/violations.md
- id: mitigation.optional-covers
  name: Only snapshot covers are optional, only on ENOENT, the remount of a skipped target skipped with it; declared
    mounts strict; churn test plus the existing mask and escape tests on T1
  riskReduction: 80
  attributes:
    threats:
    - threat.cover-skip-exposes
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage/src/linux/sys.rs
    - crates/procage/src/linux/spawn.rs
    - crates/procage/tests/spawn_linux.rs
requirements:
- id: SR-001
  statement: On Linux T1, only covers made from the file system at spawn MAY be skipped, and only when their file
    no longer exists; mounts the policy declares MUST stay strict, and a skipped cover MUST NOT leave a remount
    behind.
  priority: P2
  mitigations:
  - mitigation.optional-covers
  acceptance:
  - given: a thread binding and removing a foreign socket
    then: all succeed
    when: 300 T1 spawns run
  - given: the T1 escape suite and mask tests
    then: they pass unchanged
    when: they run with the change
  tasks: []
- id: SR-002
  statement: procage MUST NOT present a complete macOS record as proof that nothing was denied; its docs MUST state
    the measured report loss under load.
  priority: P2
  mitigations:
  - mitigation.measured-docs
  acceptance:
  - given: the crate docs and the site page
    then: neither calls an empty record proof, and both name the measured loss
    when: they describe Observed and complete
  tasks: []
verification:
- id: verification.sr-001.2026-11-01
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/spawn_linux.rs::a_socket_removed_during_the_spawn_does_not_fail_it; crates/procage/src/linux/spawn.rs
    (mounts, optional); crates/procage/src/linux/sys.rs (ChildMount optional, child loop); just linux-t1 (spawn
    47/47, escape 22/22 with and without reporting)
  result: pass
  verdict: verified
  justification: The churn test (300 T1 spawns while a socket is bound and removed) failed at spawn 3 before the
    fix and passes after it. Only cover groups are marked optional; the child skips an optional mount only on ENOENT
    and then skips the remount of the same target; any other error, and every declared mount, still fails the spawn.
    The T1 mask tests and escape suite pass unchanged.
  verified_at: '2026-11-01T17:16:11Z'
  commit: 09db927
- id: verification.sr-001.2026-11-01-2
