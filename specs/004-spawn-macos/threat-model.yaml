  priority: P1
  mitigations:
  - mitigation.new-session
  acceptance:
  - given: Tty::None
    then: it leads its own session and has no controlling terminal
    when: the child queries its session and opens /dev/tty
  - given: Tty::NewPty
    then: it fails with Unsupported naming the setting
    when: the cage is prepared
  tasks: []
- id: SR-011
  statement: Crate docs and the threat-model release status MUST state what this development version enforces on
    macOS (each claim backed by a caged-child test) and what it does not (fd hygiene, descendant lifetime, base
