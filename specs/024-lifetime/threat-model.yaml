    status: verified
    kind: detective
    requirements:
    - SR-007
    touchpoints:
    - crates/procage-policy/src/lower/mod.rs
    - crates/procage-policy/src/lowering.md
    - src/linux/seccomp.rs
    - crates/procage-policy/src/presets.rs
- id: mitigation.linux-group-lock
  name: Under the default lifetime the Linux seccomp program denies setsid and setpgid with EPERM on both tiers,
    installed after procage's own setsid; the handle kills the group
  riskReduction: 90
  attributes:
    threats:
    - threat.daemon-outlives-run
    - threat.orphan-after-exit
    status: verified
    kind: preventive
    requirements:
    - SR-001
    - SR-003
    touchpoints:
    - crates/procage-policy/src/lower/linux.rs
    - src/linux/seccomp.rs
    - src/linux/child.rs
- id: mitigation.macos-marker-scan
  name: Every forking macOS spawn carries a per-run marker in its compiled profile; ending the run scans all processes
    and kills those whose sandbox carries the marker
  riskReduction: 90
  attributes:
    threats:
    - threat.daemon-outlives-run
    - threat.orphan-after-exit
    status: verified
    kind: preventive
    requirements:
    - SR-002
    - SR-003
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - src/macos/lifetime.rs
    - src/macos/child.rs
    - src/macos/sys.rs
- id: mitigation.slot-discipline
  name: Markers come from a process-random prefix and a slot pool; a slot is freed only after a kill that found
    no survivor; detach and a failed kill retire it
  riskReduction: 80
  attributes:
    threats:
    - threat.cross-run-kill
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - src/macos/lifetime.rs
    - src/macos/mod.rs
    - src/macos/child.rs
requirements:
- id: SR-001
  statement: Under the default lifetime on Linux, setsid and setpgid MUST fail with EPERM in every caged process
    on tiers T1 and T2, and dropping the handle MUST kill a double-forked descendant.
  priority: P1
  mitigations:
  - mitigation.linux-group-lock
  acceptance:
  - given: the default lifetime on T1 and on T2
    then: both fail with EPERM
    when: a caged process calls setsid and setpgid
  - given: a double-forked descendant on T1 and on T2
    then: the descendant is dead within two seconds
    when: the handle is dropped
  tasks: []
- id: SR-002
  statement: On macOS, ending a forking run MUST kill every process whose sandbox carries the run's marker, including
    a double-forked descendant in its own session reparented to launchd.
  priority: P1
  mitigations:
  - mitigation.macos-marker-scan
  acceptance:
  - given: a double-forked descendant in its own session on macOS
    then: the descendant is dead within two seconds
    when: the handle is dropped
  tasks: []
- id: SR-003
  statement: Descendants of a child that exited and was reaped before the run ended MUST be killed when the handle
    is dropped, on macOS and on Linux T1 and T2.
  priority: P1
  mitigations:
  - mitigation.linux-group-lock
  - mitigation.macos-marker-scan
  acceptance:
  - given: a child that started a background descendant and exited
    then: the descendant is dead within two seconds
    when: the caller waits for it and drops the handle
  tasks: []
- id: SR-004
  statement: The macOS marker MUST be part of the compiled profile, MUST grant no access to an existing resource,
    and MUST NOT match the caller, unsandboxed processes, or a sandbox that allows all lookups.
  priority: P1
  mitigations:
  - mitigation.immutable-marker
  acceptance:
  - given: a running cage and an allow-all sandbox and the caller
    then: only the cage's processes match
    when: each is checked for the run's marker
  - given: the lowered profile
    then: they use a literal name and no extension filter
    when: its marker rules are inspected
  tasks: []
- id: SR-005
  statement: Two live runs of one caller MUST NOT share a marker; dropping one run's handle MUST leave the other
    run's processes alive; a marker MUST be reused only after a kill that found no survivor, and never after detach.
  priority: P1
  mitigations:
  - mitigation.slot-discipline
  acceptance:
  - given: two concurrent runs from the same cage with descendants in their own sessions
    then: the other run's descendants are still alive
    when: one handle is dropped
  - given: a detached child
    then: it gets a different marker
    when: another child is spawned
  tasks: []
- id: SR-006
  statement: kill_all MUST NOT return Ok while a process of the run is known to live; after the round limit it MUST
    return an error naming the survivors.
  priority: P2
  mitigations:
  - mitigation.bounded-rounds
  acceptance:
  - given: a search that keeps finding a live process of the run
    then: kill_all returns an error with its pid
    when: the round limit is reached
  tasks: []
- id: SR-007
  statement: The lifetime setting MUST appear in the lowering ledger on both systems and in the lowering table;
    the Linux lock MUST be pinned per architecture; the frozen presets MUST carry the default lifetime.
  priority: P2
  mitigations:
  - mitigation.ledger-and-pins
  acceptance:
  - given: a policy with each lifetime value
    then: the ledger reports the setting and the Linux seccomp rules contain the lock only for the default
    when: it is lowered for Linux and macOS
  - given: every frozen preset
    then: its lifetime is the default
    when: it is built
  tasks: []
- id: SR-008
  statement: R-23 MUST be marked mitigated only with the double-fork and exited-child canaries as evidence, passing
    on macOS and Linux T1 and T2, and the catalog gate MUST pass.
  priority: P1
  mitigations:
  - mitigation.canary-evidence
  acceptance:
  - given: the catalog
    then: R-23 is mitigated with existing canary tests as evidence
    when: the gate runs
  - given: the escape suite on macOS, T1 and T2
    then: the R-23 canaries pass and none is ignored
    when: it runs
  tasks: []
