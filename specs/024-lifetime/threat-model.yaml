threats:
- id: threat.cross-run-kill
  name: Ending one run kills another run's processes or unrelated processes (a marker shared by two live runs, reused
    while its processes live, matched by another sandbox, or a reused pid)
  categories:
  - Denial of Service
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#Edge-Cases
    assets:
    - asset.other-processes
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.marker
    - flow.reap
    profile: stride
    severity: high
    technique: resource-exhaustion
- id: threat.daemon-outlives-run
  name: Caged code double-forks a descendant into its own session, the intermediate exits, and the descendant keeps
    running after the handle is dropped
  categories:
  - Elevation of Privilege
  risk:
    comment: a one-line nohup/setsid or any daemon does it today on both systems
    impact: 80
    likelihood: 80
  attributes:
    source: spec.md#US1
    assets:
    - asset.run-boundary
    status: mitigated
    actor: actor.caged-code
    elements:
    - flow.escape
    - component.reaper
    - component.lowering
    profile: stride
    severity: critical
    technique: broken-access-control
- id: threat.kill-false-success
  name: kill_all reports success although a process of the run survived (forking faster than the kill, another uid,
    a scan that stopped early)
  categories:
  - Repudiation
  risk:
    impact: 70
    likelihood: 40
  attributes:
    source: spec.md#FR-006
    assets:
    - asset.run-boundary
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.reaper
    profile: stride
    severity: high
    technique: missing-audit-trail
- id: threat.marker-evasion
  name: Caged code drops, changes or hides its run marker (an extension release, a forged lookup, a profile change),
    or the marker grants it access to something that exists
  categories:
  - Elevation of Privilege
  risk:
    comment: an extension-based marker could be released from inside; a profile literal cannot
    impact: 80
    likelihood: 40
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.run-boundary
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.marker
    profile: stride
    severity: high
    technique: privilege-escalation-via-config
- id: threat.orphan-after-exit
  name: The child exits and is reaped before the run ends, so its descendants (in or out of its group) are no longer
    found from it and survive
  categories:
  - Elevation of Privilege
  risk:
    comment: every run-to-completion consumer hits this (a consumer harness reported it)
    impact: 70
    likelihood: 80
  attributes:
    source: spec.md#US2
    assets:
    - asset.run-boundary
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.reaper
    profile: stride
    severity: critical
    technique: broken-access-control
- id: threat.overclaimed-lifetime
  name: R-23 is marked mitigated, or the docs drop the open variant, without passing kernel canaries on every system
    and tier
  categories:
  - Repudiation
  risk:
    impact: 80
    likelihood: 30
  attributes:
    source: spec.md#FR-010
    assets:
    - asset.catalog-truth
    status: mitigated
    actor: actor.contributor
    elements:
    - component.suite
    - flow.claim
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.silent-lifetime-weakening
  name: A policy, a frozen preset or a lowering path ends up with the tree setting or without the lock (a missing
    tier, architecture or syscall) without the ledger, the docs or a test saying so
  categories:
  - Tampering
  risk:
    impact: 80
    likelihood: 40
