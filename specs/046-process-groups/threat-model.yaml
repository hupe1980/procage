  verified_at: '2026-11-02T19:53:38Z'
  commit: 48a52d4
- id: verification.sr-002.2026-11-02
  requirement: SR-002
  method: test
  evidence: crates/procage/tests/escape_linux.rs::r23_a_descendant_in_a_group_of_its_own_dies_with_the_run
  result: pass
  verdict: verified
  justification: An intermediate starts /bin/sleep with process_group(0) and exits, so the sleeper is outside the
    child's group and tree; dropping the handle kills it within two seconds on T1 and T2. The existing R-23 canaries
    (double fork, exited child, descendants) pass unchanged.
