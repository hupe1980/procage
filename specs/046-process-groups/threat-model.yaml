mitigations:
- id: mitigation.group-boundary-kept
  name: setpgid stays refused with Tty::Inherit and for Cage::exec
  riskReduction: 90
  attributes:
    threats:
    - threat.caller-session
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage/src/linux/mod.rs
    - crates/procage/tests/exec.rs
- id: mitigation.session-boundary
  name: setsid refused under Lifetime::Run; ending the run kills the child session, repeated until no live member
    is new
  riskReduction: 90
  attributes:
    threats:
    - threat.group-outlives-run
    - threat.session-escape
    - threat.fork-during-kill
    status: verified
    kind: preventive
    requirements:
    - SR-001
    - SR-002
    touchpoints:
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage/src/linux/child.rs
    - crates/procage/tests/escape_linux.rs
requirements:
- id: SR-001
  statement: Under Lifetime::Run no process of the run MUST be able to start a session; starting a process group
    MUST work with the defaults.
  priority: P1
  mitigations:
  - mitigation.session-boundary
  acceptance:
  - given: a forking default policy on T1 and T2
    then: setsid fails with EPERM and setpgid succeeds
    when: a process of the run calls setsid and setpgid(0, 0)
  - given: the lowering with fork and Lifetime::Run
    then: setsid is denied in both, setpgid only with Tty::Inherit
    when: it is lowered with Tty::None and Tty::Inherit
  tasks: []
- id: SR-002
  statement: Ending a run MUST kill every live process of the child session, including those in other process groups
    and outside the child tree.
  priority: P1
  mitigations:
  - mitigation.session-boundary
  acceptance:
  - given: a descendant in a process group of its own whose parent exited
    then: it dies within two seconds on T1 and T2
    when: the run ends
  tasks: []
- id: SR-003
  statement: With the caller session (Tty::Inherit, Cage::exec) setpgid MUST stay refused under Lifetime::Run.
  priority: P1
  mitigations:
  - mitigation.group-boundary-kept
  acceptance:
  - given: Cage::exec of a shell
    then: both fail
    when: a descendant calls setsid and setpgid(0, 0)
  tasks: []
verification:
- id: verification.sr-001.2026-11-02
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/escape_linux.rs::r23_sessions_are_locked
  result: pass
  verdict: verified
  justification: In a forking default cage on T1 and T2, a process of the run that leads neither its session nor
    its group calls setsid (EPERM) and setpgid(0, 0) (ok); procage-policy/tests/gaps.rs the_linux_lifetime_lock_follows_the_setting
    asserts setsid denied with Tty::None and Tty::Inherit and setpgid only with Tty::Inherit. Passed in both container
    lanes (Linux 7.0, ABI 8), 2026-11-02.
  verified_at: '2026-11-02T19:48:32Z'
  commit: 48a52d4
