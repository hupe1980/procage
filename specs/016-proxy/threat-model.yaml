- id: mitigation.literal-as-address
  name: Every IP literal notation parses to one address; literals are refused unless an allowlisted range contains
    that address
  riskReduction: 85
  attributes:
    threats:
    - threat.ip-literal-bypass
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage-proxy/src/host.rs
    - crates/procage-proxy/src/allow.rs
- id: mitigation.no-allow-all
  name: Construction fails on an empty allowlist, a bare wildcard or a single-label wildcard suffix; no allow-all
    mode exists
  riskReduction: 90
  attributes:
    threats:
    - threat.allowlist-fail-open
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - crates/procage-proxy/src/allow.rs
- id: mitigation.one-canonical-host
  name: One parser yields a canonical host (lower case, trailing dot stripped, IDNA to A-labels) and refuses NUL
    and control bytes, percent-encoding, userinfo and invalid labels; the same value is checked and connected; a
    plain-HTTP Host header must equal the URI host; table-driven suite plus fuzz target
  riskReduction: 85
  attributes:
    threats:
    - threat.parser-differential
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - crates/procage-proxy/src/host.rs
    - crates/procage-proxy/src/http.rs
    - crates/procage-proxy/src/socks.rs
- id: mitigation.opaque-relay
  name: After CONNECT or the SOCKS5 reply the proxy relays bytes unchanged in both directions; no TLS code in the
    crate
  riskReduction: 90
  attributes:
    threats:
    - threat.payload-tampering
    status: verified
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - crates/procage-proxy/src/lib.rs
- id: mitigation.run-bound-listener
  name: Each connection belongs to exactly one run, whose allowlist decides it and whose violations record its refusals;
    a child cannot reach another run's listener
  riskReduction: 75
