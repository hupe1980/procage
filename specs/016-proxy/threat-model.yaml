otmVersion: 0.2.0
project:
  id: 016-proxy
  name: Egress proxy with a domain allowlist
threatspec:
  actors:
  - id: actor.caged-code
    name: Arbitrary code in the caged child, which crafts proxy requests and tries every route around the proxy
    trust: untrusted
  - id: actor.consumer
    name: Developer of a harness that builds the allowlist and the proxy-only cage
    trust: trusted
  - id: actor.contributor
    name: procage contributor who edits the proxy, the host parser or the network lowering
    trust: semi-trusted
  - id: actor.remote
    name: Operator of a remote host or DNS zone, including one under an allowed name, who controls its DNS answers
    trust: untrusted
  dispositions:
  - disposition: not-applicable
    reason: no authentication surface; the proxy authenticates no client, injects no credentials and never terminates
      TLS
    technique: credential-theft
  - disposition: no-threat-detected
    reason: 'checked flow.request: the only identity that matters is which run a connection belongs to, covered
      by threat.run-confusion and its open question'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: no store; the allowlist lives in memory and the proxy persists nothing
    technique: data-tampering-at-rest
  - disposition: not-applicable
    reason: procage-proxy is a library that calls no model and runs no agent; LLM-written code is the adversary
      inside the child, modelled under STRIDE
    technique: prompt-injection-direct
