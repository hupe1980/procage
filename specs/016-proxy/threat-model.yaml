requirements:
- id: SR-001
  statement: The proxy MUST derive one canonical host per request and use that same value for the allowlist check
    and the connect; it MUST refuse hosts with NUL or control bytes, percent-encoding, userinfo or invalid labels,
    and a plain-HTTP request whose Host header differs from its URI host.
  priority: P1
  mitigations:
  - mitigation.one-canonical-host
  acceptance:
  - given: allowed.com on the list and the SOCKS5 host allowed.com\0.evil.com
    then: the proxy refuses it and opens no connection
    when: the child requests it
  - given: allowed.com on the list
    then: it is treated as allowed.com and connects there
    when: the child requests ALLOWED.COM. through CONNECT
  - given: the table-driven spelling suite and the fuzz target
    then: for every input the checked host equals the host connected to, with zero disagreements
    when: they run in CI
  tasks: []
- id: SR-002
  statement: The proxy MUST parse every IP literal notation to one address and MUST refuse a literal unless an explicitly
    allowlisted address range contains that address.
  priority: P1
  mitigations:
  - mitigation.literal-as-address
  acceptance:
  - given: a domain-only allowlist
    then: every request is refused
    when: the child requests 2130706433, 0x7f.1, 017700000001, [::ffff:127.0.0.1] and 127.1
  - given: an allowlisted range 192.0.2.0/24
    then: both connect to 192.0.2.10
    when: the child requests 192.0.2.10 in decimal and dotted form
  tasks: []
- id: SR-003
  statement: The proxy MUST resolve an allowed name once, MUST refuse loopback, private, link-local, unspecified
    and metadata addresses (also in IPv4-mapped and translated IPv6 forms) unless allowlisted, and MUST connect
    only to an address it checked.
  priority: P1
  mitigations:
  - mitigation.check-resolved-connect-checked
  acceptance:
  - given: an allowed name resolving to 127.0.0.1, 169.254.169.254 or ::ffff:10.0.0.1
    then: the proxy refuses it and the violation names the host and the address
    when: the child requests it
  - given: a test resolver answering a public address first and 127.0.0.1 on any later query
    then: the proxy connects to the first, checked address and issues no second query
    when: the child requests the name
  tasks: []
- id: SR-004
  statement: The proxy MUST NOT send a DNS query for a name the allowlist refuses.
  priority: P2
  mitigations:
  - mitigation.check-resolved-connect-checked
  acceptance:
  - given: a counting test resolver
    then: the request is refused and the resolver saw no query
    when: the child requests a host not on the list
  tasks: []
- id: SR-005
  statement: Building a proxy MUST fail on an empty allowlist, a bare wildcard or a wildcard whose suffix is a single
    label; there MUST be no allow-all mode.
  priority: P1
  mitigations:
  - mitigation.no-allow-all
  acceptance:
  - given: an empty allowlist, '*' or '*.com'
    then: construction returns a typed error
    when: the proxy is built
  tasks: []
- id: SR-006
  statement: When the proxy is stopped or was never started, a connection from a proxy-only child MUST fail; no
    code path MAY fall back to a direct connection.
  priority: P1
  mitigations:
  - mitigation.kernel-boundary
  acceptance:
  - given: a proxy-only cage on macOS and Linux T1 whose proxy has been stopped
    then: both fail
    when: the child connects to the proxy and to an allowed host directly
  tasks: []
- id: SR-007
  statement: A proxy-only cage MUST block every direct route on macOS and Linux T1 by a kernel boundary (macOS outbound
    to the proxy ports only; on T1 a network namespace whose only endpoint is the proxy listener); Landlock port
    rules MUST NOT be the only boundary.
  priority: P1
  mitigations:
  - mitigation.kernel-boundary
  acceptance:
  - given: a proxy-only cage on macOS and on Linux T1
    then: every attempt fails, one escape-suite canary per route
    when: the child tries direct TCP, UDP, TCP Fast Open, MPTCP, raw IP, IPv6, a DNS query and another loopback
      port
  tasks: []
- id: SR-008
  statement: On Linux T2 building a proxy-only cage MUST return a CapabilityGap; it MUST NOT be lowered to Landlock
    port rules alone.
  priority: P1
  mitigations:
  - mitigation.t2-gap
  acceptance:
  - given: Linux T2
    then: it fails with CapabilityGap naming proxy-only networking
    when: a proxy-only cage is built
  tasks: []
- id: SR-009
  statement: Every proxy connection MUST be decided by the allowlist of exactly one run and its refusals recorded
    in that run's violations; a child MUST NOT reach the listener of another run.
  priority: P2
  mitigations:
  - mitigation.run-bound-listener
  acceptance:
  - given: two concurrent runs with different allowlists
    then: the request fails and only run A's violations record it
    when: the child of run A requests a host only run B allows, also by connecting to run B's listener
  tasks: []
- id: SR-010
  statement: The proxy MUST NOT terminate TLS or alter payloads; after the CONNECT or SOCKS5 reply it MUST relay
    bytes unchanged.
  priority: P2
  mitigations:
  - mitigation.opaque-relay
  acceptance:
  - given: an allowed local test host that echoes and hashes what it receives
    then: the hashes on both ends match
    when: the child sends random bytes through CONNECT and SOCKS5
  tasks: []
- id: SR-011
  statement: The proxy MUST bound each run's concurrent connections and handshake time, and MUST close every connection
    of a run when the run ends.
  priority: P2
  mitigations:
  - mitigation.bounded-proxy
  acceptance:
  - given: a child opening connections beyond the cap and one that never finishes its handshake
    then: excess connections are refused, the stalled one is closed after the timeout, and other runs keep working
    when: the run continues
  - given: an open long-lived connection
    then: the connection is closed
    when: the run ends
  tasks: []
- id: SR-012
  statement: A refusal MUST record the host escaped, without raw control bytes, and within the run's violation cap
    with the rest counted.
  priority: P2
  mitigations:
  - mitigation.escaped-capped-record
  acceptance:
  - given: a refused host containing an escape sequence and a newline
    then: the host is shown escaped
    when: the violation is read
  - given: a child making more refused requests than the cap
    then: it holds the cap and counts the rest
    when: the record is read
  tasks: []
- id: SR-013
  statement: THREAT_MODEL MUST list the allowlist parser-differential escape class with the parser suite as evidence
    and direct-egress canaries per proxy tier, and the docs MUST state that the allowlist binds host names, not
    content.
  priority: P2
  mitigations:
  - mitigation.honest-claims
  acceptance:
  - given: THREAT_MODEL.md and the proxy docs
    then: the class has evidence entries for the suite and canaries, and the docs name shared hosting and fronting
      as residual risk
    when: they are reviewed
  tasks: []
