  exclusions: []
  extends: null
  generated: '2026-11-02T15:27:53Z'
  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: plan.md
    sha256: afb3e5c289481c44d516f93a65ae162b3085d525508e5d6ebb76f679137281bc
  - path: spec.md
    sha256: 93e9631a6c38dc28a3fcb115896bacb637b4fed834709c522308b5b33782f733
  surfaces:
  - external-input
  - network-boundary
  - authorization
  - audit-relevant
  - shared-tenant
  version: '0.1'
trustZones:
- id: tz.cage
  name: The caged child
  risk:
    trustRating: 5
- id: tz.harness
  name: The harness process, in which the proxy runs as a thread or task
  risk:
    trustRating: 90
- id: tz.internet
  name: Remote hosts and DNS servers on the internet
  risk:
    trustRating: 10
- id: tz.kernel
  name: The kernel (Seatbelt network rules on macOS, network namespace and Landlock on Linux)
  risk:
    trustRating: 95
- id: tz.local-network
  name: Loopback, private and link-local networks and cloud metadata services reachable from the host
  risk:
    trustRating: 40
assets:
- id: asset.allowlist
  name: 'The allowlist: exact hosts, wildcard suffixes, optional ports and address ranges, and the decision it yields'
  risk:
    availability: 50
    confidentiality: 10
    integrity: 95
  attributes:
    type: capability
    source: spec.md#Key-Entities
    classification: internal
- id: asset.harness
  name: 'The harness process: threads, descriptors and memory the in-process proxy uses'
  risk:
    availability: 70
    confidentiality: 0
    integrity: 50
  attributes:
    type: capability
    source: spec.md#Clarifications
    classification: internal
- id: asset.host-data
  name: The user's files, secrets and workspace content the child can read and could send out
  risk:
    availability: 10
    confidentiality: 100
    integrity: 30
  attributes:
    type: credential
    source: spec.md#Input
    classification: secret
- id: asset.local-services
  name: Services on loopback, private and link-local addresses and the cloud metadata endpoint (credentials, admin
    APIs)
  risk:
    availability: 40
    confidentiality: 90
    integrity: 80
  attributes:
    type: capability
    source: spec.md#FR-004
    classification: secret
- id: asset.payload
  name: The bytes relayed between the child and an allowed host, usually TLS
  risk:
    availability: 30
    confidentiality: 70
    integrity: 80
  attributes:
    type: capability
    source: spec.md#FR-007
    classification: confidential
- id: asset.record
  name: The violations of the run, including refused host names, which the harness shows its user and may act on
  risk:
    availability: 30
    confidentiality: 30
    integrity: 80
  attributes:
    type: capability
    source: spec.md#FR-005
    classification: internal
components:
- id: component.allowlist
  name: Allowlist builder and matcher (exact hosts, wildcard suffixes, ports, address ranges)
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-003
- id: component.cage-net
  name: 'Proxy-only cage: Network::Proxy lowering on macOS, the network namespace on Linux T1, the capability gap
    on T2'
  type: library
  description: 'macOS: the profile allows outbound connections to the run''s proxy ports only (profile parameters,
    fresh ports per run). Linux T1: the child sequence brings up the namespace loopback, listens on the policy''s
    ports and hands the listeners to the parent over a socket pair; Landlock CONNECT_TCP to those ports only. T2:
    a capability gap.'
  parent:
    trustZone: tz.kernel
  attributes:
    source: spec.md#FR-006
- id: component.docs
  name: THREAT_MODEL escape class for parser differentials, crate and site docs on what the allowlist proves
  type: document
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-008
- id: component.listener
  name: procage-proxy listeners serving HTTP CONNECT, plain-HTTP absolute URIs and SOCKS5
  type: service
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-001
- id: component.parser
  name: The one canonical host parser whose value is both checked and connected to
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-002
- id: component.reporting
  name: Refusal reporting into the violations of the requesting run
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-005
- id: component.resolver
  name: Resolution, the post-resolution address check and the outbound connect
  type: library
  parent:
    trustZone: tz.harness
  attributes:
    source: spec.md#FR-004
dataflows:
- id: flow.check
  name: The listener hands the parsed host to the allowlist and the resolver
  source: component.listener
  destination: component.resolver
  assets:
  - asset.allowlist
  attributes:
    crosses: []
- id: flow.claims
  name: The docs tell the consumer what a proxy-only cage and the allowlist prove
  source: component.docs
  destination: actor.consumer
  assets:
  - asset.host-data
  attributes:
    crosses: []
- id: flow.config
  name: The harness builds the allowlist and the proxy-only cage
  source: actor.consumer
  destination: component.allowlist
  assets:
  - asset.allowlist
  attributes:
    crosses: []
- id: flow.direct
  name: The child tries to reach the network without the proxy (direct TCP, UDP, Fast Open, MPTCP, raw IP, DNS,
    other ports)
  source: tz.cage
  destination: tz.internet
  assets:
  - asset.host-data
  - asset.local-services
  attributes:
    crosses:
    - tz.cage
    - tz.kernel
    - tz.internet
- id: flow.local
  name: An outbound connect that lands on a loopback, private, link-local or metadata address
  source: component.resolver
  destination: tz.local-network
  assets:
  - asset.local-services
  attributes:
    crosses:
    - tz.harness
    - tz.local-network
- id: flow.refusal
  name: A refusal is recorded in the violations of the run that made the request
  source: component.listener
  destination: component.reporting
  assets:
  - asset.record
  attributes:
    crosses: []
- id: flow.request
  name: The child sends a CONNECT, absolute-URI or SOCKS5 request to the proxy listener
  source: tz.cage
  destination: component.listener
  assets:
  - asset.allowlist
  - asset.host-data
  attributes:
    crosses:
    - tz.cage
    - tz.harness
- id: flow.resolve
  name: The resolver asks DNS for the addresses of an allowed name
  source: component.resolver
  destination: tz.internet
  assets:
  - asset.host-data
  - asset.local-services
  attributes:
    crosses:
    - tz.harness
    - tz.internet
- id: flow.upstream
  name: The proxy connects out and relays bytes between the child and the allowed host
  source: component.resolver
  destination: tz.internet
  assets:
  - asset.payload
  - asset.host-data
  attributes:
    crosses:
    - tz.harness
    - tz.internet
threats:
- id: threat.allowlist-fail-open
  name: An empty allowlist, a bare wildcard or a single-label wildcard suffix (*.com) builds a proxy that allows
    everything
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-636
  risk:
    impact: 90
    impactComment: every host becomes reachable while the harness believes egress is confined
    likelihood: 40
    likelihoodComment: an empty allowlist allowing everything shipped in an agent sandbox (CVE-2025-66479)
  attributes:
    source: spec.md#US3
    assets:
    - asset.allowlist
    - asset.host-data
    status: mitigated
    actor: actor.consumer
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.allowlist
    - flow.config
    profile: stride
    severity: high
    technique: privilege-escalation-via-config
- id: threat.allowlist-overclaim
  name: The docs present the allowlist as preventing exfiltration, although an allowed host on shared infrastructure
    (a CDN, a registry with user content) still carries data out
  categories:
  - Information Disclosure
  - Repudiation
  risk:
    impact: 50
    impactComment: the consumer allows a wildcard believing it confines data
    likelihood: 40
    likelihoodComment: domain fronting and user uploads to allowed registries are well known
  attributes:
    source: spec.md#Out-of-Scope
    assets:
    - asset.host-data
    status: mitigated
    actor: actor.consumer
    constitution: III. The kernel is the oracle
    elements:
    - component.docs
    - flow.claims
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.direct-egress
  name: Caged code bypasses the proxy (ignoring the proxy variables, UDP, TCP Fast Open, MPTCP, raw IP, IPv6, the
    system DNS resolver, other loopback ports) because the cage relies on Landlock port rules or misses a route
  categories:
  - Elevation of Privilege
  - Information Disclosure
  cwes:
  - CWE-693
  risk:
    impact: 95
    impactComment: unrestricted exfiltration of everything the child can read
    likelihood: 60
    likelihoodComment: TCP Fast Open and MPTCP bypass Landlock port rules on every kernel with them; programs ignore
      proxy variables
  attributes:
    source: spec.md#FR-006
    assets:
    - asset.host-data
    - asset.local-services
    status: mitigated
    actor: actor.caged-code
    constitution: III. The kernel is the oracle
    elements:
    - component.cage-net
    - flow.direct
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.dns-exfil
  name: The proxy resolves a requested name before checking it, so a refused request still carries data out in the
    DNS query (secret.attacker.example)
  categories:
  - Information Disclosure
  cwes:
  - CWE-200
  risk:
    impact: 60
    impactComment: a slow but unlimited channel to any DNS zone
    likelihood: 50
    likelihoodComment: resolve-then-check is the obvious order for address checks
  attributes:
    source: spec.md#Edge-Cases
    assets:
    - asset.host-data
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.resolver
    - flow.resolve
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.dns-rebinding
  name: An allowed name resolves to a loopback, private, link-local or metadata address, directly, through an IPv4-mapped
    or translated IPv6 form, or on a second lookup after the check, and the proxy connects there
  categories:
  - Elevation of Privilege
  - Information Disclosure
  cwes:
  - CWE-350
  - CWE-367
  - CWE-918
  risk:
    impact: 85
    impactComment: the cage reaches daemons and the metadata endpoint that hold credentials
    likelihood: 50
    likelihoodComment: the owner of an allowed zone, or a wildcard under shared hosting, controls the answer
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.local-services
    status: mitigated
    actor: actor.remote
    elements:
    - component.resolver
    - flow.resolve
    - flow.local
    profile: stride
    severity: high
    technique: sensitive-data-exposure
- id: threat.ip-literal-bypass
  name: Caged code names an IP literal in some notation (decimal, octal, hex, short IPv4, IPv6, IPv4-mapped, zone
    id) that a domain allowlist does not recognise as an address, or that matches an allowed range only after a
    different parse
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-20
  risk:
    impact: 85
    impactComment: reaches any address, including local services
    likelihood: 50
    likelihoodComment: IP literals bypassing domain lists is a known failure of agent proxies
  attributes:
    source: spec.md#Clarifications
    assets:
    - asset.allowlist
    - asset.local-services
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.parser
    - component.allowlist
    - flow.request
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.parser-differential
  name: Caged code spells a host so that the allow check and the connect read it differently (NUL byte in SOCKS5,
    percent-encoding, userinfo, Unicode or punycode, trailing dot, a plain-HTTP Host header unlike the URI) and
    reaches a host not on the list
  categories:
  - Elevation of Privilege
  - Tampering
  cwes:
  - CWE-436
  - CWE-20
  risk:
    impact: 90
    impactComment: any host becomes reachable, so the allowlist protects nothing
    likelihood: 60
    likelihoodComment: the NUL-byte differential was found in an agent sandbox proxy in 2026; caged code will try
      every spelling
  attributes:
    source: spec.md#US2
    assets:
    - asset.allowlist
    - asset.host-data
    status: mitigated
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.parser
    - component.listener
    - flow.request
    profile: stride
    severity: high
    technique: injection
- id: threat.payload-tampering
  name: The proxy terminates TLS, alters payloads or forwards changed request bytes after the check
  categories:
  - Tampering
  - Information Disclosure
  risk:
    impact: 70
    impactComment: the harness process would see and could leak the child's traffic
    likelihood: 10
    likelihoodComment: excluded by the clarifications; only a contributor change introduces it
  attributes:
    source: spec.md#FR-007
    assets:
    - asset.payload
    status: mitigated
    actor: actor.contributor
    elements:
    - component.listener
    - flow.upstream
    profile: stride
    severity: medium
    technique: data-tampering-in-transit
- id: threat.proxy-down-fallback
  name: With the proxy stopped, crashed or never started, a connection or a spawn falls back to a direct route instead
    of failing
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-636
  risk:
    impact: 90
    impactComment: the cage has open network while the harness believes it is proxy-only
    likelihood: 25
    likelihoodComment: a convenience fallback is easy to add and hard to notice
  attributes:
    source: spec.md#US3
    assets:
    - asset.host-data
    status: mitigated
    actor: actor.contributor
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.cage-net
    - component.listener
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.proxy-exhaustion
  name: Caged code opens many or slow connections, or keeps them open past the run, and exhausts the harness's threads,
    descriptors or memory
  categories:
  - Denial of Service
  cwes:
  - CWE-400
  risk:
    impact: 50
    impactComment: the harness and its other runs stall
    likelihood: 50
    likelihoodComment: trivial for caged code; the proxy shares the harness process
  attributes:
    source: spec.md#Edge-Cases
    assets:
    - asset.harness
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.listener
    - flow.request
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.record-spoof
  name: A refused host name with control characters or terminal escapes, or a flood of refusals, misleads the harness
    user or exhausts the record
  categories:
  - Repudiation
  cwes:
  - CWE-117
  risk:
    impact: 40
    impactComment: a misleading record may prompt a wrong grant
    likelihood: 30
    likelihoodComment: caged code chooses the refused name
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.record
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.reporting
    - flow.refusal
    profile: stride
    severity: low
    technique: missing-audit-trail
- id: threat.run-confusion
  name: A child reaches the listener of another run or proxy with a broader allowlist, or a refusal is recorded
    in the wrong run
  categories:
  - Elevation of Privilege
  - Repudiation
  risk:
    impact: 70
    impactComment: a run gets another run's egress, and the record misattributes refusals
    likelihood: 30
    likelihoodComment: on macOS every localhost port is one rule away; a proxy serves several runs
  attributes:
    source: spec.md#Key-Entities
    assets:
    - asset.allowlist
    - asset.record
    status: mitigated
    actor: actor.caged-code
    elements:
    - component.listener
    - component.reporting
    - flow.request
    profile: stride
    severity: medium
    technique: cross-tenant-leak
- id: threat.run-identity-unspecified
  name: '[NEEDS CLARIFICATION: how does the proxy tell which run a connection came from (a listener per run, a token,
    the peer process), and can a child of one run connect to another run''s listener?]'
  categories:
  - Spoofing
  risk:
    impact: 0
    likelihood: 0
  attributes:
    source: spec.md#Key-Entities
    assets:
    - asset.allowlist
    status: retired
    actor: actor.caged-code
    disposition: needs-clarification
    elements:
    - component.listener
    profile: stride
    retired_reason: Not present in the regenerated model
    severity: unrated
    technique: identity-spoofing
- id: threat.t2-silent-downgrade
  name: On Linux T2 a proxy-only cage is lowered to Landlock port rules or to no network rule instead of a capability
    gap
  categories:
  - Elevation of Privilege
  risk:
    impact: 90
    impactComment: direct egress through Fast Open or MPTCP while the receipt claims proxy-only
    likelihood: 30
    likelihoodComment: Landlock port rules look like the natural lowering on T2
  attributes:
    source: spec.md#FR-006
    assets:
    - asset.host-data
    status: mitigated
    actor: actor.contributor
    constitution: I. Fail closed, never silently weaker
    elements:
    - component.cage-net
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
mitigations:
- id: mitigation.bounded-proxy
  name: Per-run connection cap, handshake timeout, and every connection of a run closed when the run ends
  riskReduction: 75
  attributes:
    threats:
    - threat.proxy-exhaustion
    status: verified
    kind: preventive
    requirements:
    - SR-011
    touchpoints:
    - crates/procage-proxy/src/lib.rs
- id: mitigation.check-resolved-connect-checked
  name: Resolve once after the name check; refuse any non-public address (including mapped and translated IPv6 forms)
    unless allowlisted; connect only to a checked address, never re-resolving
  riskReduction: 85
  attributes:
    threats:
    - threat.dns-rebinding
    - threat.dns-exfil
    status: verified
    kind: preventive
    requirements:
    - SR-003
    - SR-004
    touchpoints:
    - crates/procage-proxy/src/lib.rs
    - crates/procage-proxy/src/addr.rs
    - crates/procage-proxy/src/resolve.rs
- id: mitigation.escaped-capped-record
  name: Refused hosts are recorded escaped (no control bytes) and within the run's violation cap, the rest counted
  riskReduction: 70
  attributes:
    threats:
    - threat.record-spoof
    status: verified
    kind: detective
    requirements:
    - SR-012
    touchpoints:
    - crates/procage-proxy/src/lib.rs
    - crates/procage/src/violation.rs
- id: mitigation.honest-claims
  name: THREAT_MODEL gains the parser-differential escape class with the suite as evidence; docs say the allowlist
    binds host names, not content, and name shared-hosting and fronting residue
  riskReduction: 70
  attributes:
    threats:
    - threat.allowlist-overclaim
    - threat.parser-differential
    status: verified
    kind: detective
    requirements:
    - SR-013
    touchpoints:
    - crates/procage/THREAT_MODEL.md
    - site/content/docs/proxy.md
- id: mitigation.kernel-boundary
  name: macOS allows outbound to the proxy ports only; Linux T1 runs the child in a network namespace whose only
    endpoint is the proxy listener; Landlock is never the sole boundary; direct-egress canaries on every proxy tier
  riskReduction: 90
  attributes:
    threats:
    - threat.direct-egress
    - threat.proxy-down-fallback
    status: verified
