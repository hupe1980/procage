    - crates/procage/src/linux/mod.rs
- id: mitigation.lane-tests
  name: A shell, a REPL and a full-screen program run caged through the terminal on every lane; the docs claim only
    that
  riskReduction: 80
  attributes:
    threats:
    - threat.claim-overstates
    status: required
    kind: detective
    requirements:
