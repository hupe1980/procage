  riskReduction: 80
  attributes:
    threats:
    - threat.sti-own
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - crates/procage-policy/src/lower/macos.rs
    - crates/procage-policy/src/lower/linux.rs
    - crates/procage/tests/escape_macos.rs
    - crates/procage/tests/escape_linux.rs
- id: mitigation.syscall-session
  name: The session step is setsid then ioctl(TIOCSCTTY) on descriptor 0, both system calls; a multithreaded spawn
