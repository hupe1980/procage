  riskReduction: 85
  attributes:
    threats:
    - threat.child-unsafe
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - crates/procage/src/macos/sys.rs
    - crates/procage/src/linux/sys.rs
- id: mitigation.untrusted-output
  name: The Pty documentation states that its output is the cage's untrusted bytes and must not reach a terminal
