threats:
- id: threat.child-unsafe
  name: Acquiring the controlling terminal in the child allocates, takes a lock or calls a library function between
    fork and execve, so a multithreaded parent deadlocks
  categories:
  - Denial of Service
  risk:
    impact: 60
    impactComment: hung spawns in a multithreaded harness
    likelihood: 25
    likelihoodComment: tcsetsid-style helpers and terminal name lookups are library code
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.controller
    status: mitigated
    actor: actor.contributor
    constitution: IV. Syscalls only between fork and exec
    disposition: threat
    elements:
    - component.child-session
    profile: stride
    severity: low
    technique: resource-exhaustion
- id: threat.claim-overstates
  name: The docs claim interactive shells, REPLs and full-screen programs run caged, or that other terminals are
    out of reach, without a caged test on every lane
  categories:
  - Repudiation
  risk:
    impact: 50
    impactComment: consumers rely on unmeasured behaviour
    likelihood: 50
    likelihoodComment: the feature is easy to demo on one OS only
  attributes:
    source: spec.md#SC-001
    assets:
    - asset.claim
    status: open
    actor: actor.contributor
    constitution: III. The kernel is the oracle
    disposition: threat
    elements:
    - component.docs
    - flow.claims
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.descriptor-leak
  name: The controller side or the parent's copy of the terminal end stays open in the child, or in a child spawned
    concurrently by another thread, so a run reads or writes another run's terminal
  categories:
  - Information Disclosure
  cwes:
  - CWE-403
  risk:
    impact: 75
    impactComment: another run's input and output are readable and writable
    likelihood: 35
    likelihoodComment: openpty does not set close-on-exec atomically; std::process::Command keeps its Stdio until
      dropped
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.terminals
    - asset.controller
    status: mitigated
    actor: actor.caged-code
    constitution: V. Hygiene by default
    disposition: threat
    elements:
    - component.pty-setup
    - flow.handover
    profile: stride
    severity: high
    technique: cross-tenant-leak
- id: threat.escape-sequences
  name: A caged child writes terminal escape sequences that a harness forwards unfiltered to the user's own terminal
    (clipboard writes, title reports, answerback)
  categories:
  - Tampering
  risk:
    impact: 50
    impactComment: the user's terminal emulator acts on bytes from the cage
    likelihood: 40
    likelihoodComment: harnesses commonly pipe the controller output to the user terminal
  attributes:
    source: spec.md#Out-of-Scope
    assets:
    - asset.terminals
    status: mitigated
    actor: actor.caged-code
    disposition: threat
    elements:
    - component.pty-handle
    - flow.output
    profile: stride
    severity: medium
    technique: injection
- id: threat.exec-fallback
  name: Cage::exec or Cage::exec_session given Tty::NewPty silently runs with the caller's terminal, the injection-prone
    mode the caller did not ask for
  categories:
  - Elevation of Privilege
  risk:
    impact: 80
    impactComment: the child shares the caller's terminal
    likelihood: 30
    likelihoodComment: exec has no handle to return a controller through
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.terminals
    status: mitigated
    actor: actor.consumer
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.pty-setup
    profile: stride
    severity: medium
    technique: privilege-escalation-via-config
- id: threat.other-terminal
  name: A caged child opens another terminal device (the caller's, the user's or another run's) through a terminal
    grant broader than its own device, and reads it or pushes input that a shell runs outside the sandbox
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-284
  risk:
    impact: 95
    impactComment: keystrokes run outside the sandbox, or another session is read
    likelihood: 50
    likelihoodComment: reusing the Tty::Inherit rules (all of /dev/pts, /dev/ttys*) is the obvious first implementation
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.terminals
    - asset.host
    status: mitigated
    actor: actor.caged-code
    constitution: I. Fail closed, never silently weaker
    disposition: threat
    elements:
    - component.lowering
    - flow.device
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.outlive
  name: A descendant keeps the terminal open, or job control moves it to another session, so it survives the run's
    end and keeps reading or writing the controller side
  categories:
  - Elevation of Privilege
  risk:
    impact: 70
    impactComment: a process outlives the run with a live terminal
    likelihood: 30
    likelihoodComment: shells start background jobs in their own process groups
  attributes:
    source: spec.md#US1
    assets:
    - asset.controller
    - asset.host
    status: mitigated
    actor: actor.caged-code
    constitution: V. Hygiene by default
    disposition: threat
    elements:
    - component.child-session
    - flow.output
    profile: stride
    severity: medium
    technique: broken-access-control
- id: threat.sti-own
  name: A caged child pushes input into its own new terminal (TIOCSTI), which a harness that echoes or replays the
    controller side could act on
  categories:
  - Tampering
  risk:
    impact: 50
    impactComment: injected bytes reach only the controller the harness reads
    likelihood: 30
    likelihoodComment: TIOCSTI on its own controlling terminal is allowed by the kernel without the hard-deny class
  attributes:
    source: spec.md#US1
    assets:
    - asset.controller
    status: mitigated
    actor: actor.caged-code
    disposition: threat
    elements:
    - component.lowering
    - flow.device
    profile: stride
    severity: low
    technique: injection
