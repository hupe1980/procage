    - crates/procage/THREAT_MODEL.md
    - README.md
- id: mitigation.run-end
  name: Ending the run kills every process of it as before; the child leads its terminal's session, so job control
    stays in it
  riskReduction: 80
  attributes:
    threats:
    - threat.outlive
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - crates/procage/src/macos/child.rs
    - crates/procage/src/linux/child.rs
- id: mitigation.sti-denied
  name: The terminal-injection hard-deny class stays in force with Tty::NewPty, so TIOCSTI on the own terminal fails
