    status: verified
    kind: deterrent
    requirements:
    - SR-007
    touchpoints:
    - crates/procage/src/pty.rs
requirements:
- id: SR-001
  statement: With Tty::NewPty the child MUST reach only its own terminal device and /dev/tty, under every base version
    including none; opening any other terminal device MUST fail.
  priority: P1
  mitigations:
  - mitigation.exact-device
  acceptance:
  - given: a caged child with Tty::NewPty and a second terminal the test opened
    then: both opens fail
    when: the child opens the second terminal's device for reading and writing
  - given: a policy without a base profile and Tty::NewPty
    then: all succeed
    when: the child reads and writes its terminal and sets its attributes
  tasks: []
- id: SR-002
  statement: With Tty::NewPty, TIOCSTI on the child's own terminal MUST fail unless the terminal-injection class
    is waived by name.
  priority: P2
  mitigations:
  - mitigation.sti-denied
  acceptance:
  - given: a caged child with Tty::NewPty
    then: the call fails with EPERM
    when: it pushes a byte into its own terminal
  - given: the same policy with the terminal-injection class waived
    then: the byte reaches only the controller side
    when: it pushes a byte
  tasks: []
- id: SR-003
  statement: The controller side and the parent's copy of the terminal end MUST NOT be open in any caged child;
    the parent MUST hold no copy of the terminal end after the spawn.
  priority: P1
  mitigations:
  - mitigation.cloexec-handover
  acceptance:
  - given: two runs with Tty::NewPty spawned concurrently from different threads
    then: none is either run's controller or the other run's terminal
    when: each child lists its open descriptors
  - given: a run whose child exited
    then: the read ends (EOF or EIO) instead of blocking
    when: the caller reads the controller side
  tasks: []
- id: SR-004
  statement: The child MUST acquire its controlling terminal with system calls only (setsid, ioctl TIOCSCTTY), and
    spawns with Tty::NewPty from a multithreaded parent MUST succeed.
  priority: P2
  mitigations:
  - mitigation.syscall-session
  acceptance:
  - given: a parent with several threads allocating and locking
    then: every child starts with its terminal as controlling terminal
    when: it spawns many children with Tty::NewPty
  tasks: []
- id: SR-005
  statement: When a run with Tty::NewPty ends, every process of the run, including background jobs a shell started
    in the terminal, MUST be dead.
  priority: P1
  mitigations:
  - mitigation.run-end
  acceptance:
  - given: a shell in a new terminal that started a background job
    then: the shell and the job are dead
    when: the run ends
  tasks: []
- id: SR-006
  statement: Cage::exec and Cage::exec_session MUST refuse Tty::NewPty with a typed error before anything is changed.
  priority: P1
  mitigations:
  - mitigation.exec-refuses
  acceptance:
  - given: a cage with Tty::NewPty
    then: it returns the unsupported-setting error and the process is unchanged
    when: exec or exec_session is called
  tasks: []
- id: SR-007
  statement: The Pty documentation MUST state that the controller side carries the cage's untrusted bytes, including
    escape sequences, and that procage does not filter them.
  priority: P3
  mitigations:
  - mitigation.untrusted-output
  acceptance:
  - given: the rustdoc of Pty
    then: it says the bytes are untrusted and unfiltered
    when: a reader looks for how to treat output
  tasks: []
- id: SR-008
  statement: An interactive shell, a REPL and a full-screen program MUST run caged through Tty::NewPty in tests
    on every macOS and Linux lane, and the docs MUST claim no more than those tests show.
  priority: P2
  mitigations:
  - mitigation.lane-tests
  acceptance:
  - given: each CI lane
    then: the shell answers a command, the REPL evaluates an expression and the full-screen program draws and quits
    when: the terminal tests run
  tasks: []
verification:
- id: verification.sr-001.2026-11-03
  requirement: SR-001
  method: test
  evidence: crates/procage/tests/escape_macos.rs::r22_a_new_terminal_keeps_input_injection_inside_the_run
  result: pass
  verdict: verified
  justification: A child with Tty::NewPty opens a second terminal the test made for read and write and gets an open
    error, also with terminal injection waived (escape_macos and escape_linux on T1 and T2); pty.rs::without_a_base_the_terminal_works_and_resizes
    reads and resizes the own terminal with no base on Linux and base V1 (no terminal rule) on macOS; procage-policy
    tests/base.rs::terminals_by_tty_mode shows exactly the extension class and /dev/tty with and without a base.
  verified_at: '2026-11-03T15:10:59Z'
  commit: 50c8ab6
- id: verification.sr-002.2026-11-03
  requirement: SR-002
  method: test
  evidence: crates/procage/tests/escape_linux.rs::r22_a_new_terminal_keeps_input_injection_inside_the_run
  result: pass
  verdict: verified
  justification: TIOCSTI on the child's own new terminal returns EPERM on macOS (hid-control allowed, so the class
    alone refuses) and on Linux T1 and T2; waived, it succeeds and the byte is echoed only on the run's own controller.
  verified_at: '2026-11-03T15:10:59Z'
  commit: 50c8ab6
- id: verification.sr-003.2026-11-03
  requirement: SR-003
  method: test
  evidence: crates/procage/tests/pty.rs::concurrent_runs_from_a_busy_parent_get_only_their_own_terminal
  result: pass
  verdict: verified
  justification: 200 runs from four threads list their open descriptors through ls /dev/fd and see only 0 to 3 (no
    controller, no other run's terminal); pty.rs::the_run_end_closes_the_terminal_and_kills_its_jobs shows the controller
    read ending once the run ends, so the parent holds no copy of the device.
  verified_at: '2026-11-03T15:10:59Z'
  commit: 50c8ab6
- id: verification.sr-004.2026-11-03
  requirement: SR-004
  method: test
  evidence: crates/procage/tests/pty.rs::concurrent_runs_from_a_busy_parent_get_only_their_own_terminal
  result: pass
  verdict: verified
