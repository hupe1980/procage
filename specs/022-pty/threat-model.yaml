    - crates/procage-policy/src/lower/linux.rs
    - crates/procage/src/macos/mod.rs
    - crates/procage/src/linux/spawn.rs
- id: mitigation.exec-refuses
  name: Cage::exec and Cage::exec_session refuse Tty::NewPty with a typed error
  riskReduction: 95
  attributes:
