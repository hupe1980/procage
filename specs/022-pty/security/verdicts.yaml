verdicts:
  - requirement: SR-001
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_macos.rs::r22_a_new_terminal_keeps_input_injection_inside_the_run
    result: pass
    justification: A child with Tty::NewPty opens a second terminal the test made for read and write and gets an open error, also with terminal injection waived (escape_macos and escape_linux on T1 and T2); pty.rs::without_a_base_the_terminal_works_and_resizes reads and resizes the own terminal with no base on Linux and base V1 (no terminal rule) on macOS; procage-policy tests/base.rs::terminals_by_tty_mode shows exactly the extension class and /dev/tty with and without a base.
  - requirement: SR-002
    verdict: verified
    method: test
    evidence: crates/procage/tests/escape_linux.rs::r22_a_new_terminal_keeps_input_injection_inside_the_run
    result: pass
    justification: TIOCSTI on the child's own new terminal returns EPERM on macOS (hid-control allowed, so the class alone refuses) and on Linux T1 and T2; waived, it succeeds and the byte is echoed only on the run's own controller.
  - requirement: SR-003
    verdict: verified
    method: test
    evidence: crates/procage/tests/pty.rs::concurrent_runs_from_a_busy_parent_get_only_their_own_terminal
    result: pass
    justification: 200 runs from four threads list their open descriptors through ls /dev/fd and see only 0 to 3 (no controller, no other run's terminal); pty.rs::the_run_end_closes_the_terminal_and_kills_its_jobs shows the controller read ending once the run ends, so the parent holds no copy of the device.
  - requirement: SR-004
    verdict: verified
    method: test
    evidence: crates/procage/tests/pty.rs::concurrent_runs_from_a_busy_parent_get_only_their_own_terminal
    result: pass
    justification: Four threads allocating and locking run beside four spawning threads; every child opens /dev/tty, so each got its terminal as controlling terminal from the setsid and TIOCSCTTY step; 20 consecutive passes on macOS after the marker-search fix, and on Linux T1 and T2.
  - requirement: SR-005
    verdict: verified
    method: test
    evidence: crates/procage/tests/pty.rs::the_run_end_closes_the_terminal_and_kills_its_jobs
    result: pass
    justification: An interactive shell starts sleep in the background; dropping the handle kills it within five seconds and the controller read ends, on macOS and Linux T1 and T2.
  - requirement: SR-006
    verdict: verified
    method: test
    evidence: crates/procage/tests/pty.rs::exec_refuses_a_new_terminal
    result: pass
    justification: Cage::exec and Cage::exec_session return Unsupported::Setting for Tty::NewPty and the test process continues; spawn_macos.rs::refusals_before_any_child and native.rs::errors_explain_themselves assert the named setting.
  - requirement: SR-007
    verdict: verified
    method: review
    evidence: crates/procage/src/pty.rs:16
    result: pass
    justification: The Pty rustdoc says the bytes are the cage's untrusted output, escape sequences included, unfiltered, and must not reach a terminal or anything that runs them; the site and THREAT_MODEL repeat it.
  - requirement: SR-008
    verdict: implemented-unverified
    method: review
    evidence: crates/procage/tests/pty.rs:1
    result: inconclusive
    justification: The shell, REPL and full-screen tests pass on macOS 26.6.2 and in containers on Linux 7.0 (T1, T2), and ci.yml and kernel-lane.sh run them on every lane, but no CI lane has run this commit yet.
