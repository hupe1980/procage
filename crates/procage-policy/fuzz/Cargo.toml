[package]
name = "procage-policy-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: it needs nightly and libFuzzer, which the stable gates
# of the main workspace do not.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
procage-policy = { path = "..", features = ["serde"] }
serde_json = "1"

[[bin]]
name = "quote"
path = "fuzz_targets/quote.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glob"
path = "fuzz_targets/glob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower"
path = "fuzz_targets/lower.rs"
test = false
doc = false
bench = false
