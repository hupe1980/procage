[workspace]
members = ["crates/procage", "crates/procage-policy", "crates/procage-proxy", "crates/procage-kernel-facts"]
# The fuzz packages need nightly and libfuzzer; each is its own workspace.
exclude = ["crates/procage-policy/fuzz", "crates/procage-proxy/fuzz"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/procage"
authors = ["hupe1980"]

[workspace.dependencies]
procage-policy = { path = "crates/procage-policy", version = "0.4.0" }
procage-proxy = { path = "crates/procage-proxy", version = "0.4.0" }
libc = "0.2"
serde_json = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
sha2 = { version = "0.11", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
